function svgRevenue(values){const mx=Math.max(1,...values),W=500,H=164;const pts=values.map((v,i)=>[18+i*(W-36)/(values.length-1),H-15-(v/mx)*(H-35)]);const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');return `<svg class="chart-svg" viewBox="0 0 ${W} 190" role="img" aria-label="Gráfico de evolución de ingresos"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#945bf7" stop-opacity=".44"/><stop offset="100%" stop-color="#4465e8" stop-opacity="0"/></linearGradient></defs>${[30,65,100,135,170].map(y=>`<line class="grid-line" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`).join('')}<path class="chart-area" d="${path} L${pts.at(-1)[0]},${H} L${pts[0][0]},${H} Z"/><path class="chart-line" d="${path}"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${values[i]===mx?5:3.6}"><title>${money(values[i])}</title></circle>`).join('')}</svg>`}

function renderHome(){const todayApps=apps().filter(a=>a.start.startsWith(today()));const active=todayApps.filter(a=>!['cancelado','ausente'].includes(a.status));const pending=todayApps.filter(a=>a.status==='pendiente').length;const rangeDays=dailyArray(state.range);const arr=apps().filter(a=>rangeDays.includes(a.start.slice(0,10)));const sums=rangeDays.map(d=>arr.filter(a=>a.start.startsWith(d)&&a.status!=='cancelado').length);const revenues=rangeDays.map(d=>totalPaid(state.payments.filter(p=>p.date===d&&apps().some(a=>a.id===p.appointmentId))));const scheduled=arr.filter(a=>!['cancelado','ausente'].includes(a.status));const completed=arr.filter(a=>a.status==='atendido');const cancels=arr.filter(a=>a.status==='cancelado').length;const bookedMinutes=scheduled.reduce((n,a)=>n+a.duration,0);const totalMinutes=state.pros.filter(p=>p.active).length*state.range*7*60;const occupancy=totalMinutes?Math.round(bookedMinutes/totalMinutes*100):0;const upcoming=apps().filter(a=>a.start>=today()+'T00:00'&&['pendiente','confirmado'].includes(a.status)).slice(0,5);const breakdown=state.branches.map(b=>[b,arr.filter(a=>a.branch===b).length]);let appCount=arr.length;const awaited=apps().filter(a=>a.status==='pendiente'&&a.start>=today()).length;const unpaid=state.payments.filter(p=>p.status==='pendiente');root.innerHTML=`<div class="grid kpis">
  <div class="card kpi"><div class="kpi-top"><div class="kpi-label">${icon('calendar')}Turnos de hoy</div><div class="kpi-icon">${icon('calendar')}</div></div><div class="kpi-value">${todayApps.length} <span class="kpi-change">${active.length} activos</span></div><div class="kpi-bottom">${todayApps.filter(a=>a.status==='confirmado').length} confirmados · ${pending} pendientes</div></div>
  <div class="card kpi"><div class="kpi-top"><div class="kpi-label">${icon('coin')}Ingresos registrados</div><div class="kpi-icon">${icon('coin')}</div></div><div class="kpi-value">${money(totalPaid(state.payments.filter(p=>p.date===today()&&apps().some(a=>a.id===p.appointmentId))))}</div><div class="kpi-bottom">Cobros marcados como pagados hoy</div></div>
  <div class="card kpi"><div class="kpi-top"><div class="kpi-label">${icon('x')}Cancelaciones</div><div class="kpi-icon">${icon('x')}</div></div><div class="kpi-value">${cancels}</div><div class="kpi-bottom">${appCount?Math.round(cancels/appCount*100):0}% de turnos en el período</div></div>
  <div class="card kpi"><div class="kpi-top"><div class="kpi-label">${icon('chart')}Ocupación estimada</div><div class="kpi-icon">${icon('trend')}</div></div><div class="kpi-value">${occupancy}%</div><div class="kpi-bottom">Basado en ${scheduled.length} turnos y disponibilidad teórica</div></div></div>
  <div class="section-grid">
   <section class="card card-pad">${panelHeader('Actividad de turnos',`Últimos ${state.range} días`, 'Ver turnos','goTurnos')}<div class="total-pill">${icon('calendar')} ${scheduled.length}<span class="trend">turnos activos</span></div>${barsChart(rangeDays.slice(-7),sums.slice(-7))}</section>
   <section class="card card-pad">${panelHeader('Evolución de ingresos','Cobros efectivamente registrados','Ver cobros','goCobros')}<div class="total-pill">${icon('coin')} ${money(revenues.reduce((a,b)=>a+b,0))}<span class="trend">${completed.length} atenciones</span></div>${svgRevenue(revenues)}<div class="chart-labels">${rangeDays.filter((_,i)=>state.range===7||i%2===0).map(d=>`<span>${esc(new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short'}))}</span>`).join('')}</div></section>
   <section class="card card-pad gauge-card">${panelHeader('Nivel de ocupación','Uso teórico de la capacidad disponible')}${gauge(occupancy)}<div class="gauge-foot">${bookedMinutes} / ${totalMinutes} minutos estimados</div></section>
  </div>
  <div class="section-grid bottom-grid">
   <section class="card card-pad">${panelHeader('Turnos por sucursal','Distribución de las reservas','Ver turnos','goTurnos')}<div class="total-pill">${icon('pin')} ${arr.length}<span class="trend">en el período</span></div><div class="metric-breakdown">${breakdown.map(([branch,n])=>`<div class="breakdown-row"><b>${esc(branch)}</b><span>${n}</span><div class="microbar"><div style="width:${appCount?Math.round(n/appCount*100):0}%"></div></div><span>${appCount?Math.round(n/appCount*100):0}%</span></div>`).join('')}</div><p class="hint" style="margin-top:17px">Las cifras reflejan los registros de la demo.</p></section>
   <section class="card card-pad">${panelHeader('Próximos turnos','Siguientes reservas de tu agenda','Ver agenda','goAgenda')}<div class="slot-list">${upcoming.length?upcoming.map(a=>`<div class="slot" data-edit-appointment="${esc(a.id)}" style="cursor:pointer">${avatar(getC(a.customerId).name)}<span class="slot-name">${esc(getC(a.customerId).name)}</span><span class="service-pill">${esc(getS(a.serviceId).name)}</span><span class="slot-time">${esc(timeFrom(a.start))}</span></div>`).join(''):hintEmpty('Sin próximos turnos','Creá el primero desde la agenda')}</div></section>
   <section class="card card-pad">${panelHeader('Acciones prioritarias','Tareas para mantener el día organizado')}<div class="action-list"><button class="action-row alert" data-action="pendingAppointments">${icon('calendar')}<span>${awaited} turnos pendientes de confirmación</span>${icon('arrow')}</button><button class="action-row" data-action="prepareReminders">${icon('bell')}<span>Preparar recordatorios (copia manual)</span>${icon('arrow')}</button><button class="action-row" data-action="goCobros">${icon('card')}<span>${unpaid.length} cobros pendientes · ${money(unpaid.reduce((s,p)=>s+p.amount,0))}</span>${icon('arrow')}</button><button class="action-row" data-action="goEquipo">${icon('users')}<span>Revisar disponibilidad del equipo</span>${icon('arrow')}</button></div></section>
  </div>`;}

function renderClientes(){root.innerHTML=headerPage('Clientes','Organizá los contactos y el historial de visitas.',button('Agregar cliente','addCustomer',true,'plus'))+`<div class="card-grid">${state.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const all=state.appointments.filter(a=>a.customerId===c.id),att=all.filter(a=>a.status==='atendido').length;return `<article class="card item-card"><div class="client-top">${avatar(c.name)}<div><h3>${esc(c.name)}</h3><p>${esc(c.phone||'Sin teléfono')}</p></div></div><p>${all.length} turnos registrados · ${att} atendidos</p><div class="item-bottom"><span class="meta">${c.email?esc(c.email):'Ficha de cliente'}</span><button class="btn btn-secondary btn-sm" data-edit-customer="${esc(c.id)}">Ver ficha</button></div></article>`}).join('')}</div>`;}

function closeModal(){document.getElementById('modalRoot').innerHTML='';modal=null}
const optionList=(arr,id,getLabel)=>arr.map(x=>`<option value="${esc(x.id)}" ${id===x.id?'selected':''}>${esc(getLabel(x))}</option>`).join('');
function openAppointment(id=''){const a=state.appointments.find(x=>x.id===id);const defaults={customerId:state.customers[0]?.id,serviceId:'s1',proId:'p1',branch:state.branches[0],start:addDays(today(),1)+'T11:00',status:'confirmado'};const v={...defaults,...a};const date=v.start.slice(0,10),time=timeFrom(v.start);modalFrame(a?'Editar turno':'Crear nuevo turno',`<div class="field-grid"><div class="field full"><label for="maCustomer">Cliente</label><select name="customerId" id="maCustomer" required>${optionList(state.customers,v.customerId,x=>x.name)}</select><span class="hint">Para un cliente nuevo, agregalo primero en Clientes.</span></div><div class="field"><label for="maService">Servicio</label><select name="serviceId" id="maService" required>${optionList(state.services.filter(s=>s.active||s.id===v.serviceId),v.serviceId,x=>x.name+' · '+x.duration+' min')}</select></div><div class="field"><label for="maPro">Profesional</label><select name="proId" id="maPro" required></select></div><div class="field"><label for="maDate">Fecha</label><input name="date" id="maDate" type="date" value="${date}" required/></div><div class="field"><label for="maTime">Hora</label><input name="time" id="maTime" type="time" step="900" value="${time}" required/></div><div class="field"><label for="maBranch">Sucursal</label><select id="maBranch" name="branch">${state.branches.map(b=>`<option value="${esc(b)}" ${v.branch===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div><div class="field"><label for="maStatus">Estado</label><select id="maStatus" name="status">${['pendiente','confirmado','atendido','cancelado','ausente'].map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${stateText[s]}</option>`).join('')}</select></div></div><div class="notice">El precio del servicio queda registrado en el turno. Al cambiar el precio del catálogo no se modifican los turnos existentes.</div>${a?`<p class="hint">Precio histórico actual: <b>${money(a.price)}</b>. ${paymentFor(a.id)?'Este turno tiene un registro de cobro.':''}</p>`:''}`,'appointment',id);updateModalPros(v.proId)}
function updateModalPros(selected){const sid=document.getElementById('maService')?.value;const sel=document.getElementById('maPro');if(!sel)return;const candidates=state.pros.filter(p=>p.services.includes(sid)&&p.active);const chosen=candidates.some(p=>p.id===selected)?selected:candidates[0]?.id;sel.innerHTML=optionList(candidates,chosen,x=>x.name);if(!candidates.length)sel.innerHTML='<option value="">Sin profesional disponible</option>'}
function validateSlot({date,time,proId,duration,ignoreId='',status='confirmado'}){if(['cancelado','ausente'].includes(status))return '';
  const hours=state.business.hours[new Date(date+'T12:00:00').getDay()]||['09:00','18:00',false];if(!hours[2])return 'El negocio está cerrado ese día.';
  const start=Number(time.slice(0,2))*60+Number(time.slice(3,5)),begin=Number(hours[0].slice(0,2))*60+Number(hours[0].slice(3,5)),end=Number(hours[1].slice(0,2))*60+Number(hours[1].slice(3,5));if(start<begin||start+Number(duration)>end)return `El turno debe entrar completo en el horario de ${hours[0]} a ${hours[1]}.`;
  if(state.timeOff.some(o=>o.proId===proId&&o.date===date))return 'El profesional tiene esa fecha bloqueada.';
  if(state.appointments.some(a=>a.id!==ignoreId&&a.proId===proId&&a.start.slice(0,10)===date&&!['cancelado','ausente'].includes(a.status)&&start<minute(a.start)+a.duration&&start+Number(duration)>minute(a.start)))return 'Ese profesional ya tiene un turno que se superpone en ese horario.';
  return '';
}
function setFormError(msg){const el=document.getElementById('formError');if(el)el.textContent=msg;else toast(msg)}
function submitAppointment(f,id){const o=Object.fromEntries(new FormData(f));const service=getS(o.serviceId);const pro=getP(o.proId);const prev=state.appointments.find(a=>a.id===id);if(!pro.services.includes(service.id)){setFormError('El profesional no realiza ese servicio.');return}
  const err=validateSlot({date:o.date,time:o.time,proId:o.proId,duration:service.duration,ignoreId:id,status:o.status});if(err){setFormError(err);return}
  const a={id:id||uid('a'),customerId:o.customerId,serviceId:o.serviceId,proId:o.proId,start:`${o.date}T${o.time}`,duration:service.duration,price:prev&&prev.serviceId===o.serviceId?prev.price:service.price,status:o.status,branch:o.branch};
  if(prev)state.appointments[state.appointments.indexOf(prev)]=a;else state.appointments.push(a);
  if(o.status==='atendido'&&!paymentFor(a.id))state.payments.push({id:uid('pay'),appointmentId:a.id,amount:a.price,status:'pendiente',method:'',date:today()});
  persist();closeModal();render();toast(prev?'Turno actualizado correctamente':'Turno creado en la agenda');}
function openCustomer(id=''){const c=state.customers.find(x=>x.id===id)||{name:'',phone:'',email:'',notes:''};const history= id?state.appointments.filter(a=>a.customerId===id).slice().sort((a,b)=>b.start.localeCompare(a.start)).slice(0,5):[];modalFrame(id?'Ficha del cliente':'Nuevo cliente',`<div class="field-grid"><div class="field full"><label for="mcName">Nombre y apellido</label><input id="mcName" name="name" required maxlength="90" value="${esc(c.name)}"></div><div class="field"><label for="mcPhone">Teléfono</label><input id="mcPhone" name="phone" required maxlength="35" value="${esc(c.phone)}"></div><div class="field"><label for="mcEmail">Correo</label><input id="mcEmail" name="email" type="email" value="${esc(c.email)}"></div><div class="field full"><label for="mcNotes">Notas operativas</label><textarea id="mcNotes" name="notes" rows="3" placeholder="Preferencias relevantes para el servicio">${esc(c.notes)}</textarea></div></div>${id?`<h4 class="section-label">Últimos turnos</h4><div class="detail-stack">${history.map(a=>`<div class="detail-line"><span>${esc(fmtDate(a.start.slice(0,10)))} · ${esc(getS(a.serviceId).name)}</span>${tag(a.status)}</div>`).join('')||'<p class="hint">Sin turnos anteriores.</p>'}</div>`:''}`,'customer',id)}
function submitCustomer(f,id){const o=Object.fromEntries(new FormData(f));const phone=o.phone.replace(/\D/g,'');if(phone.length<7){setFormError('Ingresá un teléfono válido (mínimo 7 dígitos).');return}if(state.customers.some(c=>c.id!==id&&c.phone.replace(/\D/g,'')===phone)){setFormError('Ya hay un cliente con ese teléfono.');return}const prev=state.customers.find(x=>x.id===id);const customer={id:id||uid('c'),name:o.name.trim(),phone:o.phone.trim(),email:o.email.trim(),notes:o.notes.trim()};if(prev)state.customers[state.customers.indexOf(prev)]=customer;else state.customers.push(customer);persist();closeModal();render();toast(id?'Ficha actualizada':'Cliente creado')}
function openService(id=''){const s=state.services.find(x=>x.id===id)||{name:'',cat:'',duration:45,price:0,active:true};modalFrame(id?'Editar servicio':'Agregar servicio',`<div class="field-grid"><div class="field full"><label>Nombre del servicio</label><input name="name" required maxlength="80" value="${esc(s.name)}"></div><div class="field full"><label>Categoría</label><input name="cat" required maxlength="60" value="${esc(s.cat)}" placeholder="Peluquería, estética, consulta..."></div><div class="field"><label>Duración (minutos)</label><input name="duration" type="number" min="15" max="480" step="15" required value="${s.duration}"></div><div class="field"><label>Precio (ARS)</label><input name="price" type="number" min="0" max="100000000" step="1" required value="${s.price}"></div><div class="field full"><label><input type="checkbox" name="active" ${s.active?'checked':''}> Servicio activo</label></div></div><div class="notice">Los turnos ya agendados conservan su precio y duración históricos.</div>`,'service',id)}
function submitService(f,id){const o=Object.fromEntries(new FormData(f));if(!o.name.trim()||Number(o.duration)<=0){setFormError('Revisá los datos del servicio.');return}const prev=state.services.find(x=>x.id===id);const s={id:id||uid('s'),name:o.name.trim(),cat:o.cat.trim(),duration:Number(o.duration),price:Number(o.price),active:!!o.active};if(prev)state.services[state.services.indexOf(prev)]=s;else state.services.push(s);persist();closeModal();render();toast(id?'Servicio actualizado':'Servicio creado')}
function openProfessional(id=''){const p=state.pros.find(x=>x.id===id)||{name:'',role:'',services:[],color:'#7454eb',active:true};modalFrame(id?'Editar profesional':'Nuevo profesional',`<div class="field-grid"><div class="field full"><label>Nombre y apellido</label><input name="name" required maxlength="90" value="${esc(p.name)}"></div><div class="field full"><label>Especialidad / puesto</label><input name="role" required maxlength="90" value="${esc(p.role)}"></div><div class="field full"><span>Servicios que realiza</span>${state.services.map(s=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:4px 14px 6px 0;font-size:12px"><input type="checkbox" name="service" value="${esc(s.id)}" ${p.services.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</div><div class="field full"><label><input name="active" type="checkbox" ${p.active?'checked':''}> Profesional activo</label></div></div>`,'professional',id)}
function submitProfessional(f,id){const o=Object.fromEntries(new FormData(f));const ss=[...f.querySelectorAll('[name="service"]:checked')].map(x=>x.value);if(!ss.length){setFormError('Asigná al menos un servicio.');return}const prev=state.pros.find(x=>x.id===id);const p={id:id||uid('p'),name:o.name.trim(),role:o.role.trim(),services:ss,color:prev?.color||'#7454eb',active:!!o.active};if(prev)state.pros[state.pros.indexOf(prev)]=p;else state.pros.push(p);persist();closeModal();render();toast(id?'Profesional actualizado':'Profesional agregado')}
function openBlock(proId){const p=getP(proId);const current=state.timeOff.filter(o=>o.proId===proId&&o.date>=today());modalFrame('Bloquear disponibilidad · '+p.name,`<div class="field-grid"><div class="field"><label>Fecha sin disponibilidad</label><input name="date" type="date" min="${today()}" value="${addDays(today(),1)}" required></div><div class="field"><label>Motivo (interno)</label><input name="reason" placeholder="Descanso, evento personal..."></div></div><h4 class="section-label">Próximas fechas bloqueadas</h4><div class="detail-stack">${current.length?current.map(x=>`<div class="detail-line"><span>${esc(fmtDate(x.date))} · ${esc(x.reason||'No disponible')}</span><button type="button" class="text-link" data-remove-timeoff="${esc(x.id)}">Quitar</button></div>`).join(''):'<p class="hint">No hay bloqueos futuros.</p>'}</div><div class="notice">El bloqueo evita crear nuevos turnos en la fecha indicada. No mueve automáticamente los ya agendados.</div>`,'timeoff',proId)}
function submitTimeoff(f,proId){const o=Object.fromEntries(new FormData(f));if(state.timeOff.some(x=>x.proId===proId&&x.date===o.date)){setFormError('Esa fecha ya está bloqueada.');return}if(state.appointments.some(a=>a.proId===proId&&a.start.startsWith(o.date)&&!['cancelado','ausente'].includes(a.status))){setFormError('Hay turnos activos ese día. Revisalos antes de bloquear la fecha.');return}state.timeOff.push({id:uid('off'),proId,date:o.date,reason:o.reason});persist();closeModal();render();toast('Fecha bloqueada')}
function openPayment(id){const p=state.payments.find(x=>x.id===id);if(!p)return;const a=state.appointments.find(x=>x.id===p.appointmentId);modalFrame('Registrar cobro · '+getC(a?.customerId).name,`<div class="detail-line"><span>Servicio</span><strong>${esc(getS(a?.serviceId).name)}</strong></div><div class="detail-line"><span>Importe del turno</span><strong>${money(a?.price)}</strong></div><div class="field-grid" style="margin-top:14px"><div class="field"><label>Estado del cobro</label><select name="status">${['pendiente','pagado','anulado'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${stateText[s]}</option>`).join('')}</select></div><div class="field"><label>Medio declarado</label><select name="method">${['','Efectivo','Transferencia','Débito','Crédito','Otro'].map(s=>`<option value="${s}" ${p.method===s?'selected':''}>${s||'Sin registrar'}</option>`).join('')}</select></div></div>`,'payment',id)}
function submitPayment(f,id){const p=state.payments.find(x=>x.id===id);const o=Object.fromEntries(new FormData(f));if(o.status==='pagado'&&!o.method){setFormError('Elegí un medio de pago antes de marcarlo como pagado.');return}p.status=o.status;p.method=o.method;p.date=today();persist();closeModal();render();toast('Cobro actualizado')}
function openNotifications(){const pending=apps().filter(a=>a.status==='pendiente'&&a.start>=today());const pp=state.payments.filter(p=>p.status==='pendiente');modalFrame('Centro de notificaciones',`<div class="action-list"><button class="action-row" data-action="pendingAppointments">${icon('calendar')}<span>${pending.length} turnos por confirmar</span>${icon('arrow')}</button><button class="action-row" data-action="goCobros">${icon('card')}<span>${pp.length} pagos por registrar</span>${icon('arrow')}</button><button class="action-row" data-action="goEquipo">${icon('users')}<span>Revisar el equipo</span>${icon('arrow')}</button></div><p class="hint">No se envían notificaciones externas. Todo es local.</p>`)}
function openReminders(){const tomorrow=addDays(today(),1);const list=apps().filter(a=>a.start.startsWith(tomorrow)&&a.status==='confirmado');const messages=list.map(a=>`Hola ${getC(a.customerId).name.split(' ')[0]}. Te recordamos tu turno de ${getS(a.serviceId).name} en ${state.business.name} el ${fmtDate(tomorrow)} a las ${timeFrom(a.start)}. Si necesitás cambiarlo, contactanos.`);const content=messages.length?messages.join('\n\n---\n\n'):'No hay turnos confirmados para mañana.';modalFrame('Recordatorios para copiar',`<p class="muted">Texto manual para ${list.length} clientes. No se envía ningún mensaje ni se conecta WhatsApp.</p><div class="field"><textarea id="remindersText" rows="9" readonly>${esc(content)}</textarea></div><div class="dialog-actions"><button class="btn btn-secondary" data-action="closeModal">Cerrar</button><button class="btn btn-primary" data-action="copyReminders">${icon('copy')} Copiar textos</button></div>`)}
function searchResults(value){let q=value.trim().toLowerCase();const el=document.getElementById('searchResults');if(q.length<2){el.classList.add('hidden');return}const all=[...state.customers.filter(c=>c.name.toLowerCase().includes(q)).slice(0,4).map(x=>({name:x.name,desc:'Cliente',view:'clientes'})),...state.services.filter(s=>s.name.toLowerCase().includes(q)).slice(0,3).map(x=>({name:x.name,desc:'Servicio',view:'servicios'})),...state.appointments.filter(a=>[getC(a.customerId).name,getS(a.serviceId).name].join(' ').toLowerCase().includes(q)).slice(0,3).map(a=>({name:getC(a.customerId).name+' · '+fmtDate(a.start.slice(0,10)),desc:'Turno',view:'turnos'}))].slice(0,9);el.innerHTML=all.length?all.map(a=>`<button data-nav="${a.view}">${icon('search',16)}<span>${esc(a.name)}<small>${esc(a.desc)}</small></span></button>`).join(''):`<div class="empty" style="padding:17px">Sin resultados</div>`;el.classList.remove('hidden')}
function doAction(action){switch(action){case 'theme':state.theme=state.theme==='dark'?'light':'dark';persist();render();toast('Tema '+(state.theme==='dark'?'oscuro':'claro')+' activado');break;case 'addAppointment':openAppointment();break;case 'addCustomer':openCustomer();break;case 'addService':openService();break;case 'addProfessional':openProfessional();break;case 'closeModal':closeModal();break;case 'goInicio':navigate('inicio');closeModal();break;case 'goAgenda':navigate('agenda');closeModal();break;case 'goTurnos':navigate('turnos');closeModal();break;case 'goCobros':navigate('cobros');closeModal();break;case 'goEquipo':navigate('equipo');closeModal();break;case 'notifications':openNotifications();break;case 'pendingAppointments':state.filterStatus='pendiente';navigate('turnos');closeModal();break;case 'prepareReminders':openReminders();break;case 'today':state.agendaDate=today();render();break;case 'prevDate':state.agendaDate=addDays(state.agendaDate,state.agendaMode==='week'?-7:-1);render();break;case 'nextDate':state.agendaDate=addDays(state.agendaDate,state.agendaMode==='week'?7:1);render();break;case 'resetDemo':modalFrame('Restaurar datos de prueba',`<p class="muted">Se eliminarán los cambios que hiciste en esta demo de este navegador. No se tocará ningún dato externo.</p><div class="dialog-actions"><button class="btn btn-secondary" data-action="closeModal">Cancelar</button><button class="btn btn-primary" data-action="confirmReset">${icon('refresh')} Restaurar demo</button></div>`);break;case 'confirmReset':state=demoSeed();persist();closeModal();render();toast('Datos de prueba restaurados');break;case 'copyReminders':{const area=document.getElementById('remindersText');if(area){area.select();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(area.value).then(()=>toast('Textos copiados')).catch(()=>toast('Seleccioná el texto para copiar'))}else{try{document.execCommand('copy');toast('Textos copiados')}catch(e){toast('Seleccioná y copiá el texto')}}}}break;}}
function submitPublic(f){const o=Object.fromEntries(new FormData(f));const s=getS(o.serviceId);const error=validateSlot({date:o.date,time:o.time,proId:o.proId,duration:s.duration});if(error){toast(error);return}const normalized=o.phone.replace(/\D/g,'');if(normalized.length<7){toast('Ingresá un número de contacto válido.');return}let c=state.customers.find(c=>c.phone.replace(/\D/g,'')===normalized);if(!c){c={id:uid('c'),name:o.name.trim(),phone:o.phone.trim(),email:'',notes:''};state.customers.push(c)}else if(c.name.toLowerCase()!==o.name.trim().toLowerCase()){toast('El teléfono ya está registrado para otro nombre en la demo.');return}state.appointments.push({id:uid('a'),customerId:c.id,serviceId:s.id,proId:o.proId,start:o.date+'T'+o.time,duration:s.duration,price:s.price,status:'pendiente',branch:state.branches[0]});persist();render();modalFrame('Solicitud de prueba registrada',`<div style="text-align:center;padding:12px 0">${icon('check',42)}<h2>¡Listo!</h2><p class="muted">Tu solicitud figura ahora como <b>pendiente</b> en la agenda local. No se envió una confirmación real.</p><div class="detail-line"><span>Turno</span><strong>${esc(fmtDate(o.date))} · ${esc(o.time)}</strong></div><div class="detail-line"><span>Servicio</span><strong>${esc(s.name)}</strong></div><div class="dialog-actions"><button class="btn btn-primary" data-action="goTurnos">Ver la solicitud</button></div></div>`);}
// Eventos delegados: válidos tras cada render sin re-registrar listeners.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){document.getElementById('searchResults').classList.add('hidden');navigate(nav.dataset.nav);return}const b=e.target.closest('[data-action]');if(b){doAction(b.dataset.action);return}const ae=e.target.closest('[data-edit-appointment]');if(ae){openAppointment(ae.dataset.editAppointment);return}const ce=e.target.closest('[data-edit-customer]');if(ce){openCustomer(ce.dataset.editCustomer);return}const se=e.target.closest('[data-edit-service]');if(se){openService(se.dataset.editService);return}const pe=e.target.closest('[data-edit-professional]');if(pe){openProfessional(pe.dataset.editProfessional);return}const bl=e.target.closest('[data-block-professional]');if(bl){openBlock(bl.dataset.blockProfessional);return}const pm=e.target.closest('[data-edit-payment]');if(pm){openPayment(pm.dataset.editPayment);return}const rm=e.target.closest('[data-remove-timeoff]');if(rm){state.timeOff=state.timeOff.filter(o=>o.id!==rm.dataset.removeTimeoff);persist();const id=modal?.id;openBlock(id);render();toast('Bloqueo eliminado');return}const m=e.target.closest('[data-agenda-mode]');if(m){state.agendaMode=m.dataset.agendaMode;persist();render();return}if(e.target.id==='dialogBack')closeModal();if(e.target.id==='mobileShade')closeNav();if(!e.target.closest('.search-wrap'))document.getElementById('searchResults').classList.add('hidden')});
document.addEventListener('change',e=>{if(e.target.id==='branchSelect'){state.branch=e.target.value;persist();render()}else if(e.target.id==='rangeSelect'){state.range=Number(e.target.value);persist();render()}else if(e.target.id==='statusFilter'){state.filterStatus=e.target.value;persist();render()}else if(e.target.id==='maService'){updateModalPros()}else if(e.target.id==='publicService'){updatePublicProfessionals()}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){searchResults(e.target.value)}else if(e.target.id==='turnosQuery'){const cursor=e.target.selectionStart;state.query=e.target.value;renderTurnos();const f=document.getElementById('turnosQuery');f.focus();f.setSelectionRange(cursor,cursor);setupIcons(root)}});
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();const f=e.target;const id=f.dataset.entity;({appointment:submitAppointment,customer:submitCustomer,service:submitService,professional:submitProfessional,timeoff:submitTimeoff,payment:submitPayment}[f.dataset.kind]||(()=>{}))(f,id)}else if(e.target.id==='settingsForm'){e.preventDefault();const f=e.target,o=Object.fromEntries(new FormData(f));const hours={};for(let i=0;i<7;i++){if(o['open'+i]&&o['opening'+i]>=o['closing'+i]){toast('Horario inválido en '+['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][i]);return}hours[i]=[o['opening'+i],o['closing'+i],!!o['open'+i]]}state.business={...state.business,name:o.name.trim(),category:o.category.trim(),phone:o.phone.trim(),email:o.email.trim(),timezone:o.timezone,cancellation:o.cancellation.trim(),hours};persist();render();toast('Configuración guardada')}else if(e.target.id==='publicBookingForm'){e.preventDefault();submitPublic(e.target)}});
document.getElementById('mobileMenu').addEventListener('click',()=>navigate('more'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeNav();document.getElementById('searchResults').classList.add('hidden')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}});
render();
})();
</script>
</body>
</html>
