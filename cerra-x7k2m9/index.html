/* CERRÁ / Atelier edition — radical visual direction, v02 */
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root {
 --bg:#151513;--panel:#1e1e1a;--panel2:#2a2924;--line:#f4f0e32a;
 --text:#f5f1e9;--sub:#ada99d;--accent:#ff765a;--accent-text:#23160f;
 --radius:5px;--blur:0 25px 70px #0005;
 font-family:"Space Grotesk",sans-serif;
}
body.light {
 --bg:#eeeae0;--panel:#fffdf5;--panel2:#e7e3d8;
 --line:#24251e2c;--text:#25251f;--sub:#6e6a61;
 --accent:#e65e42;--accent-text:#fff;
 --blur:0 25px 70px #302d231d
}
body{background:var(--bg);background-image:radial-gradient(#f8e5c40d .7px,transparent .7px);background-size:8px 8px}
h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif;letter-spacing:-.068em}
h2{font-size:clamp(1.85rem,3.4vw,3.6rem);line-height:1.07}
h3{font-size:1.25rem}
.eyebrow,.nav-title,.label,.small,.tag{font-family:"DM Mono",monospace}
.eyebrow{letter-spacing:.08em;color:var(--accent);font-size:.67rem}
.top-note{height:28px;padding:6px 15px;background:var(--accent);color:#1e1914;font-family:"DM Mono",monospace;font-size:.64rem;font-weight:500;letter-spacing:.02em}
.wrap{display:block;min-height:calc(100vh - 28px)}
.side{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:3vw;
 width:100%;height:94px;padding:0 clamp(22px,4vw,64px);border:0;border-bottom:1px solid var(--line);
 background:var(--bg);box-shadow:none}
.side .brand{grid-column:1;grid-row:1;padding:0;font-size:2.05rem;letter-spacing:-.095em}
.brand{font-size:2rem;letter-spacing:-.09em}
.brand-symbol{width:28px;height:28px;border:0;border-radius:0;background:var(--accent);
 clip-path:polygon(0 0,100% 0,100% 25%,35% 25%,35% 75%,100% 75%,100% 100%,0 100%);transform:none}
.nav{grid-column:2;grid-row:1;display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.5vw,23px);overflow:hidden;padding:0;height:100%}
.nav-title,.side-bottom{display:none!important}
.nav-btn{font-family:"Space Grotesk",sans-serif;position:relative;border-radius:0;background:transparent!important;
 height:100%;min-height:65px;padding:0 5px;font-weight:600;font-size:.85rem;color:var(--sub);gap:5px;white-space:nowrap;box-shadow:none!important}
.nav-btn:hover,.nav-btn.active{color:var(--text)}
.nav-btn.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--accent)}
.nav-icon{width:auto;color:var(--accent);font:500 .59rem "DM Mono",monospace;align-self:center;transform:translateY(-.38em)}
.business-picker{grid-column:3;grid-row:1;padding:9px 12px;border-radius:2px;min-width:190px;max-width:230px;background:var(--panel);border-color:var(--line)}
.business-picker .eyebrow{font-size:.54rem;color:var(--sub)}
.business-picker select{font-size:.79rem;margin-top:3px}
.topbar{height:57px;border:0;border-bottom:1px solid var(--line);padding:0 clamp(22px,4vw,64px);background:transparent}
.topbar .eyebrow{color:var(--sub)}
.topbar .avatar{border:1px solid var(--accent);color:var(--accent);border-radius:50%;background:none}
.content{max-width:1600px;padding:clamp(28px,3.8vw,62px) clamp(22px,4vw,64px);margin:0 auto}
.btn{border-radius:2px;padding:13px 19px;font-family:"Space Grotesk";letter-spacing:-.01em;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.ghost{border-color:var(--line)}
.btn:hover{transform:translateY(-2px)}
.card{border-radius:3px;box-shadow:none;background:var(--panel)}
.tag{border-radius:2px;background:transparent;padding:6px 8px;font-size:.63rem;font-weight:500;text-transform:uppercase;letter-spacing:.035em}
.section-head{margin-bottom:34px;padding-bottom:27px;border-bottom:1px solid var(--line)}
.section-head h1{font-size:clamp(2.4rem,5vw,5.2rem);line-height:1.01;max-width:810px}
.section-head p{max-width:570px}
.muted,.hint{color:var(--sub)}
.form-field label{font-family:"DM Mono",monospace;letter-spacing:.02em;font-size:.68rem}
.form-field input,.form-field textarea,.form-field select,.input{background:var(--bg);border:1px solid var(--line);border-radius:2px;min-height:50px}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:1px solid var(--accent);outline-offset:0}
.option{border-radius:3px;background:var(--panel2);padding:18px;border-color:var(--line)}
.option:hover{border-color:var(--accent)}
.option:has(input:checked){background:linear-gradient(90deg,#ff765a1c,transparent 83%);border-color:var(--accent)}
.option input{accent-color:var(--accent);width:17px;height:17px}
.note{background:var(--panel2);border-radius:2px}
.line{margin:23px 0}
.pill-number{border-radius:2px;background:var(--accent)}
.stat strong{font-size:3.35rem}
.list-table th{font-family:"DM Mono",monospace;letter-spacing:.06em;font-size:.63rem}
.list-table td{padding:20px 8px}
.grid.cols2{gap:20px}
.grid.cols3{gap:20px}
.footer-note{border-top:1px solid var(--line);padding-top:26px;letter-spacing:.035em;font: .66rem "DM Mono",monospace}

/* Bespoke editorial landing */
.editorial-intro{margin:0 0 22px;display:flex;justify-content:space-between;align-items:start;gap:20px}
.editorial-intro .index{font:.68rem "DM Mono",monospace;color:var(--accent);letter-spacing:.085em}
.editorial-intro .aside-note{max-width:230px;text-align:right;color:var(--sub);font:.67rem/1.65 "DM Mono",monospace}
.hero-headline{font:600 clamp(3.4rem,7.5vw,8rem)/.91 "Space Grotesk",sans-serif;letter-spacing:-.105em;margin:12px 0 38px;max-width:1150px}
.hero-headline .script{font:italic 1.1em/.8 "Instrument Serif",serif;letter-spacing:-.07em;color:var(--accent);display:inline-block;transform:translateY(.025em)}
.hero-headline .outline{color:transparent;-webkit-text-stroke:1px var(--text)}
.signature-stage{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);min-height:390px;overflow:hidden;border:1px solid var(--line);border-radius:4px}
.stage-left{position:relative;background:#eeeae0;color:#1d211b;padding:clamp(30px,4vw,60px);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
.stage-left:after{content:"";position:absolute;right:23px;bottom:22px;border-radius:50%;width:68px;height:68px;border:1px solid #2b302444;box-shadow:0 0 0 10px #777d6f10,0 0 0 20px #777d6f0f}
.stage-left .eyebrow{color:#96513a}
.stage-left h2{font-size:clamp(2.4rem,4.1vw,4.7rem);max-width:580px;margin:34px 0 10px;letter-spacing:-.08em}
.stage-left h2 em{font:italic 1.12em/.95 "Instrument Serif",serif;color:#ae563b;letter-spacing:-.04em}
.stage-left p{color:#62665a;max-width:430px;line-height:1.5;font-size:.94rem}
.stage-left .btn{background:#22251e;color:#f5f0e7;border-color:#22251e}
.stage-left .btn.ghost{background:transparent;color:#1e211b;border-color:#94978c}
.stage-right{position:relative;overflow:hidden;background:#ff765a;display:grid;place-items:center;min-height:390px;isolation:isolate}
.stage-right:before{content:"";position:absolute;width:650px;height:650px;border-radius:50%;border:1px solid #2a241a33;box-shadow:0 0 0 68px #2d221b0c,0 0 0 138px #2d221b0b;left:15%;top:-42%;transform:rotate(12deg)}
.stage-right:after{content:"CERRÁ / 001";position:absolute;bottom:20px;left:28px;font:500 .65rem "DM Mono",monospace;color:#372118;letter-spacing:.07em}
.deal-paper{position:relative;z-index:1;background:#f7f4e9;color:#252820;width:min(340px,79%);min-height:230px;padding:29px 30px;transform:rotate(-8deg);box-shadow:22px 24px 0 #171e1b21,40px 44px 55px #341c1155;transition:transform .35s cubic-bezier(.2,.75,.3,1)}
.deal-paper:hover{transform:rotate(-3deg) translateY(-7px)}
.deal-paper .eyebrow{color:#8b634d}
.deal-paper .paper-top{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #25282045;padding-bottom:16px;font:500 .65rem "DM Mono",monospace}
.deal-paper .paper-name{font:700 1.65rem "Space Grotesk",sans-serif;letter-spacing:-.07em;line-height:1.02;margin:28px 0 6px}
.deal-paper .paper-price{font:700 2.8rem "Space Grotesk",sans-serif;letter-spacing:-.09em;margin:0 0 16px}
.deal-paper .paper-foot{font:500 .64rem "DM Mono",monospace;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #25282045;padding-top:14px}
.deal-paper .paper-stamp{background:#171e18;color:#e9ebdc;padding:5px 8px}
.metric-strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:20px 0;background:var(--panel)}
.metric-unit{padding:26px 30px;position:relative;min-height:155px}
.metric-unit +.metric-unit{border-left:1px solid var(--line)}
.metric-unit .eyebrow{color:var(--sub)}
.metric-unit .metric-value{display:block;font:700 clamp(2.5rem,4vw,4.3rem)/1.1 "Space Grotesk",sans-serif;letter-spacing:-.09em;margin:17px 0 4px}
.metric-unit .metric-foot{color:var(--sub);font-size:.72rem}
.metric-unit .metric-index{position:absolute;right:20px;top:24px;color:var(--accent);font:500 .65rem "DM Mono",monospace}
.market-bottom{display:grid;grid-template-columns:.87fr 1.13fr;gap:20px;margin-top:20px}
.market-story{padding:36px;background:var(--panel);border:1px solid var(--line)}

document.addEventListener('click',function(e){var btn=e.target.closest('[data-action]');if(!btn)return;var a=btn.dataset.action,id=btn.dataset.id;if(a==='nav')route(btn.dataset.route);if(a==='theme'){db.theme=db.theme==='dark'?'light':'dark';save();render()}if(a==='new-config')createConfig();if(a==='edit-config')route('editor:'+id);if(a==='open-public'){answers={qty:1,extras:[]};route('public:'+id)}if(a==='preview-first'){var c=configs()[0];if(c){answers={qty:1,extras:[]};route('public:'+c.id)}else notify('Primero creá una experiencia.')}if(a==='copy-public')share('public:'+id);if(a==='lead-detail')leadDetail(id);if(a==='make-proposal')makeProposal(id);if(a==='save-lead'){var l=db.leads.find(function(x){return x.id===id});l.status=document.getElementById('lead-status').value;var note=document.getElementById('lead-note').value.trim();if(note)db.notes.push({id:uid('n'),lead:id,text:note,date:now()});save();document.getElementById('modal').remove();notify('Seguimiento guardado');render()}if(a==='open-proposal'){selectedExtras=[];route('proposal:'+id)}if(a==='add-package'||a==='add-extra'||a==='add-question'){var form=document.getElementById('config-form');if(form)form.requestSubmit();var c=db.configs.find(function(x){return x.id===id});if(!c)return;if(a==='add-package')c.packages.push({id:uid('pa'),name:'Nuevo paquete',description:'',price:0});if(a==='add-extra')c.extras.push({id:uid('ex'),name:'Nuevo complemento',price:0});if(a==='add-question')c.questions.push({id:uid('q'),text:'Nueva pregunta',options:['Sí','No'],after:''});save();editor()}if(a==='new-business')createBusiness();if(a==='close')document.getElementById('modal')?.remove();if(a==='print')window.print();});

ef='CER-'+Math.random().toString(36).slice(2,8).toUpperCase(),responses={};c.questions.forEach(function(x){if(answers[x.id])responses[x.text]=answers[x.id]});db.leads.push({id:uid('l'),business:c.business,configId:c.id,configName:c.title,contact:v.contact,email:v.email,phone:v.phone,total:totalFor(c,answers),base:totalFor(c,answers),packageName:p?.name||'',responses:responses,status:'new',reference:ref,createdAt:now()});save();document.getElementById('root').innerHTML='<div class="public-page"><div class="public-header"><div class="brand"><span class="brand-symbol"></span>CERRÁ</div></div><div class="content" style="max-width:720px;padding-top:12vh"><div class="eyebrow">CONSULTA GUARDADA</div><h1>Listo. Ahora empieza la conversación.</h1><p class="muted">Referencia '+h(ref)+'. La consulta está guardada en este navegador de prueba.</p><div class="card"><div class="total">'+money(totalFor(c,answers))+'</div>'+button('Gestionar oportunidad ↗','nav','data-route="leads"','primary')+'</div></div></div>';notify('Consulta demo registrada')}if(f.id==='proposal-form'){var l=db.leads.find(function(x){return x.id===f.dataset.id});if(!l)return;var ex=v.extraName?.trim()?[{id:uid('ex'),name:v.extraName.trim(),price:Math.max(0,Number(v.extraPrice)||0)}]:[];var p={id:uid('p'),business:l.business,leadId:l.id,contact:l.contact,title:v.title,message:v.message,base:l.base,reference:l.reference,status:'sent',extras:ex,expiresAt:new Date(Date.now()+Math.max(1,Number(v.days)||7)*86400000).toISOString(),createdAt:now()};db.proposals.push(p);l.status='qualified';save();document.getElementById('modal').remove();selectedExtras=[];route('proposal:'+p.id);notify('Propuesta de prueba creada')}if(f.id==='accept-proposal'){var p=db.proposals.find(function(x){return x.id===proposalId});if(!p||p.status==='accepted')return;if(Date.now()>Date.parse(p.expiresAt)){notify('La propuesta venció');return}p.status='accepted';p.acceptedName=v.name;p.selected=selectedExtras.slice();p.acceptedAt=now();var l=db.leads.find(function(x){return x.id===p.leadId});if(l)l.status='won';save();render();notify('Aceptación de prueba registrada')}});
window.addEventListener('hashchange',render);save();render();
})();
