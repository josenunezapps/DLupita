<body><div id="root"></div><div id="toast-area"></div>
<script>
(function(){
'use strict';
var KEY='cerra-preview-07-v1',active='overview',editId=null,publicId=null,proposalId=null,answers={},selectedExtras=[];
var seed={theme:'dark',selectedBusiness:'b1',next:1,businesses:[{id:'b1',name:'Comercio Demo',slug:'comercio-demo',whatsapp:'',plan:'free',accent:'#c0f17a'}],configs:[{id:'c1',business:'b1',title:'Servicio de fotografía',sector:'Fotografía',description:'Diseñá una experiencia visual memorable. Elegí el alcance, la cantidad de imágenes y los complementos.',published:true,packages:[{id:'pa1',name:'Esencial',description:'Sesión breve y entrega digital',price:85000},{id:'pa2',name:'Editorial',description:'Producción extendida y selección curada',price:135000},{id:'pa3',name:'Campaña',description:'Cobertura integral y piezas finales',price:235000}],extras:[{id:'ex1',name:'Edición avanzada',price:28000},{id:'ex2',name:'Entrega prioritaria',price:19000}],questions:[{id:'q1',text:'¿Qué tipo de sesión necesitás?',options:['Producto','Retrato','Evento'],after:''},{id:'q2',text:'¿La sesión requiere traslado?',options:['No','Sí'],after:''},{id:'q3',text:'¿Qué zona debemos cubrir?',options:['En la ciudad','Fuera de la ciudad'],after:'q2:Sí'}]}],leads:[],proposals:[],notes:[]};
var db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){db=seed}if(!db.businesses||!db.configs)db=seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(k){db.next=(db.next||1)+1;return k+Date.now().toString(36)+db.next.toString(36)}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]})}
function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v)||0)}
function biz(){return db.businesses.find(function(b){return b.id===db.selectedBusiness})||db.businesses[0]}
function configs(){return db.configs.filter(function(c){return c.business===biz().id})}
function leads(){return db.leads.filter(function(l){return l.business===biz().id})}
function proposals(){return db.proposals.filter(function(p){return p.business===biz().id})}
function now(){return new Date().toISOString()}
function tag(s){var m={new:'Nueva',contacted:'Contactada',qualified:'Calificada',won:'Ganada',lost:'Perdida',sent:'Enviada',accepted:'Aceptada',cancelled:'Cancelada'};return '<span class="tag '+(['won','accepted'].includes(s)?'positive':['sent','qualified'].includes(s)?'warn':'')+'">'+h(m[s]||s)+'</span>'}
function notify(message){var e=document.createElement('div');e.className='toast';e.textContent=message;document.getElementById('toast-area').appendChild(e);setTimeout(function(){e.remove()},3200)}
function button(text,action,data,kind){return '<button class="btn '+(kind||'')+'" data-action="'+h(action)+'" '+(data||'')+'>'+text+'</button>'}
function title(kicker,title,sub,btn){return '<div class="section-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1>'+(sub?'<p class="muted">'+sub+'</p>':'')+'</div>'+(btn||'')+'</div>'}
function field(label,key,value,kind,attributes){return '<div class="form-field"><label>'+h(label)+'</label><input name="'+h(key)+'" type="'+(kind||'text')+'" value="'+h(value==null?'':value)+'" '+(attributes||'')+'></div>'}
function optionsRow(items,name,selected){return items.map(function(o){return '<label class="option"><span class="row"><input name="'+h(name)+'" type="radio" value="'+h(o.id)+'" '+(selected===o.id?'checked':'')+'><span><b>'+h(o.name)+'</b><br><span class="small muted">'+h(o.description||'')+'</span></span></span><span class="amount">'+money(o.price)+'</span></label>'}).join('')}
function totalFor(c,a){var p=c.packages.find(function(x){return x.id===a.packageId})||c.packages[0],n=Math.max(1,Math.min(100,parseInt(a.qty,10)||1)),e=c.extras.filter(function(x){return (a.extras||[]).includes(x.id)});return (p?p.price:0)*n+e.reduce(function(s,x){return s+x.price},0)}
function quoteText(l){return h(l.contact)+' · '+h(l.configName)+' · '+money(l.total)}
function route(r){location.hash='#'+r;render()}
function share(r){var url=location.href.split('#')[0]+'#'+r;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){notify('Enlace de demostración copiado')}).catch(function(){prompt('Copiá el enlace:',url)})}else prompt('Copiá el enlace:',url)}
function main(content){var b=biz(),items=[['overview','◫','Inicio'],['configs','◈','Experiencias'],['leads','◎','Oportunidades'],['proposals','▤','Propuestas'],['settings','⚙','Mi negocio'],['admin','✦','Administración']];document.getElementById('root').innerHTML='<div class="top-note">MODO DEMOSTRACIÓN · Los datos se guardan solo en este navegador. No hay usuarios ni servidor público.</div><div class="wrap"><aside class="side"><div class="brand"><span class="brand-symbol"></span>CERRÁ</div><div class="business-picker"><div class="eyebrow">ESPACIO DE TRABAJO</div><select id="biz-switch">'+db.businesses.map(function(x){return '<option value="'+h(x.id)+'" '+(x.id===b.id?'selected':'')+'>'+h(x.name)+'</option>'}).join('')+'</select></div><nav class="nav"><div class="nav-title">NAVEGACIÓN</div>'+items.map(function(x){return '<button class="nav-btn '+(active===x[0]?'active':'')+'" data-action="nav" data-route="'+x[0]+'"><span class="nav-icon">'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'</nav><div class="side-bottom"><div class="note"><span class="eyebrow">CERRÁ / LAB</span><br>Vista interactiva para evaluar diseño y recorrido. La versión productiva requiere API + D1.</div></div></aside><div class="main"><header class="topbar"><div class="eyebrow">'+h(b.name.toUpperCase())+' / '+h(active.toUpperCase())+'</div><div class="row">'+button(db.theme==='dark'?'☀ Claro':'☾ Oscuro','theme','','small')+'<div class="avatar">'+h(b.name[0].toUpperCase())+'</div></div></header><main class="content">'+content+'<div class="footer-note">CERRÁ · Experiencia comercial interactiva · Vista de evaluación v0.1</div></main></div></div>'}
function overview(){var L=leads(),P=proposals(),won=P.filter(function(x){return x.status==='accepted'}),turn=L.length?Math.round(won.length/L.length*100):0;main('<div class="hero"><div class="card glass hero-copy"><span class="eyebrow">LA VENTA CAMBIA CUANDO EL CLIENTE PARTICIPA</span><h1>Menos ida y vuelta.<br><em>Más sí.</em></h1><p style="color:#c3d3cb">Creá experiencias de compra que responden preguntas, calculan precios y convierten consultas en propuestas claras.</p><div class="row">'+button('Crear experiencia ↗','new-config','','primary')+button('Probar configurador','preview-first')+'</div></div><div class="hero-art"><div class="orb"></div><div class="floating"><span class="eyebrow" style="color:#53712d">CONFIGURADOR / 01</span><h3 style="color:#233b29;margin-top:12px">Tu próxima gran oportunidad</h3><div class="fake-line"></div><div class="fake-line short"></div><b>'+money(configs()[0]?.packages[0]?.price||0)+'</b><div class="fake-btn"></div></div></div></div><div class="grid cols3 mt"><div class="card stat"><span class="label">CONSULTAS RECIBIDAS</span><strong>'+L.length+'</strong><span class="hint">Registradas en este navegador</span></div><div class="card stat"><span class="label">PROPUESTAS ENVIADAS</span><strong>'+P.length+'</strong><span class="hint">Sin datos inventados</span></div><div class="card stat"><span class="label">CONVERSIÓN</span><strong>'+turn+'%</strong><span class="hint">'+won.length+' propuestas aceptadas</span></div></div><div class="grid cols2 mt"><div class="card"><div class="eyebrow">TU RECORRIDO COMERCIAL</div><h2 style="margin:12px 0 27px">De una idea a una venta.</h2>'+[['01','Diseñá','Definí paquetes, preguntas y complementos.'],['02','Compartí','Dejá que tu cliente arme su pedido.'],['03','Proponé','Convertí la consulta en una oferta privada.'],['04','Cerrá','Registrá la aceptación y seguí la oportunidad.']].map(function(x,i){return '<div class="steps" style="margin:17px 0"><span class="pill-number">'+x[0]+'</span><div><b>'+x[ document.addEventListener('change',function(e){var t=e.target;if(t.id==='biz-switch'){db.selectedBusiness=t.value;save();route('overview')}if(t.name==='packageId'){answers.packageId=t.value;save();render()}if(t.id==='qty'){answers.qty=Math.max(1,Math.min(100,Number(t.value)||1));render()}if(t.matches('[data-extra]')){var arr=answers.extras||[];answers.extras=t.checked?[...new Set(arr.concat(t.dataset.extra))]:arr.filter(function(x){return x!==t.dataset.extra});render()}if(t.matches('[data-question]')){answers[t.dataset.question]=t.value;render()}if(t.matches('[data-proposal-extra]')){selectedExtras=t.checked?[...new Set(selectedExtras.concat(t.dataset.proposalExtra))]:selectedExtras.filter(function(x){return x!==t.dataset.proposalExtra});render()}});
document.addEventListener('click',function(e){var btn=e.target.closest('[data-action]');if(!btn)return;var a=btn.dataset.action,id=btn.dataset.id;if(a==='nav')route(btn.dataset.route);if(a==='theme'){db.theme=db.theme==='dark'?'light':'dark';save();render()}if(a==='new-config')createConfig();if(a==='edit-config')route('editor:'+id);if(a==='open-public'){answers={qty:1,extras:[]};route('public:'+id)}if(a==='preview-first'){var c=configs()[0];if(c){answers={qty:1,extras:[]};route('public:'+c.id)}else notify('Primero creá una experiencia.')}if(a==='copy-public')share('public:'+id);if(a==='lead-detail')leadDetail(id);if(a==='make-proposal')makeProposal(id);if(a==='save-lead'){var l=db.leads.find(function(x){return x.id===id});l.status=document.getElementById('lead-status').value;var note=document.getElementById('lead-note').value.trim();if(note)db.notes.push({id:uid('n'),lead:id,text:note,date:now()});save();document.getElementById('modal').remove();notify('Seguimiento guardado');render()}if(a==='open-proposal'){selectedExtras=[];route('proposal:'+id)}if(a==='add-package'||a==='add-extra'||a==='add-question'){var form=document.getElementById('config-form');if(form)form.requestSubmit();var c=db.configs.find(function(x){return x.id===id});if(!c)return;if(a==='add-package')c.packages.push({id:uid('pa'),name:'Nuevo paquete',description:'',price:0});if(a==='add-extra')c.extras.push({id:uid('ex'),name:'Nuevo complemento',price:0});if(a==='add-question')c.questions.push({id:uid('q'),text:'Nueva pregunta',options:['Sí','No'],after:''});save();editor()}if(a==='new-business')createBusiness();if(a==='close')document.getElementById('modal')?.remove();if(a==='print')window.print();});
document.addEventListener('submit',function(e){var f=e.target;if(!f.id)return;e.preventDefault();var v=Object.fromEntries(new FormData(f));if(f.id==='new-business-form'){var b={id:uid('b'),name:v.name.trim(),slug:v.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),whatsapp:'',plan:'free',accent:'#c0f17a'};db.businesses.push(b);db.selectedBusiness=b.id;save();document.getElementById('modal').remove();route('overview');notify('Negocio demo creado')}if(f.id==='business-form'){biz().name=v.name.trim();biz().whatsapp=v.whatsapp.trim();save();notify('Datos guardados');render()}if(f.id==='new-config-form'){var id=uid('c'),c={id:id,business:biz().id,title:v.name,sector:v.sector,description:'Definí el servicio que querés cotizar.',published:false,packages:[{id:uid('pa'),name:'Esencial',description:'Paquete inicial',price:50000},{id:uid('pa'),name:'Avanzado',description:'Mayor alcance',price:90000}],extras:[{id:uid('ex'),name:'Entrega prioritaria',price:15000}],questions:[{id:uid('q'),text:'¿Qué necesitás?',options:['Opción A','Opción B'],after:''}]};db.configs.push(c);save();document.getElementById('modal').remove();route('editor:'+id);notify('Experiencia creada')}if(f.id==='config-form'){var c=db.configs.find(function(x){return x.id===f.dataset.id});if(!c)return;c.title=v.title;c.description=v.description;c.sector=v.sector;c.published=v.published==='true';c.packages.forEach(function(p,i){p.name=v['pname-'+i];p.description=v['pdesc-'+i];p.price=Math.max(0,Number(v['pprice-'+i])||0)});c.extras.forEach(function(x,i){x.name=v['ename-'+i];x.price=Math.max(0,Number(v['eprice-'+i])||0)});c.questions.forEach(function(x,i){x.text=v['qtext-'+i];x.options=(v['qoptions-'+i]||'').split(',').map(function(y){return y.trim()}).filter(Boolean);x.after=v['qafter-'+i]||''});save();notify('Experiencia guardada');editor()}if(f.id==='send-lead'){var c=db.configs.find(function(x){return x.id===publicId});if(!c)return;var p=c.packages.find(function(x){return x.id===answers.packageId})||c.packages[0],ref='CER-'+Math.random().toString(36).slice(2,8).toUpperCase(),responses={};c.questions.forEach(function(x){if(answers[x.id])responses[x.text]=answers[x.id]});db.leads.push({id:uid('l'),business:c.business,configId:c.id,configName:c.title,contact:v.contact,email:v.email,phone:v.phone,total:totalFor(c,answers),base:totalFor(c,answers),packageName:p?.name||'',responses:responses,status:'new',reference:ref,createdAt:now()});save();document.getElementById('root').innerHTML='<div class="public-page"><div class="public-header"><div class="brand"><span class="brand-symbol"></span>CERRÁ</div></div><div class="content" style="max-width:720px;padding-top:12vh"><div class="eyebrow">CONSULTA GUARDADA</div><h1>Listo. Ahora empieza la conversación.</h1><p class="muted">Referencia '+h(ref)+'. La consulta está guardada en este navegador de prueba.</p><div class="card"><div class="total">'+money(totalFor(c,answers))+'</div>'+button('Gestionar oportunidad ↗','nav','data-route="leads"','primary')+'</div></div></div>';notify('Consulta demo registrada')}if(f.id==='proposal-form'){var l=db.leads.find(function(x){return x.id===f.dataset.id});if(!l)return;var ex=v.extraName?.trim()?[{id:uid('ex'),name:v.extraName.trim(),price:Math.max(0,Number(v.extraPrice)||0)}]:[];var p={id:uid('p'),business:l.business,leadId:l.id,contact:l.contact,title:v.title,message:v.message,base:l.base,reference:l.reference,status:'sent',extras:ex,expiresAt:new Date(Date.now()+Math.max(1,Number(v.days)||7)*86400000).toISOString(),createdAt:now()};db.proposals.push(p);l.status='qualified';save();document.getElementById('modal').remove();selectedExtras=[];route('proposal:'+p.id);notify('Propuesta de prueba creada')}if(f.id==='accept-proposal'){var p=db.proposals.find(function(x){return x.id===proposalId});if(!p||p.status==='accepted')return;if(Date.now()>Date.parse(p.expiresAt)){notify('La propuesta venció');return}p.status='accepted';p.acceptedName=v.name;p.selected=selectedExtras.slice();p.acceptedAt=now();var l=db.leads.find(function(x){return x.id===p.leadId});if(l)l.status='won';save();render();notify('Aceptación de prueba registrada')}});
window.addEventListener('hashchange',render);save();render();
})();
</script>
