<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152136">
<meta name="description" content="CobraClaro: panel de cobranzas y cuentas corrientes para negocios.">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<title>CobraClaro · Edición Business · Zenix AR</title>
<style>:root{
  --accent:#4f6bff;
  --accent-strong:#3650d8;
  --accent-soft:#edf2ff;
  --muted:#6b7890;
  --ink:#172033;
  --ink-soft:#32415d;
  --bg:#f3f6fb;
  --bg-strong:#eaf0f8;
  --line:#dde5f0;
  --line-strong:#ccd7e7;
  --white:#ffffff;
  --aside:#0f1728;
  --aside-2:#121d31;
  --good:#17805f;
  --good-soft:#e7f7f0;
  --danger:#c04a5e;
  --danger-soft:#ffedf1;
  --warn:#b57618;
  --warn-soft:#fff3db;
  --info:#4164e1;
  --info-soft:#edf2ff;
  --shadow-sm:0 2px 8px rgba(18,32,61,.06);
  --shadow-md:0 16px 38px rgba(16,28,56,.08);
  --shadow-lg:0 26px 60px rgba(13,28,58,.16);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  font-size:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at top left, rgba(79,107,255,.08), transparent 26%),
    linear-gradient(180deg, #f7f9fd 0%, var(--bg) 36%, #eef3f9 100%);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(79,107,255,.28);
  outline-offset:2px;
}
.shell{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{
  background:linear-gradient(180deg,var(--aside) 0%, var(--aside-2) 100%);
  color:#fff;
  min-height:100vh;
  padding:28px 18px 20px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid rgba(255,255,255,.06);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.02);
}
.brand{display:flex;align-items:center;gap:14px;padding:0 10px 24px}
.brandIcon{
  width:46px;height:46px;border-radius:15px;
  background:linear-gradient(135deg,#5a7bff 0%,#3750d6 100%);
  display:grid;place-items:center;font-size:23px;
  box-shadow:0 16px 26px rgba(61,97,255,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.brand span{font-size:20px;font-weight:800;letter-spacing:-.04em;font-family:Inter,system-ui,sans-serif}
.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#90a1be;margin-top:3px;font-weight:700}
.navLabel{padding:0 14px;margin:8px 0 12px;font-size:10px;text-transform:uppercase;color:#7e91b0;letter-spacing:.18em;font-weight:800}
.nav{display:grid;gap:6px}
.nav button{
  background:transparent;border:1px solid transparent;text-align:left;display:flex;gap:12px;align-items:center;width:100%;
  border-radius:14px;color:#a8b6cd;font-weight:650;padding:12px 14px;
  transition:.18s ease;
}
.nav button b{
  width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
  text-align:center;font-size:15px;font-weight:700;background:rgba(255,255,255,.04);color:#d4def0;flex-shrink:0
}
.nav button:hover{
  background:rgba(255,255,255,.05);color:#fff;border-color:rgba(255,255,255,.05);transform:translateX(1px)
}
.nav button.active{
  background:linear-gradient(180deg,rgba(74,101,255,.23),rgba(74,101,255,.16));
  color:#fff;border-color:rgba(130,151,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px rgba(10,19,39,.22)
}
.nav button.active b{background:rgba(255,255,255,.1);color:#fff}
.sideCard{
  margin:18px 8px 0;padding:16px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:var(--shadow-md);
}
.sideCardLabel{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#98a8c3;font-weight:800}
.sideCardValue{font-size:28px;font-weight:850;letter-spacing:-.05em;margin:10px 0 6px}
.sideCardSub{font-size:12px;color:#c2cee0;line-height:1.55;margin:0 0 14px}
.sideMiniGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sideMini{
  border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px;
  background:rgba(4,10,20,.15)
}
.sideMini strong{display:block;font-size:16px;letter-spacing:-.03em}
.sideMini span{display:block;margin-top:3px;font-size:11px;color:#8fa2c0;line-height:1.35}
.sideFoot{margin-top:auto;padding:18px 14px;border-top:1px solid rgba(255,255,255,.08);color:#8ea1bf;font-size:12px;line-height:1.7}
.sideFoot strong{color:#fff;font-weight:750}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:10;
  min-height:84px;background:rgba(248,250,253,.84);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(205,216,231,.72);padding:18px 34px;display:flex;align-items:center;justify-content:space-between;gap:18px
}
.topbarMain{min-width:0}
.crumb{font-size:11px;color:#7d8aa2;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.topbarTitle{font-size:20px;font-weight:800;letter-spacing:-.04em;margin:5px 0 0;color:var(--ink)}
.topbarSub{font-size:13px;color:var(--muted);margin-top:3px}
.topRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mark,.signal,.signal.bad,.signal.good,.signal.warn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;color:#617086;box-shadow:var(--shadow-sm)
}
.signal .sigDot,.mark .sigDot{height:8px;width:8px;border-radius:999px;background:currentColor;display:inline-block}
.signal.good{background:var(--good-soft);color:var(--good);border-color:#ccebdd}
.signal.bad{background:var(--danger-soft);color:var(--danger);border-color:#f2ccd4}
.signal.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0ddb9}
.avatar{height:40px;width:40px;background:linear-gradient(180deg,#fff,#eef3fd);display:grid;place-items:center;border-radius:14px;font-weight:850;color:var(--accent);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.content{max-width:1520px;margin:0 auto;padding:28px 34px 58px;width:100%}
.workspaceBar{display:grid;grid-template-columns:1.55fr repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.workspaceLead,.workspaceMetric{
  background:rgba(255,255,255,.82);border:1px solid rgba(214,224,238,.95);border-radius:20px;box-shadow:var(--shadow-sm)
}
.workspaceLead{padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,249,255,.92))}
.workspaceLead b{display:block;font-size:15px;letter-spacing:-.02em}
.workspaceLead p{margin:8px 0 0;color:var(--muted);line-height:1.55;font-size:13px}
.workspaceMetric{padding:16px 18px}
.workspaceMetricLabel{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8190a9;font-weight:800}
.workspaceMetricValue{margin-top:8px;font-size:24px;font-weight:850;letter-spacing:-.05em}
.workspaceMetricNote{margin-top:5px;color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:850;color:var(--accent);margin:0 0 8px}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 24px}
.heading h1{margin:0;font-size:32px;letter-spacing:-.06em;line-height:1.1;font-family:Inter,system-ui,sans-serif}
.sub{color:var(--muted);line-height:1.65;margin:10px 0 0;max-width:730px;font-size:14px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:#fff;border-radius:12px;
  padding:11px 16px;font-weight:780;white-space:nowrap;color:var(--ink);min-height:42px;box-shadow:var(--shadow-sm);transition:.18s ease
}
.btn:hover{border-color:#bcc8da;background:#fcfdff;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:white;border-color:transparent;box-shadow:0 14px 28px rgba(63,89,218,.24)}
.btn.primary:hover{filter:brightness(.98)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;border-radius:10px;min-height:34px;font-size:12px}
.btn.full{width:100%}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;margin:0 0 20px;
  background:linear-gradient(135deg,#16213a 0%,#203357 100%);color:#fff;border-radius:20px;box-shadow:var(--shadow-md)
}
.banner strong{font-size:18px;letter-spacing:-.03em}
.banner p{margin:7px 0 0;color:#d3dcf2;line-height:1.55;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0 24px}
.stat,.panel,.callout{background:rgba(255,255,255,.9);border:1px solid rgba(216,225,238,.95);border-radius:20px;box-shadow:var(--shadow-sm)}
.stat{padding:22px 22px 20px;min-width:0;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:auto -14px -18px auto;width:82px;height:82px;border-radius:20px;background:radial-gradient(circle,rgba(79,107,255,.15),transparent 66%)}
.statLabel{color:#617089;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:760;position:relative;z-index:1}
.statIcon{font-size:18px;width:40px;height:40px;background:var(--accent-soft);color:var(--accent);border-radius:13px;display:grid;place-items:center;border:1px solid #d8e0ff}
.statValue{font-size:29px;font-weight:860;letter-spacing:-.06em;margin:16px 0 4px;overflow-wrap:anywhere;position:relative;z-index:1}
.statNote{color:#8190a4;font-size:12px;margin-top:6px;position:relative;z-index:1}
.dashboardGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px}
.panel{overflow:hidden;margin-bottom:18px}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#fafcff)}
.panelHead h2{font-size:16px;margin:0;letter-spacing:-.03em}
.panelHead span{color:var(--muted);font-size:12px}
.panelBody{padding:20px 22px}
.toolbar{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(249,251,255,.8)}
.toolbar .left{display:flex;gap:10px;flex:1;min-width:230px;flex-wrap:wrap}
.search{
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#f8fbff;width:100%;min-width:130px;outline:0;
  color:var(--ink);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)
}
.search:focus{border-color:#c6d2ee;background:white;box-shadow:0 0 0 4px rgba(79,107,255,.08)}
.select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);min-width:130px;max-width:215px;box-shadow:var(--shadow-sm)}
.tableScroll{width:100%;overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;text-align:left}
th{
  color:#8190a8;text-transform:uppercase;font-size:10px;font-weight:850;letter-spacing:.14em;background:#f7fafe;padding:14px 18px;white-space:nowrap;border-bottom:1px solid var(--line)
}
td{padding:16px 18px;border-bottom:1px solid #ebf0f7;font-size:13px;vertical-align:middle;white-space:nowrap;background:transparent}
tr:last-child td{border-bottom:0}
tbody tr{transition:.14s ease}
tbody tr:hover{box-shadow:inset 0 0 0 999px rgba(79,107,255,.028)}
.muted{color:var(--muted)}.strong{font-weight:800;color:var(--ink)}
.meta{font-size:11px;color:#95a0ae;margin-top:4px}
.cellName{display:flex;align-items:center;gap:12px}
.initial{
  width:38px;height:38px;display:grid;place-items:center;background:linear-gradient(180deg,#f4f7ff,#e8eeff);color:#4f62c7;border-radius:12px;font-size:12px;font-weight:850;flex-shrink:0;border:1px solid #dbe3fb
}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 11px;background:#f2f5f9;color:#637185;font-size:11px;font-weight:850;border:1px solid transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:#ccebdd}.pill.bad{background:var(--danger-soft);color:var(--danger);border-color:#f2ccd4}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0ddb9}.pill.info{background:var(--info-soft);color:var(--info);border-color:#d9e2ff}
.dot{height:7px;width:7px;display:inline-block;border-radius:100%;background:currentColor}.link{border:0;background:transparent;padding:4px;color:var(--accent);font-weight:800;font-size:12px}.link:hover{text-decoration:underline}
.empty{padding:50px 25px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin:12px 0 6px}.emptyIcon{font-size:32px}
.stack{display:grid;gap:10px}
.mini{border:1px solid var(--line);padding:15px;border-radius:14px;display:flex;align-items:center;gap:10px;justify-content:space-between;background:linear-gradient(180deg,#fff,#fbfcff)}
.miniTitle{font-weight:800;font-size:13px}.miniSub{font-size:11px;margin-top:5px;color:var(--muted)}.miniRight{text-align:right;font-weight:850;font-size:13px}
.note{padding:13px 14px;background:#f7f9fc;border-radius:13px;border:1px dashed var(--line-strong);font-size:12px;color:#5d6b81;line-height:1.65}
.quick{
  display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcff);padding:16px;border-radius:16px;text-align:left;
  transition:.18s ease;box-shadow:var(--shadow-sm)
}
.quick:hover{border-color:#c6d0e0;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.quickIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:18px;flex-shrink:0;border:1px solid #dce4ff}
.quick strong{display:block;font-size:13px;letter-spacing:-.01em}.quick small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}
.listCards{display:grid;gap:12px;padding:16px 20px 20px}
.clientCard,.movementCard{
  border:1px solid var(--line);border-radius:18px;padding:17px 18px;background:linear-gradient(180deg,#ffffff,#fbfcff);display:grid;gap:14px;box-shadow:var(--shadow-sm)
}
.cardTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.cardTop .left{min-width:0}.cardTitle{font-size:15px;font-weight:850;letter-spacing:-.03em}.cardSub{font-size:12px;color:var(--muted);margin-top:5px}.cardActions{display:flex;gap:8px;flex-wrap:wrap}.moneyStrong{font-size:20px;font-weight:850;letter-spacing:-.04em}.dataGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.dataBox{border:1px solid #e6ecf5;background:#f8fbff;border-radius:14px;padding:12px}.dataBox span{display:block;color:#7f8da4;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.dataBox b{display:block;margin-top:8px;font-size:15px;letter-spacing:-.03em}
.twoPanels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.reportActions{display:flex;gap:10px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(11,20,35,.56);display:grid;place-items:center;padding:18px;z-index:30;backdrop-filter:blur(6px)}
.modal{width:100%;max-width:620px;max-height:calc(100vh - 36px);overflow:auto;border-radius:22px;background:white;box-shadow:var(--shadow-lg);border:1px solid rgba(219,228,240,.95)}
.modalTop{padding:22px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,#fff,#fafcff)}
.modalTop h2{font-size:21px;margin:0;letter-spacing:-.04em}.close{border:0;background:#f2f5fb;height:36px;width:36px;border-radius:12px;font-size:20px;color:#637086}
.formGrid{padding:22px 25px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:grid;gap:8px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-weight:760;font-size:12px;color:#46536a;letter-spacing:.01em}.field input,.field textarea,.field select{width:100%;background:#f8fbff;padding:12px 12px;border:1px solid #dce4ef;border-radius:12px;color:var(--ink);outline:0}.field input:focus,.field textarea:focus,.field select:focus{border-color:#c8d3ea;background:white;box-shadow:0 0 0 4px rgba(79,107,255,.08)}.field textarea{resize:vertical;min-height:94px}
.modalFoot{padding:18px 25px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:linear-gradient(180deg,#fff,#fafcff)}.helper{margin:0;padding:0 25px 20px;color:#78859a;font-size:12px;line-height:1.6}
.toast{position:fixed;z-index:40;bottom:23px;right:26px;background:#14243c;color:white;border-radius:14px;padding:13px 18px;box-shadow:0 18px 40px rgba(21,34,56,.26);display:none;font-weight:700;font-size:12px;max-width:calc(100vw - 40px)}.toast.show{display:block}
.tips{font-size:12px;color:var(--muted);line-height:1.8}.tipItem{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.tipItem:last-child{border:0}.tipCheck{color:var(--good);font-weight:900}.footer{text-align:center;font-size:11px;color:#97a2b2;margin-top:18px}.kpiIcon{font-size:19px}.reportRow{display:flex;padding:12px 0;border-bottom:1px solid var(--line);justify-content:space-between;gap:12px}.reportRow:last-child{border-bottom:0}
@media (max-width:1150px){
  .workspaceBar{grid-template-columns:1fr 1fr}
  .workspaceLead{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboardGrid,.twoPanels{grid-template-columns:1fr}
}
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;min-height:auto}
  .topbar{position:relative;padding:18px 18px}
  .content{padding:20px 18px 50px}
}
@media (max-width:720px){
  .heading{flex-direction:column}
  .stats,.workspaceBar,.sideMiniGrid,.dataGrid,.twoPanels,.formGrid{grid-template-columns:1fr}
  .workspaceLead{grid-column:auto}
  .topRight{justify-content:flex-start}
  .banner{flex-direction:column;align-items:flex-start}
  .panelHead,.panelBody,.toolbar{padding-left:16px;padding-right:16px}
  th,td{padding:13px 14px}
}

/* Refinamiento móvil y accesibilidad empresarial */
@media(max-width:920px){
  .shell{display:block}
  .sidebar{position:relative;top:auto;height:auto;min-height:0;padding:16px 16px 13px;box-shadow:none}
  .sidebar>.sideFoot,.sideCard,.sideFoot{display:none}
  .brand{padding:0 2px 12px}
  .brandIcon{height:39px;width:39px;border-radius:12px;font-size:19px}
  .brand span{font-size:19px}
  .navLabel{display:none}
  .nav{display:flex;overflow-x:auto;padding:1px 0 4px;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;min-width:max-content;padding:8px 12px;border-radius:11px;white-space:nowrap;font-size:12px;gap:8px}
  .nav button b{width:24px;height:24px;font-size:13px;border-radius:7px}
  .topbar{padding:16px;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
  .topbarTitle{font-size:21px}
  .topbarSub{font-size:12px;line-height:1.45}
  .topRight{width:100%;justify-content:flex-start}
  .avatar{display:none}
  .content{padding:20px 14px 48px}
}
@media(max-width:650px){
  .heading h1{font-size:27px}
  .statValue{font-size:24px}
  .workspaceMetricValue{font-size:23px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:16px 14px}
  .statLabel{font-size:11px}
  .statIcon{width:32px;height:32px;font-size:15px}
  .statNote{font-size:10px}
  .workspaceBar{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .workspaceLead{grid-column:1/-1}
  .workspaceMetric{padding:14px 12px}
  .workspaceMetricLabel{font-size:10px}
  .workspaceMetric:nth-child(4){grid-column:1/-1}
  .toolbar .left{min-width:0;width:100%;flex-wrap:wrap}
  .search{min-width:0}
  .select{max-width:none}
  .btn{min-height:43px;padding:10px 12px}
  .banner{padding:20px}

<script>const APP={
 key:'cobranzas',title:'CobraClaro',accent:'#4f6bff',icon:'◈',
 tabs:[['inicio','Resumen','◫'],['clientes','Clientes','◉'],['movimientos','Movimientos','⇆'],['vencimientos','Vencimientos','◷'],['informes','Informes','▤']],
 seed(){let d=today();return {version:1,app:'cobranzas',clients:[{id:'c1',name:'Almacén El Puente (demo)',phone:'',zone:'Centro',limit:250000},{id:'c2',name:'Kiosco Aurora (demo)',phone:'',zone:'Norte',limit:160000},{id:'c3',name:'Mercadito Sur (demo)',phone:'',zone:'Sur',limit:300000}],entries:[{id:'e1',clientId:'c1',kind:'venta',amount:96000,date:plusDays(d,-18),due:plusDays(d,-3),concept:'Mercadería entregada'},{id:'e2',clientId:'c1',kind:'pago',amount:40000,date:plusDays(d,-5),due:'',concept:'Transferencia parcial'},{id:'e3',clientId:'c2',kind:'venta',amount:78000,date:plusDays(d,-5),due:plusDays(d,10),concept:'Pedido semanal'},{id:'e4',clientId:'c3',kind:'venta',amount:125000,date:plusDays(d,-12),due:plusDays(d,-1),concept:'Mercadería surtida'},{id:'e5',clientId:'c3',kind:'pago',amount:125000,date:plusDays(d,-2),due:'',concept:'Cancelación total'}]};},
 empty(){return {version:1,app:'cobranzas',clients:[],entries:[]}},
 client(id){return db.clients.find(x=>x.id===id)},
 balance(id){return db.entries.filter(x=>x.clientId===id).reduce((s,x)=>s+(x.kind==='venta'?num(x.amount):-num(x.amount)),0)},
 overdue(id){const debts=db.entries.filter(x=>x.clientId===id&&x.kind==='venta'&&x.due<today()).reduce((s,x)=>s+num(x.amount),0);const credits=db.entries.filter(x=>x.clientId===id&&x.kind==='pago').reduce((s,x)=>s+num(x.amount),0);return Math.max(0,debts-credits)},
 recordRows(){return [...db.entries].sort((a,b)=>b.date.localeCompare(a.date)).filter(x=>filter==='todos'||x.kind===filter).filter(x=>{const c=APP.client(x.clientId);return (x.concept+' '+(c?.name||'')).toLowerCase().includes(search.toLowerCase())}).map(x=>{const c=APP.client(x.clientId);return [dateText(x.date),cellName(c?.name||'Cliente eliminado',x.concept),pill(x.kind==='venta'?'Venta a crédito':'Pago',x.kind==='venta'?'warn':'good'),`<span class="strong" style="color:${x.kind==='pago'?'#188769':'#243148'}">${x.kind==='pago'?'−':'+'} ${money(x.amount)}</span>`,x.kind==='venta'?dateText(x.due):'—',btn('Eliminar','deleteEntry',x.id,'sm danger')]} )},
 clientRows(){return db.clients.filter(x=>(x.name+' '+x.zone).toLowerCase().includes(search.toLowerCase())).map(c=>{let bal=APP.balance(c.id),late=APP.overdue(c.id);return [cellName(c.name,c.zone||'Sin zona'),h(c.phone||'Sin teléfono'),`<span class="strong">${money(Math.max(0,bal))}</span>`,late>0?pill('Vencido · '+money(late),'bad'):(bal>0?pill('Al día','good'):pill('Sin deuda','info')) ,`<div class="rowActions">${btn('Ver cuenta','account',c.id)}${btn('Cobrar','pay',c.id)}${smallLink('Editar','editClient',c.id)}${smallLink('WhatsApp','wa',c.id)}</div>`]})},
 dueRows(){return db.clients.filter(c=>APP.overdue(c.id)>0).filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>APP.overdue(b.id)-APP.overdue(a.id)).map(c=>[cellName(c.name,c.zone||''),`<span class="strong">${money(APP.balance(c.id))}</span>`,`<span class="strong" style="color:#bc4a5a">${money(APP.overdue(c.id))}</span>`,`<div class="rowActions">${btn('Ver cuenta','account',c.id)}${btn('Preparar aviso','wa',c.id)}</div>`])},
 list(){if(tab==='clientes')return table(['Cliente','Teléfono','Saldo','Estado','Acciones'],APP.clientRows());if(tab==='movimientos')return table(['Fecha','Cliente / Concepto','Tipo','Importe','Vence',''],APP.recordRows());return table(['Cliente','Saldo total','Saldo vencido','Acción'],APP.dueRows())},
 render(tab){const total=db.clients.reduce((s,c)=>s+Math.max(0,APP.balance(c.id)),0),overdue=db.clients.reduce((s,c)=>s+APP.overdue(c.id),0),paid=db.entries.filter(x=>x.kind==='pago').reduce((s,x)=>s+num(x.amount),0);
 if(tab==='inicio')return `<div class="heading"><div><p class="eyebrow">Control financiero</p><h1>Tu operación financiera, en orden.</h1><p class="sub">Una vista ejecutiva para cobrar a tiempo, identificar riesgos y mantener cada cuenta al día.</p></div><div class="actions">${btn('＋ Nueva venta','sale','', 'primary')}${btn('Registrar cobro','pay')}</div></div><div class="banner"><div><strong>Convertí información en cobros efectivos.</strong><p>Identificá lo urgente, contactá al cliente indicado y registrá cada movimiento con claridad.</p></div>${btn('Ver vencimientos →','goLate','', 'primary')}</div>${stats([card('Cuentas por cobrar',money(total),'↗','Saldo pendiente total'),card('Deuda vencida',money(overdue),'!','Facturas vencidas sin cubrir'),card('Cobros registrados',money(paid),'✓','Histórico de pagos'),card('Clientes',String(db.clients.length),'◎','Registrados')])}<div class="dashboardGrid">${panel('Clientes con deuda',table(['Cliente','Saldo pendiente','Estado',''],db.clients.filter(c=>APP.balance(c.id)>0).sort((a,b)=>APP.balance(b.id)-APP.balance(a.id)).map(c=>[cellName(c.name,c.zone||''),`<b>${money(APP.balance(c.id))}</b>`,APP.overdue(c.id)>0?pill('Vencido','bad'):pill('Al día','good'),smallLink('Cobrar','pay',c.id)])),`<button class="link" data-action="goClients">Ver clientes →</button>`)}${panel('Acciones rápidas',`<div class="panelBody stack"><button class="quick" data-action="client"><span class="quickIcon">◎</span><span><strong>Agregar cliente</strong><small>Creá una nueva cuenta corriente</small></span></button><button class="quick" data-action="sale"><span class="quickIcon">▤</span><span><strong>Registrar venta a crédito</strong><small>Sumá una nueva deuda</small></span></button><button class="quick" data-action="pay"><span class="quickIcon">↗</span><span><strong>Registrar un cobro</strong><small>Descontá un pago parcial o total</small></span></button></div>`)}</div>`;
 if(tab==='clientes')return `<div class="heading"><div><p class="eyebrow">Cartera de clientes</p><h1>Clientes y cuentas corrientes</h1><p class="sub">Consultá el saldo de cada comercio y registrá cobros.</p></div>${btn('＋ Nuevo cliente','client','','primary')}</div>${panel('Directorio',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar cliente o zona..." value="${h(search)}"></div></div><div id="dynamicList">${APP.list()}</div>`)}`;
 if(tab==='movimientos')return `<div class="heading"><div><p class="eyebrow">Libro de operaciones</p><h1>Ventas y pagos</h1><p class="sub">Cada venta aumenta la cuenta corriente; cada pago disminuye el saldo.</p></div><div class="actions">${btn('＋ Nueva venta','sale','','primary')}${btn('＋ Nuevo cobro','pay')}</div></div>${panel('Movimientos',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar cliente o concepto..." value="${h(search)}"><select class="select" data-filter="true"><option value="todos">Todos</option><option value="venta" ${filter==='venta'?'selected':''}>Ventas</option><option value="pago" ${filter==='pago'?'selected':''}>Cobros</option></select></div></div><div id="dynamicList">${APP.list()}</div>`)}`;
 if(tab==='vencimientos')return `<div class="heading"><div><p class="eyebrow">Prioridades de cobro</p><h1>Deudas vencidas</h1><p class="sub">El pago de cada cliente se aplica primero a sus ventas vencidas para estimar el atraso.</p></div>${btn('＋ Registrar cobro','pay','','primary')}</div>${stats([card('Importe vencido',money(overdue),'⚠','Prioridad de cobro'),card('Clientes atrasados',db.clients.filter(c=>APP.overdue(c.id)>0).length,'👥','Con saldo vencido')])}${panel('Clientes para contactar',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar cliente..." value="${h(search)}"></div></div><div id="dynamicList">${APP.list()}</div>`)}`;
 },
 report(){return {subtitle:'Clientes y sus cuentas corrientes',headers:['Cliente','Zona','Teléfono','Saldo','Vencido','Límite de crédito'],rows:db.clients.map(c=>[c.name,c.zone,c.phone,money(Math.max(0,APP.balance(c.id))),money(APP.overdue(c.id)),money(c.limit)]),summary:[['Clientes',db.clients.length],['Ventas a crédito',db.entries.filter(x=>x.kind==='venta').length],['Pagos',db.entries.filter(x=>x.kind==='pago').length],['Cuentas por cobrar',money(db.clients.reduce((s,c)=>s+Math.max(0,APP.balance(c.id)),0))]]}},
 actions:{
 goLate(){tab='vencimientos';render()},goClients(){tab='clientes';render()},
 account(id){clientAccountDialog(id)},
 printAccount(id){const c=APP.client(id);if(!c)return;const rows=accountLedger(id).map(x=>[dateText(x.date),x.kind==='venta'?'Venta a crédito':'Cobro',x.concept,money(x.kind==='venta'?x.amount:0),money(x.kind==='pago'?x.amount:0),money(x.balance)]);rows.push(['','', 'SALDO PENDIENTE','','',money(Math.max(0,APP.balance(id)))]);printReport('Estado de cuenta · '+c.name,['Fecha','Operación','Concepto','Debe','Haber','Saldo'],rows,'CobraClaro | '+c.name+' | Saldo vencido estimado: '+money(APP.overdue(id)))},
 client(){modal('Nuevo cliente',[{name:'name',label:'Nombre del comercio',wide:true},{name:'phone',label:'WhatsApp (con código de país)',type:'tel',required:false,placeholder:'Ej.: 5492901...'}, {name:'zone',label:'Zona o barrio',required:false},{name:'limit',label:'Límite de crédito ($)',type:'number',min:0,default:0}],v=>{db.clients.push({id:uid(),name:v.name.trim(),phone:v.phone,zone:v.zone,limit:num(v.limit)})})},
 editClient(id){const c=APP.client(id);if(!c)return;modal('Editar cliente',[{name:'name',label:'Nombre del comercio',wide:true},{name:'phone',label:'WhatsApp',type:'tel',required:false},{name:'zone',label:'Zona',required:false},{name:'limit',label:'Límite de crédito ($)',type:'number',min:0}],v=>Object.assign(c,{name:v.name,phone:v.phone,zone:v.zone,limit:num(v.limit)}),c)},
 sale(){if(!db.clients.length){notify('Primero agregá un cliente');APP.actions.client();return}modal('Nueva venta a crédito',[{name:'clientId',label:'Cliente',type:'select',wide:true,options:db.clients.map(c=>({value:c.id,label:c.name}))},{name:'amount',label:'Importe de la venta ($)',type:'number',min:1},{name:'date',label:'Fecha de venta',type:'date',default:today()},{name:'due',label:'Fecha de vencimiento',type:'date',default:plusDays(today(),14)},{name:'concept',label:'Concepto / mercadería',wide:true}],v=>{if(v.due<v.date)throw Error('El vencimiento no puede ser anterior a la fecha de venta.');db.entries.push({id:uid(),kind:'venta',amount:num(v.amount),clientId:v.clientId,date:v.date,due:v.due,concept:v.concept})})},
 pay(id){const allowed=db.clients.filter(c=>APP.balance(c.id)>0);if(!allowed.length){notify('No hay clientes con saldo pendiente');return}modal('Registrar cobro',[{name:'clientId',label:'Cliente',type:'select',wide:true,options:allowed.map(c=>({value:c.id,label:c.name}))},{name:'amount',label:'Importe recibido ($)',type:'number',min:1},{name:'date',label:'Fecha de cobro',type:'date',default:today()},{name:'concept',label:'Medio de pago / detalle',required:false,wide:true,default:'Transferencia'}],v=>{if(num(v.amount)>APP.balance(v.clientId))throw Error('El cobro supera el saldo pendiente de ese cliente.');db.entries.push({id:uid(),kind:'pago',clientId:v.clientId,amount:num(v.amount),date:v.date,concept:v.concept,due:''})},{clientId:id||allowed[0].id})},
 deleteEntry(id){const entry=db.entries.find(x=>x.id===id);if(!entry)return;if(entry.kind==='venta'&&APP.balance(entry.clientId)-num(entry.amount)<-0.001){alert('No podés eliminar esta venta porque ya tiene cobros que superarían el saldo restante. Revisá los movimientos de ese cliente primero.');return}if(confirm('¿Eliminar este movimiento? Se recalcularán todos los saldos.')){db.entries=db.entries.filter(x=>x.id!==id);save();notify('Movimiento eliminado')}},
 wa(id){const c=APP.client(id);if(!c)return;const total=Math.max(0,APP.balance(id)),late=APP.overdue(id);const message=`Hola, ${c.name}. Te contactamos para informar que tu cuenta corriente presenta un saldo pendiente de ${money(total)}${late?' (incluye '+money(late)+' vencidos)':''}. ¿Podemos coordinar el pago? Muchas gracias.`;msgLink(c.phone,message)}
 }
};

<script>'use strict';
const h = (x) => String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(x)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(x)||0);
const num=x=>Number(x)||0;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const plusDays=(date,n)=>{const [y,m,d]=date.split('-').map(Number);const day=new Date(y,m-1,d);day.setDate(day.getDate()+Number(n));return `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`};
const daysBetween=(a,b)=>{const d=x=>{const [y,m,dd]=x.split('-').map(Number);return Date.UTC(y,m-1,dd)};return Math.round((d(b)-d(a))/86400000)};
const dateText=v=>v?`${v.slice(8,10)}/${v.slice(5,7)}/${v.slice(0,4)}`:'—';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const initial=name=>String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const dateInput=(v)=>v||today();
const pill=(label,color='info')=>`<span class="pill ${color}"><span class="dot"></span>${h(label)}</span>`;
const cellName=(name,detail)=>`<div class="cellName"><span class="initial">${h(initial(name))}</span><div><div class="strong">${h(name)}</div>${detail?`<div class="meta">${h(detail)}</div>`:''}</div></div>`;
const escAttr=h;
const btn=(txt,act,id,cls='sm')=>`<button class="btn ${cls}" type="button" data-action="${h(act)}" data-id="${h(id??'')}">${txt}</button>`;
const smallLink=(txt,act,id)=>`<button class="link" type="button" data-action="${h(act)}" data-id="${h(id??'')}">${txt}</button>`;
const card=(label,value,icon,note='')=>`<div class="stat"><div class="statLabel"><span>${h(label)}</span><span class="statIcon">${icon}</span></div><div class="statValue">${value}</div><div class="statNote">${h(note)}</div></div>`;
const stats=(arr)=>`<section class="stats">${arr.join('')}</section>`;
const empty=(text='Todavía no hay registros',caption='Agregá el primer registro para comenzar.')=>`<div class="empty"><div class="emptyIcon">🗂️</div><b>${h(text)}</b><div>${h(caption)}</div></div>`;
const panel=(title,content,extra='')=>`<section class="panel"><div class="panelHead"><h2>${h(title)}</h2><span>${extra}</span></div>${content}</section>`;
const table=(head,rows)=>rows.length?`<div class="tableScroll"><table><thead><tr>${head.map(t=>`<th>${h(t)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty();
const printReport=(title,headers,rows,subtitle='')=>{const p=window.open('','_blank');if(!p){alert('Habilitá las ventanas emergentes para imprimir.');return}p.document.write(`<!doctype html><html lang="es"><meta charset="utf-8"><title>${h(title)}</title><style>body{font:13px Arial,sans-serif;padding:35px;color:#132238}h1{font-size:25px}p{color:#78849a}table{width:100%;border-collapse:collapse;margin-top:30px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e7ed}th{background:#edf1f6}footer{font-size:10px;color:#98a2af;margin-top:32px}@media print{@page{size:A4 landscape;margin:15mm}}</style><h1>${h(title)}</h1><p>${h(subtitle)} · Generado el ${dateText(today())}</p><table><tr>${headers.map(x=>`<th>${h(x)}</th>`).join('')}</tr>${rows.map(row=>`<tr>${row.map(x=>`<td>${h(x)}</td>`).join('')}</tr>`).join('')}</table><footer>Zenix AR · Exportación desde el navegador</footer></html>`);p.document.close();p.focus();p.print()};
const csvExport=(filename,headers,rows)=>{const cell=(x)=>{let v=String(x??'');if(/^[=+@]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`};const csv='\ufeff'+[headers,...rows].map(row=>row.map(cell).join(';')).join('\r\n');download(filename+'.csv',csv,'text/csv;charset=utf-8;')};
function download(filename,contents,type='application/json'){const b=new Blob([contents],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
const STORAGE_KEY='zenix-'+APP.key+'-v1';
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object'&&parsed.version===1)return parsed}}catch(e){console.warn('storage',e)}return structuredClone(APP.seed())}
let db=load();let tab='inicio';let search='';let filter='todos';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(err){alert('No se pudieron guardar los datos. Revisá si el navegador permite almacenamiento local.')}render()}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function modal(title,fields,onSave,defaults={},tip=''){const html=fields.map(f=>{const value=defaults[f.name]??f.default??'';const a=`name="${h(f.name)}" id="field-${h(f.name)}" ${f.required===false?'':'required'} ${f.min!==undefined?`min="${h(f.min)}"`:''} ${f.step!==undefined?`step="${h(f.step)}"`:''} ${f.placeholder?`placeholder="${h(f.placeholder)}"`:''}`;let inp;if(f.type==='select'){inp=`<select ${a}>${f.options.map(o=>{const obj=typeof o==='string'?{value:o,label:o}:o;return `<option value="${h(obj.value)}" ${String(value)===String(obj.value)?'selected':''}>${h(obj.label)}</option>`}).join('')}</select>`}else if(f.type==='textarea')inp=`<textarea ${a}>${h(value)}</textarea>`;else inp=`<input type="${h(f.type||'text')}" ${a} value="${h(value)}"/>`;return `<div class="field ${f.wide?'wide':''}"><label for="field-${h(f.name)}">${h(f.label)}</label>${inp}</div>`}).join('');document.getElementById('modal-root').innerHTML=`<div class="floatMask" id="mask"><section class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="modalTop"><h2>${h(title)}</h2><button type="button" class="close" id="modalClose" aria-label="Cerrar">×</button></div><form id="entryForm"><div class="formGrid">${html}</div>${tip?`<p class="helper">${h(tip)}</p>`:''}<div class="modalFoot"><button type="button" class="btn" id="formCancel">Cancelar</button><button type="submit" class="btn primary">Guardar cambios →</button></div></form></section></div>`;const root=document.getElementById('modal-root');const close=()=>root.innerHTML='';root.querySelector('#modalClose').onclick=close;root.querySelector('#formCancel').onclick=close;root.querySelector('#mask').onclick=e=>{if(e.target.id==='mask')close()};root.querySelector('#entryForm').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.currentTarget).entries());try{const result=onSave(vals);if(result===false)return;close();save();notify('Los cambios se guardaron correctamente')}catch(err){alert(err?.message||String(err))}};setTimeout(()=>root.querySelector('input,select,textarea')?.focus(),20)}
const msgLink=(phone,text)=>{let p=String(phone??'').replace(/\D/g,'');if(p.startsWith('0'))p=p.slice(1);if(p.length===10)p='54'+p;if(!p){notify('Este cliente no tiene teléfono cargado.');return}window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank','noopener,noreferrer')};

function accountLedger(clientId){
  const events=db.entries.map((x,i)=>({...x,order:i})).filter(x=>x.clientId===clientId)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.order-b.order);
  let balance=0;
  return events.map(x=>{
    balance+=x.kind==='venta'?num(x.amount):-num(x.amount);
    return {...x,balance};
  });
}
function clientAccountDialog(id){
  const c=APP.client(id);if(!c)return;
  const rows=accountLedger(id);
  const balance=Math.max(0,APP.balance(id));
  const overdue=APP.overdue(id);
  const tableRows=rows.map(x=>'<tr><td>'+h(dateText(x.date))+'</td><td>'+h(x.kind==='venta'?'Venta a crédito':'Cobro')+'</td><td>'+h(x.concept||'—')+'</td><td class="number">'+(x.kind==='venta'?money(x.amount):'—')+'</td><td class="number">'+(x.kind==='pago'?money(x.amount):'—')+'</td><td class="number"><b>'+money(x.balance)+'</b></td></tr>').join('');
  const root=document.getElementById('modal-root');
  root.innerHTML='<div class="floatMask" id="accountMask"><section class="modal accountModal" role="dialog" aria-modal="true" aria-label="Estado de cuenta de '+h(c.name)+'">'
    +'<div class="modalTop"><div><div class="accountEyebrow">ESTADO DE CUENTA</div><h2>'+h(c.name)+'</h2><div class="accountSubtitle">'+h(c.zone||'Sin zona')+' · '+h(c.phone||'Sin teléfono registrado')+'</div></div><button class="close" type="button" id="accountClose" aria-label="Cerrar">×</button></div>'
    +'<div class="accountBody"><div class="accountSummary"><div class="accountTile"><span>Saldo pendiente</span><b>'+money(balance)+'</b></div><div class="accountTile accountTileLate"><span>Saldo vencido estimado</span><b>'+money(overdue)+'</b></div><div class="accountTile"><span>Límite configurado</span><b>'+(num(c.limit)>0?money(c.limit):'Sin límite')+'</b></div></div>'
    +'<div class="accountSectionTitle">Historial de movimientos <small>'+rows.length+' registros</small></div>'
    +(rows.length?'<div class="accountTableWrap"><table><thead><tr><th>Fecha</th><th>Operación</th><th>Concepto</th><th>Venta</th><th>Cobro</th><th>Saldo</th></tr></thead><tbody>'+tableRows+'</tbody></table></div>':'<div class="accountEmpty">Todavía no hay ventas ni cobros registrados para este cliente.</div>')
    +'<div class="accountHint">El saldo vencido es una estimación según fechas de venta, vencimientos y cobros registrados. Los datos se guardan en este navegador.</div></div>'
    +'<div class="modalFoot accountFoot"><button type="button" class="btn" id="accountCancel">Cerrar</button><button type="button" class="btn" data-action="printAccount" data-id="'+h(id)+'">Imprimir / Guardar PDF</button>'+(balance>0?'<button type="button" class="btn primary" data-action="pay" data-id="'+h(id)+'">Registrar cobro</button>':'')+'</div>'
    +'</section></div>';
  const close=()=>{root.innerHTML=''};
  root.querySelector('#accountClose').onclick=close;
  root.querySelector('#accountCancel').onclick=close;
  root.querySelector('#accountMask').onclick=e=>{if(e.target.id==='accountMask')close()};
  root.querySelector('#accountClose').focus();
}

function reportPage(){const data=APP.report();return `<div class="heading"><div><p class="eyebrow">Datos y respaldo</p><h1>Informes y exportaciones</h1><p class="sub">Exportá tus registros. En PDF se utiliza la opción de imprimir del navegador.</p></div></div><div class="twoPanels">${panel('Generar informes',`<div class="panelBody"><p class="tips">Descargá una planilla CSV compatible con Excel, o generá un informe listo para guardar en PDF.</p><div class="reportActions">${btn('⬇ Exportar Excel (CSV)','csv','', 'primary')}${btn('▣ Guardar PDF','print')}</div><div class="note" style="margin-top:18px">El PDF se crea desde la opción <b>Guardar como PDF</b> de la ventana de impresión.</div></div>`)}${panel('Copias de seguridad',`<div class="panelBody"><p class="tips">Todos los datos se guardan en este navegador. Creá una copia JSON periódicamente. Para cambiar de dispositivo, importá ese archivo.</p><div class="reportActions">${btn('⬇ Descargar JSON','backup')}${btn('⬆ Importar JSON','import')}</div><p class="tips" style="margin-top:20px">También podés borrar los datos de ejemplo y comenzar desde cero.</p>${btn('Borrar todos los datos','clear','', 'danger')}</div>`)}</div>${panel('Resumen del informe',`<div class="panelBody">${data.summary.map(x=>`<div class="reportRow"><span class="muted">${h(x[0])}</span><strong>${h(x[1])}</strong></div>`).join('')}</div>`)}`}

function shellOverview(){
  const receivable=db.clients.reduce((s,c)=>s+Math.max(0,APP.balance(c.id)),0);
  const overdue=db.clients.reduce((s,c)=>s+APP.overdue(c.id),0);
  const debtors=db.clients.filter(c=>APP.balance(c.id)>0).length;
  const overdueClients=db.clients.filter(c=>APP.overdue(c.id)>0).length;
  return {receivable,overdue,debtors,overdueClients};
}
function viewCopy(key){
  return {
    inicio:['Tablero principal','Seguimiento claro del dinero pendiente, clientes con deuda y acciones de cobro prioritarias.'],
    clientes:['Cartera comercial','Gestioná cuentas corrientes, límites de crédito y contacto con cada cliente.'],
    movimientos:['Libro financiero','Registrá ventas a crédito y cobros con una trazabilidad simple y ordenada.'],
    vencimientos:['Cobranza prioritaria','Detectá rápido lo que venció y enfocá el seguimiento comercial.'],
    informes:['Exportaciones y respaldo','Descargá informes, protegé tus datos y mové la información entre dispositivos.']
  }[key]||['Panel financiero','Herramienta de gestión de cobranzas.'];
}

function renderPriorityFocus(){
  const priority=db.clients.filter(c=>APP.overdue(c.id)>0).sort((a,b)=>APP.overdue(b.id)-APP.overdue(a.id)).slice(0,3);
  const total=db.clients.reduce((s,c)=>s+Math.max(0,APP.balance(c.id)),0);
  const late=db.clients.reduce((s,c)=>s+APP.overdue(c.id),0);
  const risk=total>0?Math.min(100,Math.max(0,Math.round(late/total*100))):0;
  return `<section class="focus-panel"><div class="focus-left"><div class="focus-eyebrow">INTELIGENCIA DE COBRANZA · HOY</div><h2>${priority.length?'Hay cuentas que necesitan seguimiento.':'Tu cartera no registra saldos vencidos.'}</h2><p>${priority.length?`Tenés ${priority.length} ${priority.length===1?'cuenta prioritaria':'cuentas prioritarias'} para revisar. Priorizá las de mayor atraso.`:'Seguí registrando operaciones para mantener una visión actualizada del negocio.'}</p><div class="focus-actions"><button class="btn primary" type="button" data-action="goLate">Revisar vencimientos →</button><button class="btn" type="button" data-action="pay">Registrar cobro</button></div></div><div class="focus-right"><div class="focus-meter-title"><span>Exposición por vencimiento</span><b>${risk}%</b></div><div class="focus-meter"><i style="width:${risk}%"></i></div><p class="focus-meter-note">Proporción del saldo pendiente que ya venció.</p>${priority.length?`<div class="focus-list">${priority.map(c=>`<div class="focus-row"><div><b>${h(c.name)}</b><small>Saldo vencido</small></div><strong>${money(APP.overdue(c.id))}</strong></div>`).join('')}</div>`:'<div class="focus-clean">✓ Cartera sin vencimientos pendientes</div>'}</div></section>`;
}

function workspaceBarHTML(o){
  return `<section class="workspaceBar"><div class="workspaceLead"><b>Controlá tu cartera, ganá claridad.</b><p>Un lugar para registrar, consultar y hacer seguimiento de cada peso pendiente de cobro.</p></div><div class="workspaceMetric"><div class="workspaceMetricLabel">Cuentas por cobrar</div><div class="workspaceMetricValue">${money(o.receivable)}</div><div class="workspaceMetricNote">Saldo total</div></div><div class="workspaceMetric"><div class="workspaceMetricLabel">Importe vencido</div><div class="workspaceMetricValue">${money(o.overdue)}</div><div class="workspaceMetricNote">Prioridad</div></div><div class="workspaceMetric"><div class="workspaceMetricLabel">Clientes deudores</div><div class="workspaceMetricValue">${o.debtors}</div><div class="workspaceMetricNote">Cuentas activas</div></div></section>`;
}
function render(){
  const names=APP.tabs;
  const current=names.find(x=>x[0]===tab)||names[0];
  const overview=shellOverview();
  const copy=viewCopy(current[0]);
  document.documentElement.style.setProperty('--accent',APP.accent);
  document.title=APP.title+' | Zenix AR';
  document.getElementById('root').innerHTML=`
  <div class="shell">
    <aside class="sidebar">
      <div>
        <div class="brand"><div class="brandIcon">${APP.icon}</div><div><span>${h(APP.title)}</span><small>ZENIX AR · FINANZAS</small></div></div>
        <p class="navLabel">Espacio de trabajo</p>
        <nav class="nav" aria-label="Navegación">${names.map(x=>`<button type="button" data-nav="${x[0]}" class="${tab===x[0]?'active':''}"><b>${x[2]}</b><span>${h(x[1])}</span></button>`).join('')}</nav>
        <section class="sideCard"><div class="sideCardLabel">Saldo por cobrar</div><div class="sideCardValue">${money(overview.receivable)}</div><p class="sideCardSub">Cartera pendiente, actualizada con cada movimiento.</p><div class="sideMiniGrid"><div class="sideMini"><strong>${overview.debtors}</strong><span>con deuda</span></div><div class="sideMini"><strong>${overview.overdueClients}</strong><span>vencidos</span></div></div></section>
      </div>
      <div class="sideFoot"><strong>Entorno de demostración</strong><br>Los registros se guardan en este navegador. No ingreses datos reales.</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbarMain"><div class="crumb">COBRACLARO <span style="padding:0 6px">/</span> ${h(current[1])}</div><div class="topbarTitle">${h(copy[0])}</div><div class="topbarSub">${h(copy[1])}</div></div>
        <div class="topRight"><span class="signal ${overview.overdue>0?'bad':'good'}"><span class="sigDot"></span>${overview.overdue>0?`${overview.overdueClients} clientes vencidos`:'Sin atrasos registrados'}</span><span class="mark"><span class="sigDot"></span>DEMO LOCAL</span><div class="avatar">Z</div></div>
      </header>
      <main class="content">${tab==='inicio'?'':workspaceBarHTML(overview)}${tab==='informes'?reportPage():APP.render(tab)}${tab==='inicio'?renderPriorityFocus():''}<div class="footer">CobraClaro · Producto de Zenix AR · Los datos se guardan solo en este navegador</div></main>
    </div>
  </div>`;
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;search='';filter='todos';render();return}const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='backup')return download(APP.key+'-respaldo-'+today()+'.json',JSON.stringify(db,null,2));if(act==='import'){document.getElementById('importFile').click();return}if(act==='clear'){if(confirm('¿Borrar TODOS los registros guardados en este navegador? Esta acción no se puede deshacer. Hacé una copia JSON primero.')){db=APP.empty();save();notify('Se borraron todos los datos')}return}if(act==='csv'){const v=APP.report();csvExport(APP.key+'-'+today(),v.headers,v.rows);return}if(act==='print'){const v=APP.report();printReport(APP.title+' · Informe',v.headers,v.rows,v.subtitle);return}if(APP.actions[act])return APP.actions[act](id,b);});
document.addEventListener('input',e=>{if(e.target.dataset.search==='true'){search=e.target.value;const target=document.querySelector('#dynamicList');if(target&&APP.list)target.innerHTML=APP.list();}});
document.addEventListener('change',e=>{if(e.target.dataset.filter==='true'){filter=e.target.value;const target=document.querySelector('#dynamicList');if(target&&APP.list)target.innerHTML=APP.list();}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x?.version!==1||x?.app!==APP.key)throw new Error('El archivo no corresponde a esta aplicación.');const requiredArrays=Object.keys(APP.empty()).filter(k=>Array.isArray(APP.empty()[k]));if(requiredArrays.some(k=>!Array.isArray(x[k])))throw new Error('El respaldo tiene un formato incompleto.');if(!confirm('¿Reemplazar todos los datos actuales por este respaldo?'))return;db=x;save();notify('Copia restaurada')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}});
render();
</script>
</body>
