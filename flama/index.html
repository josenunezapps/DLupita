const items=()=>data.products.filter(p=>p.active);const total=()=>cart.reduce((a,x)=>a+x.price*x.qty,0);const count=()=>cart.reduce((a,x)=>a+x.qty,0);function card(p){return `<article class="card"><img loading="lazy" src="${pic(p.image)}" alt="${e(p.name)}"><div class="body"><span class="badge">${p.category==='Hamburguesas'?'Papas incluidas':p.demo?'Precio de demo':p.category==='Promos'?'Promoción':''}</span><h3>${e(p.name)}</h3><p class="desc">${e(p.description)}</p><div class="buy"><span class="price">${p.variants.length>1?'Desde ':''}${money(p.variants[0].price)}</span><button class="red" onclick="product('${p.id}')">${p.variants.length>1?'Elegir tamaño':'Agregar +'} </button></div></div></article>`}function selectTab(t){tab=t;render();requestAnimationFrame(()=>document.getElementById('menu').scrollIntoView({behavior:'smooth'}))}
function toggleNav(){document.getElementById('navsheet').classList.toggle('shown')}
function render(){if(location.hash==='#admin'){admin();return}const promos=items().filter(p=>p.category==='Promos');const b=items().find(p=>p.id==='bacontodo'),d=items().find(p=>p.category==='Bebidas');$('#app').innerHTML=`<header class="mast"><button class="hamb" aria-label="Abrir menú" onclick="toggleNav()">☰</button><a href="#inicio" class="logolink" aria-label="Inicio"><img src="${ASSET.logo}" alt="Flama Burguer"></a><button class="carticon" onclick="openCart()" aria-label="Carrito"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 5h4l4 17h15l4-12H9"/><circle cx="13" cy="27" r="2"/><circle cx="24" cy="27" r="2"/></svg><b>${count()}</b></button><div id="navsheet"><a href="#inicio" onclick="toggleNav()">Inicio</a><a href="#menu" onclick="toggleNav()">Menú</a><a href="#promos" onclick="toggleNav()">Promociones</a><a href="#admin">Administración</a></div></header><section class="hero" id="inicio"><div class="hero-photo"><img src="${ASSET.hero}" alt="Hamburguesa artesanal de referencia"></div><div class="copy"><div class="hero-kicker">USHUAIA · SMASH BURGERS</div><h1>Hamburguesas<br><em>artesanales</em></h1><div class="hero-services"><span>♨ Delivery</span><span>▣ Take Away</span></div><a href="#menu" class="hero-cta">Ver menú <span>›</span></a><div class="hero-meta"><div><span>◷</span><div><b>Horario</b><small>${e(data.settings.hours)}${data.settings.storeStatus==='closed'?' · Cerrado':data.settings.storeStatus==='open'?' · Abierto':''}</small></div></div><div><span>☎</span><div><b>Pedidos</b><small>+${e(data.settings.phone)}</small></div></div></div></div></section><div class="checker"></div><section class="wrap home-promos" id="promos"><div class="section-title"><span></span><h2>Promos imperdibles</h2><span></span></div><div class="feature-promos">${promos.map((p,i)=>`<button class="feature" onclick="product('${p.id}')" aria-label="Agregar ${e(p.name)}"><img src="${pic(p.image)}" alt=""><div class="feature-copy"><small>PROMO</small><strong>${e(p.name.replace(/ x2$/i,''))}${/ x2$/i.test(p.name)?'<i> x2</i>':''}</strong><b>${money(p.variants[0].price)}</b></div><span class="feature-add">+</span></button>`).join('')}</div></section><section class="wrap" id="menu"><div class="section-title"><span></span><h2>Nuestro menú</h2><span></span></div><div class="tabs">${[...new Set(['Hamburguesas','Bebidas','Promos',...(data.settings.categories||[]),...items().map(p=>p.category)])].map(t=>`<button class="${tab===t?'active':''}" data-store-tab="${e(t)}">${e(t)}</button>`).join('')}</div><div class="products">${items().filter(p=>p.category===tab).map(card).join('')||'<p>No hay productos disponibles.</p>'}</div><p class="notice">Demo comercial. Fotografías de referencia. Las bebidas y sus precios son ilustrativos; disponibilidad, promociones y costo de envío sujetos a confirmación del local.</p></section><footer class="foot"><strong>Flama Burguer</strong><p>${e(data.settings.address)} · Ushuaia</p><p>${e(data.settings.hours)}</p><a href="https://instagram.com/flama.burguers" target="_blank" rel="noopener">Instagram</a> · <a href="#admin">Administración</a></footer><div class="bottom"><a href="#inicio"><span>⌂</span>Inicio</a><a href="#menu" onclick="tab='Hamburguesas'"><span>☷</span>Menú</a><a href="#promos"><span>◇</span>Promos</a><button onclick="openCart()"><span>🛒${count()?'<b>'+count()+'</b>':''}</span>Carrito</button></div>`}function modal(html){$('#overlay').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="panel" role="dialog" aria-modal="true"><header><strong>FLAMA BURGUER</strong><button class="close" aria-label="Cerrar" onclick="closeModal()">×</button></header>${html}</section></div>`}function closeModal(){$('#overlay').innerHTML=''}function add(p,v,q=1){let old=cart.find(x=>x.id===p.id&&x.variant===v.name);if(old)old.qty+=q;else cart.push({id:p.id,name:p.name,category:p.category,demo:p.demo,variant:v.name,price:v.price,qty:q,image:p.image});}let chosen=0,amount=1,current=null;function product(id){current=items().find(p=>p.id===id);if(!current)return;chosen=0;amount=1;if(current.variants.length===1){let first=!cart.length;add(current,current.variants[0]);render();if(first)openCart();return}productView()}function productView(){let p=current;modal(`<img src="${pic(p.image)}" alt=""><h2>${e(p.name)}</h2><p class="muted">${e(p.description)}${p.category==='Hamburguesas'?' · Incluye papas.':''}</p><div class="options">${p.variants.map((v,i)=>`<button class="${i===chosen?'active':''}" onclick="chosen=${i};productView()">${e(v.name)}<br>${money(v.price)}</button>`).join('')}</div><div class="qty"><button onclick="amount=Math.max(1,amount-1);productView()">−</button>${amount}<button onclick="amount++;productView()">+</button></div><button class="red full" onclick="confirmProduct()">Agregar · ${money(p.variants[chosen].price*amount)}</button>`)}function confirmProduct(){let first=!cart.length;add(current,current.variants[chosen],amount);closeModal();render();if(first)openCart()}function change(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);render();openCart()}function openCart(){modal(`<h2>Tu pedido</h2>${cart.length?cart.map((x,i)=>`<div class="line"><img src="${pic(x.image)}" alt=""><div class="grow"><strong>${e(x.name)}</strong><div class="muted">${e(x.variant)} · ${money(x.price)}</div><div class="qty"><button onclick="change(${i},-1)">−</button>${x.qty}<button onclick="change(${i},1)">+</button></div></div><strong>${money(x.price*x.qty)}</strong></div>`).join('')+`<div class="total"><span>Subtotal</span><span>${money(total())}</span></div><p class="muted">Envío a confirmar por WhatsApp.</p><button class="red full" onclick="continueOrder()">Continuar pedido →</button>`:'<p class="muted">Todavía no agregaste nada.</p><button class="red full" onclick="closeModal();location.hash=\'menu\'">Ver menú</button>'}<button class="dark full" onclick="closeModal()">Seguir comprando</button>`)}function continueOrder(){let drinks=items().filter(p=>p.category==='Bebidas');if(!cart.some(x=>x.category==='Bebidas')&&drinks.length){modal(`<h2>¿Y algo para tomar?</h2><p class="muted">Completá tu pedido con una bebida.</p>${drinks.map(p=>`<div class="line"><img src="${pic(p.image)}" alt=""><div class="grow"><strong>${e(p.name)}</strong><div class="muted">${money(p.variants[0].price)} ${p.demo?'· Demo':''}</div></div><button class="red" onclick="addDrink('${p.id}')">+ Agregar</button></div>`).join('')}<button class="dark full" onclick="checkout()">No, gracias. Continuar</button>`)}else checkout()}function addDrink(id){let p=items().find(x=>x.id===id);add(p,p.variants[0]);render();checkout()}function checkout(){modal(`<h2>Último paso</h2><form onsubmit="sendOrder(event)"><label class="field">Tu nombre<input id="name" required maxlength="80" value="${e(draft.name)}"></label><label class="field">¿Cómo lo querés?<select id="mode" onchange="$('#addressField').classList.toggle('hide',this.value==='Retiro');$('#address').required=this.value==='Delivery'"><option>Delivery</option><option ${draft.mode==='Retiro'?'selected':''}>Retiro</option></select></label><label class="field ${draft.mode==='Retiro'?'hide':''}" id="addressField">Dirección<input id="address" ${draft.mode==='Retiro'?'':'required'} maxlength="150" value="${e(draft.address)}"></label><label class="field">Observaciones<textarea id="notes" maxlength="300">${e(draft.notes)}</textarea></label><div class="total"><span>Subtotal</span><span>${money(total())}</span></div><p class="notice">No se realiza ningún pago en esta app. El local confirma disponibilidad, total y entrega por WhatsApp. ${cart.some(x=>x.demo)?'Incluye bebidas con precio de demostración.':''}</p><button class="red full">Abrir WhatsApp ↗</button></form><button class="dark full" onclick="openCart()">Volver al carrito</button>`)}function sendOrder(ev){ev.preventDefault();draft={name:$('#name').value,mode:$('#mode').value,address:$('#address').value,notes:$('#notes').value};if(!cart.length)return;let message=`Hola Flama! Quiero consultar este pedido${cart.some(x=>x.demo)?' (incluye precios de demo por confirmar)':''}:\n`+cart.map(x=>`• ${x.qty} × ${x.name} ${x.variant} — ${money(x.price*x.qty)}${x.demo?' (a confirmar)':''}`).join('\n')+`\nSubtotal: ${money(total())}\n${draft.mode} — ${draft.name}`+(draft.mode==='Delivery'?`\nDirección: ${draft.address}`:'')+(draft.notes?`\nObservaciones: ${draft.notes}`:'')+'\n¿Me confirman disponibilidad y total final?';window.open('https://wa.me/'+data.settings.phone+'?text='+encodeURIComponent(message),'_blank','noopener')}
function admin(){closeModal();if(!online){$('#app').innerHTML=`<main class="admin"><a href="#inicio">← Volver</a><h2>Administración privada</h2><div class="box">El acceso administrativo necesita el servidor de Flama. En esta vista local solo está disponible la tienda pública.</div></main>`;return}if(!session){$('#app').innerHTML=`<main class="admin"><a href="#inicio">← Volver a la tienda</a><h2>Acceso autorizado</h2><div class="box"><form onsubmit="login(event)"><label class="field">Usuario<input id="user" required autocomplete="username"></label><label class="field">Contraseña<input id="pass" type="password" required autocomplete="current-password"></label><button class="red">Iniciar sesión</button><p id="err" class="error"></p></form><p class="notice">Sin registro público. Las cuentas se habilitan desde el servidor.</p></div></main>`;return}$('#app').innerHTML=`<main class="admin"><div class="row"><a href="#inicio">← Tienda</a><button class="dark" onclick="logout()">Cerrar sesión</button></div><h2>Panel de Flama</h2><p class="muted">Gestioná el catálogo y los datos públicos.</p><div class="box"><div class="row"><h3>Productos · ${data.products.length}</h3><button class="red" onclick="editProduct()">Nuevo producto</button></div>${data.products.map(p=>`<div class="line"><img src="${pic(p.image)}" alt=""><div class="grow"><strong>${e(p.name)}</strong><div class="muted">${e(p.category)} · ${p.active?'Disponible':'Oculto'} · ${p.variants.map(v=>money(v.price)).join(' / ')}</div></div><button class="dark" onclick="editProduct('${p.id}')">Editar</button></div>`).join('')}</div><div class="box"><h3>Datos del negocio</h3><form onsubmit="saveSettings(event)"><label class="field">WhatsApp (código internacional, solo números)<input id="phone" required pattern="[0-9]{10,15}" value="${e(data.settings.phone)}"></label><label class="field">Dirección<input id="address" required value="${e(data.settings.address)}"></label><label class="field">Horario visible<input id="hours" required value="${e(data.settings.hours)}"></label><label class="field"><input type="checkbox" id="defaultSchedule" ${data.settings.scheduleDefault?'checked':''}> Calcular abierto/cerrado con horario original (mar–dom 20 a 01)</label><button class="red">Guardar datos</button><p id="settingsMsg"></p></form></div></main>`}async function login(ev){ev.preventDefault();try{session=await api('login','POST',{user:$('#user').value,pass:$('#pass').value});data=await api('admin/catalog');admin()}catch(x){$('#err').textContent=x.message}}async function logout(){try{await api('logout','POST',{csrf:session.csrf})}finally{session=null;data=await api('catalog');admin()}}function editProduct(id){let p=data.products.find(x=>x.id===id)||{id:'',name:'',category:'Hamburguesas',description:'',image:ASSET.hero,active:true,demo:false,variants:[{name:'Simple',price:0},{name:'Doble',price:0},{name:'Triple',price:0}]};adminId=p.id;modal(`<h2>${p.id?'Editar':'Nuevo'} producto</h2><form onsubmit="saveProduct(event)"><label class="field">Nombre<input id="pname" required value="${e(p.name)}"></label><label class="field">Categoría<select id="pcat">${['Hamburguesas','Promos','Bebidas'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Descripción<textarea id="pdesc">${e(p.description)}</textarea></label><label class="field">Variantes (una por línea: nombre|precio)<textarea id="pvars" required>${e(p.variants.map(v=>v.name+'|'+v.price).join('\n'))}</textarea></label><label class="field">Reemplazar foto<input type="file" id="pfile" accept="image/jpeg,image/png,image/webp"></label><label class="field"><input type="checkbox" id="pactive" ${p.active?'checked':''}> Disponible</label><label class="field"><input type="checkbox" id="pdemo" ${p.demo?'checked':''}> Producto/precio de demo</label><button class="red full">Guardar</button><p id="pmsg" class="error"></p></form>${p.id?'<button class="dark full" onclick="removeProduct()">Eliminar producto</button>':''}`)}async function saveProduct(ev){ev.preventDefault();try{let old=data.products.find(x=>x.id===adminId),image=old?.image||ASSET.hero,f=$('#pfile').files[0];if(f){if(f.size>1500000)throw Error('Foto mayor a 1,5 MB');image=await new Promise((r,j)=>{let reader=new FileReader();reader.onload=()=>r(reader.result);reader.onerror=j;reader.readAsDataURL(f)})}let variants=$('#pvars').value.split('\n').filter(x=>x.trim()).map(x=>{let [name,price]=x.split('|');if(!name||!Number.isFinite(+price)||+price<=0)throw Error('Revisá las variantes y precios');return {name:name.trim(),price:+price}});data=await api('admin/product','POST',{csrf:session.csrf,product:{id:adminId,name:$('#pname').value,category:$('#pcat').value,description:$('#pdesc').value,variants,image,active:$('#pactive').checked,demo:$('#pdemo').checked}});admin()}catch(x){$('#pmsg').textContent=x.message}}async function removeProduct(){if(!confirm('¿Eliminar este producto?'))return;try{data=await api('admin/delete','POST',{csrf:session.csrf,id:adminId});admin()}catch(x){$('#pmsg').textContent=x.message}}async function saveSettings(ev){ev.preventDefault();try{data=await api('admin/settings','POST',{csrf:session.csrf,settings:{phone:$('#phone').value,address:$('#address').value,hours:$('#hours').value,scheduleDefault:$('#defaultSchedule').checked}});admin();$('#settingsMsg').textContent='Guardado.'}catch(x){$('#settingsMsg').textContent=x.message}}window.addEventListener('hashchange',render);document.addEventListener('click',ev=>{const b=ev.target.closest('[data-store-tab]');if(b)selectTab(b.dataset.storeTab)});
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script><script src="admin.js?v=3"></script></body></html>
