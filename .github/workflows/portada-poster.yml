name: Generar poster fiel al video de portada
on:
  push:
    branches: [main]
    paths:
      - 'assets/portada.mp4'
      - '.github/workflows/portada-poster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer primer fotograma original
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -y -i assets/portada.mp4 -frames:v 1 -vf "scale='min(1600,iw)':-2" -q:v 3 assets/portada-poster.jpg
          test -s assets/portada-poster.jpg
      - name: Guardar imagen del video en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portada-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generar fotograma inicial real para la portada"
            git push
          fi
