name: Build Zenix Android Apps
on:
  push:
    paths:
      - 'android-labs/source.zip'
      - '.github/workflows/build-zenix-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android native projects
        run: |
          cd android-labs
          unzip -oq source.zip
      - name: Compile Android debug APKs
        working-directory: android-labs
        run: gradle :fotopro:assembleDebug :repartos:assembleDebug --stacktrace --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android-labs/fotopro/build/outputs/apk/debug/fotopro-debug.apk dist/Zenix-FotoPro-v0.1.apk
          cp android-labs/repartos/build/outputs/apk/debug/repartos-debug.apk dist/Zenix-Repartos-v0.1.apk
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zenix-Android-Debug-APKs
          path: dist/*.apk
          retention-days: 30
      - name: Publish test APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=zenix-android-v0.1
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Zenix Android — MVP de prueba" --notes "Dos APK de prueba nativos para Android 10+. No son versiones de producción."
          gh release upload "$TAG" dist/*.apk --clobber
