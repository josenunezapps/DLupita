name: Remove Zenix Android previews
on:
  push:
    paths:
      - .github/workflows/cleanup-zenix-android.yml
permissions:
  contents: write
  actions: write
jobs:
  remove-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Remove two-app APK release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view zenix-android-v0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete zenix-android-v0.1 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Removed zenix-android-v0.1 release and tag"
          else
            echo "Release already absent"
          fi
      - name: Remove APK build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/12232031911" || true
      - name: Remove Android build run histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN in 39347636399 39347714930 39347770469 39347966633; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN" || echo "Couldn't delete workflow run $RUN"
          done
