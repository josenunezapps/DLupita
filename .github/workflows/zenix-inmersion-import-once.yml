name: Importar Zenix 3D desde ZIP
on:
  push:
    paths:
      - '.github/workflows/zenix-inmersion-import-once.yml'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copiar contenido original
        env:
          SOURCE_ZIP: https://d2ol7oe51mr4n9.cloudfront.net/user_3JhuYVTAZZfkugncJaW2oz5H8Sc/74fe7a44-b2c0-4e25-9647-11251efdd61e.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_ZIP" --output /tmp/zenix-original.zip
          mkdir -p /tmp/zenix-archive
          unzip -qq /tmp/zenix-original.zip -d /tmp/zenix-archive
          test -f /tmp/zenix-archive/zenix-inmersion-profesional/index.html
          test -f /tmp/zenix-archive/zenix-inmersion-profesional/vendor/three.module.min.js
          rm -rf zenix-inmersion-profesional
          cp -a /tmp/zenix-archive/zenix-inmersion-profesional .
          git add -- zenix-inmersion-profesional
          if git diff --cached --quiet; then
            echo "El contenido ya coincide"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publicar Zenix Inmersion Profesional sin modificar archivos"
          git push origin HEAD:main
