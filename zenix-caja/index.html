<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenix Caja</title>
<meta name="description" content="Punto de venta para comercios: ventas con lector de código, stock, caja con arqueo, tickets y métricas. Funciona sin internet.">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Zenix Caja · Punto de venta">
<meta property="og:description" content="Vendé, controlá stock y cerrá la caja desde el celular o la PC. Sin internet, sin instalar nada.">
<script>
  // tema antes del primer pintado, para evitar el destello
  try { const t = localStorage.getItem('zenix-caja:theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<noscript><p style="padding:24px;font-family:sans-serif">Zenix Caja necesita JavaScript activado.</p></noscript>
</body>
</html>
