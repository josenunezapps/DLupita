<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5F5F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111016" media="(prefers-color-scheme: dark)">
  <title>Zenix OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%232563EB'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='800' text-anchor='middle' fill='%23fff'%3EZ%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app/styles.css?v=1">
  <link rel="modulepreload" href="app/main.js?v=1">
  <link rel="modulepreload" href="app/config.js">
  <link rel="modulepreload" href="app/lib/api.js">
  <link rel="modulepreload" href="app/lib/dom.js">
  <link rel="modulepreload" href="app/lib/money.js">
  <link rel="modulepreload" href="app/lib/validate.js">
  <link rel="modulepreload" href="app/lib/roles.js">
  <link rel="modulepreload" href="app/views/shell.js">
  <link rel="modulepreload" href="app/views/auth.js">
  <link rel="modulepreload" href="app/views/start.js">
  <link rel="modulepreload" href="app/views/home.js">
  <link rel="modulepreload" href="app/views/products.js">
  <link rel="modulepreload" href="app/views/stock.js">
  <link rel="modulepreload" href="app/views/customers.js">
  <link rel="modulepreload" href="app/views/team.js">
  <link rel="modulepreload" href="app/views/business.js">
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">
      <div class="spinner" id="boot-spinner" aria-hidden="true"></div>
      <p id="boot-msg" role="status">Cargando Zenix OS…</p>
      <button class="btn btn-primary" id="boot-retry" type="button" hidden onclick="location.reload()">Reintentar</button>
    </div>
    <noscript><p class="boot">Zenix OS necesita JavaScript activado.</p></noscript>
  </div>
  <script>
    window.__cpFail = function (msg) {
      if (window.__cpStarted) return;
      var m = document.getElementById('boot-msg');
      var r = document.getElementById('boot-retry');
      var s = document.getElementById('boot-spinner');
      if (m) m.textContent = 'No se pudo cargar Zenix OS. ' + msg;
      if (r) r.hidden = false;
      if (s) s.hidden = true;
    };
    window.addEventListener('error', function (e) {
      window.__cpFail('Detalle: ' + (e.message || 'error al cargar un archivo') + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : ''));
    });
    setTimeout(function () { window.__cpFail('Está tardando demasiado: revisá tu conexión.'); }, 20000);
  </script>
  <script type="module" src="app/main.js?v=1" onerror="__cpFail('Falta un archivo de la app o tu navegador no es compatible.')"></script>
  <script nomodule>window.__cpFail('Tu navegador es muy antiguo. Actualizá Chrome o abrilo en otro navegador.');</script>
</body>
</html>
