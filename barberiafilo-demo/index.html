<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Turnos Barbería Filo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: reserva en 3 pasos apilados (servicio → día y hora → datos) con resumen y confirmación */
:root{
  --bg:#f4f3f1;--surface:#ffffff;--fg:#1c1b1a;--muted:#6d6a65;--line:#e1ded8;
  --accent:#a8741a;--accent-fg:#ffffff;--taken:#e9e6e1;
  --display:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141312;--surface:#1d1c1a;--fg:#efece7;--muted:#a19c94;--line:#2f2d2a;
  --accent:#e2a94a;--accent-fg:#1a1306;--taken:#262421;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312;--surface:#1d1c1a;--fg:#efece7;--muted:#a19c94;--line:#2f2d2a;
  --accent:#e2a94a;--accent-fg:#1a1306;--taken:#262421;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:600px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.demo{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(30px,9vw,46px)/1 var(--display);margin:6px 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
h2{font:600 15px var(--display);margin:0 0 10px;display:flex;gap:10px;align-items:center}
h2 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px}
.opts{display:grid;gap:8px}
.svc{display:flex;justify-content:space-between;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--body);cursor:pointer}
.svc small{display:block;color:var(--muted);font-size:13px}
.svc b{font-variant-numeric:tabular-nums;white-space:nowrap}
.svc[aria-pressed="true"],.day[aria-pressed="true"],.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.day{flex:0 0 62px;padding:10px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);cursor:pointer;text-align:center}
.day b{display:block;font:600 20px var(--display)}
.day:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:12px}
.slot{padding:11px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--body);font-variant-numeric:tabular-nums;cursor:pointer}
.slot:disabled{background:var(--taken);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;padding:13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--body)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.summary{background:var(--fg);color:var(--bg);border-radius:16px;padding:18px;display:grid;gap:12px}
.summary dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.summary dt{opacity:.7}
.summary dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.confirm{display:block;text-align:center;padding:15px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;text-decoration:none}
.confirm[aria-disabled="true"]{opacity:.4;pointer-events:none}
.hint{font-size:13px;opacity:.75;margin:0}
.foot{font-size:13px;color:var(--muted);text-align:center}
/* Compu: pasos a la izquierda, resumen fijo a la derecha */
@media (min-width:900px){
  .wrap{max-width:1080px;grid-template-columns:1.5fr 1fr;column-gap:40px;align-items:start;padding-block:48px 56px}
  .wrap>:nth-child(1){grid-column:1 / -1}
  .wrap>:nth-child(2),.wrap>:nth-child(3),.wrap>:nth-child(4){grid-column:1}
  .wrap>:nth-child(5){grid-column:2;grid-row:2 / span 3;position:sticky;top:24px}
  .wrap>:nth-child(6){grid-column:1 / -1}
  h1{font-size:60px}
  .opts{grid-template-columns:1fr 1fr}
  .days{overflow:visible;flex-wrap:wrap}
  .svc:hover,.day:not(:disabled):hover,.slot:not(:disabled):hover{border-color:var(--accent)}
}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <div class="demo">Ejemplo · Turnos por link</div>
    <h1>Barbería Filo</h1>
    <p class="sub">Reservá en 30 segundos. Te confirmamos por WhatsApp.</p>
  </div>

  <section><h2><i>1</i>Servicio</h2><div class="opts" id="svcs"></div></section>
  <section><h2><i>2</i>Día y hora</h2><div class="days" id="days"></div><div class="slots" id="slots"></div></section>
  <section><h2><i>3</i>Tus datos</h2><label for="name">Nombre</label><input id="name" autocomplete="name" placeholder="Ej: Juan Pérez"></section>

  <div class="summary">
    <dl id="sum"></dl>
    <a class="confirm" id="confirm" aria-disabled="true" target="_blank" rel="noopener">Elegí un horario</a>
    <p class="hint">Se abre WhatsApp con tu reserva lista para enviar. El turno queda tomado cuando la barbería responde.</p>
  </div>

  <p class="foot">Negocio, servicios y horarios de ejemplo.</p>
</div>

<script>
const WHATSAPP = "5491100000000";
const SVCS = [["Corte","30 min",12000],["Corte + barba","45 min",17000],["Barba y perfilado","20 min",8000],["Corte infantil","25 min",9500]];
const HOURS = ["10:00","10:30","11:00","11:30","12:00","12:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30"];
const DN = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const st = {svc:0, day:null, slot:null};
const fmt = n => "$" + n.toLocaleString("es-AR");
const $ = id => document.getElementById(id);

SVCS.forEach(([n,d,p],i)=>{
  const b=document.createElement("button"); b.className="svc"; b.setAttribute("aria-pressed",i===st.svc);
  b.innerHTML=`<span>${n}<small>${d}</small></span><b>${fmt(p)}</b>`;
  b.onclick=()=>{st.svc=i;[...$("svcs").children].forEach((x,j)=>x.setAttribute("aria-pressed",j===i));render();};
  $("svcs").appendChild(b);
});

const today=new Date(); today.setHours(0,0,0,0);
const days=[...Array(8)].map((_,i)=>{const d=new Date(today);d.setDate(d.getDate()+i);return d;});
// ocupados "falsos" pero estables por fecha, para que el demo se vea real
const busy=(d,h)=>((d.getDate()*7+h*13)%5)===0;
days.forEach((d,i)=>{
  const b=document.createElement("button"); b.className="day";
  b.innerHTML=`${i===0?"Hoy":DN[d.getDay()]}<b>${d.getDate()}</b>`;
  b.disabled=d.getDay()===0; b.setAttribute("aria-pressed","false");
  b.onclick=()=>{st.day=i;st.slot=null;[...$("days").children].forEach((x,j)=>x.setAttribute("aria-pressed",j===i));drawSlots();render();};
  $("days").appendChild(b);
});

function drawSlots(){
  const box=$("slots"); box.innerHTML=""; if(st.day===null) return;
  const d=days[st.day], now=new Date();
  HOURS.forEach((h,hi)=>{
    const [hh,mm]=h.split(":").map(Number), t=new Date(d); t.setHours(hh,mm);
    const b=document.createElement("button"); b.className="slot"; b.textContent=h;
    b.disabled=busy(d,hi)||t<now; b.setAttribute("aria-pressed",st.slot===hi);
    b.onclick=()=>{st.slot=hi;drawSlots();render();};
    box.appendChild(b);
  });
}

function render(){
  const [sn,,sp]=SVCS[st.svc], d=st.day!==null?days[st.day]:null, name=$("name").value.trim();
  const dayTxt=d?d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}):"—";
  const hour=st.slot!==null?HOURS[st.slot]:"—";
  $("sum").innerHTML=`<dt>Servicio</dt><dd>${sn}</dd><dt>Día</dt><dd>${dayTxt}</dd><dt>Hora</dt><dd>${hour}</dd><dt>Total</dt><dd>${fmt(sp)}</dd>`;
  const ready=d&&st.slot!==null&&name;
  const c=$("confirm"); c.setAttribute("aria-disabled",ready?"false":"true");
  c.textContent=!d||st.slot===null?"Elegí un horario":!name?"Escribí tu nombre":"Confirmar por WhatsApp";
  if(ready) c.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Hola! Quiero reservar:\n• ${sn}\n• ${dayTxt} a las ${hour}\n• A nombre de ${name}`)}`;
}
$("name").oninput=render;

// estado inicial de muestra: primer día hábil con lugar
const first=days.findIndex((d,i)=>i>0&&d.getDay()!==0);
$("days").children[first].click();
const freeSlot=[...$("slots").children].findIndex(b=>!b.disabled);
if(freeSlot>=0) $("slots").children[freeSlot].click();
</script>

</body>
</html>
