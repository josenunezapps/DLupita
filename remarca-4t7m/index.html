<!doctype html>
<html lang="es-AR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remarca, carteles y etiquetas de precios</title>
  <meta name="description" content="Cargá tus productos una vez y sacá carteles de oferta para WhatsApp, etiquetas de góndola para imprimir y remarcá todos los precios en un minuto.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFE600">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 16 10 5h20v22H10z' fill='%23FFE600'/%3E%3Ccircle cx='10.5' cy='16' r='2.2' fill='%2314161F'/%3E%3Cpath d='M16 21l8-10' stroke='%23E4002B' stroke-width='3'/%3E%3C/svg%3E">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('remarca.v1') || '{}').prefs || {};
      document.documentElement.dataset.theme = saved.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot" role="status" aria-label="Cargando Remarca">
    <div class="boot-tag"><span>$</span></div>
    <p>Remarca</p>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="brand"><span class="brand-tag" aria-hidden="true"></span><b>Remarca</b></div>
      <span id="shopName" class="shop-name"></span>
      <span id="saveState" class="save-state" aria-live="polite"></span>
      <button id="btnPalette" class="cmd" type="button" aria-haspopup="dialog"><i data-icon="search"></i><span>Buscar una acción</span><kbd>Ctrl K</kbd></button>
      <div class="top-actions">
        <button id="btnUndo" class="icon-btn" type="button" aria-label="Deshacer" title="Deshacer (Ctrl Z)"><i data-icon="undo"></i></button>
        <button id="btnRedo" class="icon-btn" type="button" aria-label="Rehacer" title="Rehacer (Ctrl Mayús Z)"><i data-icon="redo"></i></button>
        <button id="btnTheme" class="icon-btn" type="button" aria-label="Cambiar entre claro y oscuro" title="Tema claro u oscuro"><i data-icon="theme"></i></button>
        <button id="btnHelp" class="icon-btn" type="button" aria-label="Ayuda" title="Ayuda (?)"><i data-icon="help"></i></button>
      </div>
    </header>

    <nav class="nav" id="nav" role="tablist" aria-label="Secciones">
      <button role="tab" data-view="products" id="n-products" aria-controls="v-products"><i data-icon="products"></i><span>Productos</span></button>
      <button role="tab" data-view="posters" id="n-posters" aria-controls="v-posters"><i data-icon="posters"></i><span>Carteles</span></button>
      <button role="tab" data-view="labels" id="n-labels" aria-controls="v-labels"><i data-icon="labels"></i><span>Etiquetas</span></button>
      <button role="tab" data-view="shop" id="n-shop" aria-controls="v-shop"><i data-icon="shop"></i><span>Negocio</span></button>
    </nav>

    <main class="main" id="main">
      <div id="demoBanner" class="banner" hidden>
        <p><b>Estás viendo un almacén de ejemplo.</b> Los productos y precios son inventados; todo lo que hagas con ellos funciona de verdad.</p>
        <div class="row"><button type="button" class="btn dark" data-act="start-own">Empezar con mi negocio</button><button type="button" class="link" data-act="keep-demo">Quedarme con estos datos</button></div>
      </div>
      <section id="v-products" role="tabpanel" aria-labelledby="n-products" class="view"></section>
      <section id="v-posters" role="tabpanel" aria-labelledby="n-posters" class="view" hidden></section>
      <section id="v-labels" role="tabpanel" aria-labelledby="n-labels" class="view" hidden></section>
      <section id="v-shop" role="tabpanel" aria-labelledby="n-shop" class="view" hidden></section>
    </main>
  </div>

  <div id="printRoot" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="drop" class="drop" hidden><p>Soltá la lista de precios o la copia para importarla</p></div>

  <dialog id="palette" class="palette" aria-label="Buscar una acción">
    <div class="palette-input"><i data-icon="search"></i>
      <input id="paletteInput" type="text" placeholder="Escribí qué querés hacer: remarcar, imprimir, yerba…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="paletteList" aria-autocomplete="list">
      <kbd>Esc</kbd>
    </div>
    <ul id="paletteList" role="listbox"></ul>
  </dialog>
  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="sheet" class="dialog sheet"></dialog>
  <input id="fileCsv" type="file" accept=".csv,.txt,.tsv,text/csv,text/plain" hidden>
  <input id="fileBackup" type="file" accept=".json,application/json" hidden>
  <input id="fileLogo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

  <noscript><p class="noscript">Remarca necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/main.js"></script>
  <script nomodule>document.getElementById('boot').innerHTML = '<p>Este navegador es demasiado viejo para abrir Remarca. Probá con una versión actual de Chrome, Firefox o Safari.</p>';</script>
</body>
</html>
