<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de descargas MORFOTRAZO</title></head><body><main><h1>Diagnóstico de imágenes</h1><pre id="status">EJECUTANDO</pre></main><script>
(async()=>{
  const source="https://d2ol7oe51mr4n9.cloudfront.net/user_3JhuYVTAZZfkugncJaW2oz5H8Sc/b9b0300c-3f85-4acc-ab41-825917eb2e86.png";
  const proxy="https://wsrv.nl/?url="+encodeURIComponent(source)+"&output=jpg&q=95";
  const results=[];
  for (const [name,url] of [["origen",source],["proxy",proxy]]){
    const r={name};
    try{
      const img=await new Promise((resolve,reject)=>{
        const i=new Image();i.crossOrigin="anonymous";i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("CORS/BLOCKED"));i.src=url;
        setTimeout(()=>reject(new Error("TIMEOUT")),9000);
      });
      r.loaded=true;r.naturalWidth=img.naturalWidth;r.naturalHeight=img.naturalHeight;
      const c=document.createElement("canvas");c.width=320;c.height=180;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,320,180);
      r.canvas=c.toDataURL("image/jpeg").length>100;
    }catch(e){r.error=String(e)}
    results.push(r);document.getElementById("status").textContent=JSON.stringify(results,null,2);
  }
})();</script></body></html>
