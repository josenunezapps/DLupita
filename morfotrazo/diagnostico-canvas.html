<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Diagnóstico de acceso a imágenes</title></head><body><main><h1>Diagnóstico de imágenes MORFOTRAZO</h1><pre id="status">EJECUTANDO</pre></main><script>
(async()=>{
 const source='https://d2ol7oe51mr4n9.cloudfront.net/user_3JhuYVTAZZfkugncJaW2oz5H8Sc/b9b0300c-3f85-4acc-ab41-825917eb2e86.png';
 const wsrv='https://wsrv.nl/?url='+encodeURIComponent(source)+'&output=jpg&q=95';
 const sample='https://wsrv.nl/?url=wsrv.nl%2Flichtenstein.jpg&w=320&output=jpg';
 const pixel='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO//sQ0AAAAASUVORK5CYII=';
 const tasks=[['data-png',pixel,false],['same-origin-svg','./test-pixel.svg',false],['unsplash-cors','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=100',true],['cloudfront-normal',source,false],['cloudfront-cors',source,true],['proxy-cloudfront-normal',wsrv,false],['proxy-cloudfront-cors',wsrv,true],['proxy-public-cors',sample,true]];
 const results=await Promise.all(tasks.map(([name,url,cors])=>new Promise(resolve=>{
   const output={name};const image=new Image();if(cors)image.crossOrigin='anonymous';let done=false;
   const finish=(status)=>{if(done)return;done=true;output.status=status;output.width=image.naturalWidth;output.height=image.naturalHeight;resolve(output)};
   image.onload=()=>finish('LOADED');image.onerror=()=>finish('ERROR');image.src=url;
   setTimeout(()=>finish('TIMEOUT'),7000);
 })));
 document.querySelector('#status').textContent=JSON.stringify(results,null,2);
})();</script></body></html>
