<script>
/* ServiControl Empresarial — mejoras de producto sobre el motor estable */
APP.tabs=[['inicio','Resumen','▦'],['clientes','Clientes','♙'],['equipos','Equipos','⚙'],['agenda','Agenda','▣'],['ordenes','Órdenes','▤'],['historial','Historial','◴'],['informes','Informes','⇩']];
const __renderOriginal=APP.render.bind(APP);
const __listOriginal=APP.list.bind(APP);
const __seedOriginal=APP.seed.bind(APP);
APP.seed=()=>{
 const data=__seedOriginal();
 data.orders.push({id:'o2',equipmentId:'q1',date:plusDays(today(),2),completedDate:'',status:'pendiente',technician:'Por asignar',cost:0,notes:'Revisión preventiva pendiente de confirmar.'});
 return data;
};
const viewService=(tab)=>({inicio:['Centro de operaciones','Controlá servicios, equipos y visitas en un solo lugar.'],clientes:['Cartera de clientes','Empresas, datos de contacto y activos asociados.'],equipos:['Inventario técnico','Trazabilidad de cada equipo y su calendario preventivo.'],agenda:['Agenda preventiva','Servicios vencidos y próximas revisiones.'],ordenes:['Órdenes de trabajo','Planificá, completá y documentá intervenciones.'],historial:['Historial técnico','Registro de tareas realizadas y comprobantes.'],informes:['Informes y respaldo','Exportaciones, documentos y copias de seguridad.']})[tab]||['ServiControl','Gestión técnica'];
function pendingOrders(){return db.orders.filter(o=>o.status!=='realizado').sort((a,b)=>a.date.localeCompare(b.date))}
function workStatus(q){if(!q)return '—';const days=daysBetween(today(),q.next);return days<0?pill('Vencido · '+(-days)+' d','bad'):days<=30?pill('Próximo · '+days+' d','warn'):pill('Vigente','good')}
function serviceMetrics(){const overdue=APP.urgent().length;const upcoming=APP.schedule().filter(q=>q.next>=today()).length;return {overdue,upcoming,clients:db.clients.length,assets:db.equipment.length,pending:pendingOrders().length,done:db.orders.filter(o=>o.status==='realizado').length}}
function serviceStripe(){const s=serviceMetrics();return `<section class="serviceStripe"><div class="stripeIntro"><strong>Operación técnica, bajo control.</strong><p>Gestioná mantenimientos preventivos, órdenes y clientes sin perder el historial de cada equipo.</p></div><div><div class="metricLabel">Visitas vencidas</div><div class="metricValue">${s.overdue}</div><div class="metricCaption">Equipos para priorizar</div></div><div><div class="metricLabel">Órdenes abiertas</div><div class="metricValue">${s.pending}</div><div class="metricCaption">Pendientes de finalizar</div></div><div><div class="metricLabel">Próximos 30 días</div><div class="metricValue">${s.upcoming}</div><div class="metricCaption">Mantenimientos previstos</div></div></section>`}
APP.clientRows=function(){return db.clients.filter(c=>[c.name,c.address,c.phone].join(' ').toLowerCase().includes(search.toLowerCase())).map(c=>{const assets=db.equipment.filter(q=>q.clientId===c.id);const late=assets.filter(q=>q.next<today()).length;return [cellName(c.name,c.address||'Sin dirección'),h(c.phone||'—'),String(assets.length),late?pill(late+' vencido'+(late>1?'s':''),'bad'):pill('Al día','good'),`<div class="rowActions">${btn('Ver ficha','viewClient',c.id)}${smallLink('Editar','editClient',c.id)}</div>`]})};
APP.orderRows=function(){return [...db.orders].sort((a,b)=>a.status===b.status?b.date.localeCompare(a.date):a.status==='pendiente'?-1:1).filter(o=>{const q=APP.eq(o.equipmentId);return [q?.name,APP.client(q?.clientId)?.name,o.technician,o.notes].join(' ').toLowerCase().includes(search.toLowerCase())}).map(o=>{const q=APP.eq(o.equipmentId);const cl=APP.client(q?.clientId);return [cellName(q?.name||'Equipo eliminado',cl?.name||'Cliente'),dateText(o.date),pill(o.status==='realizado'?'Realizado':'Pendiente',o.status==='realizado'?'good':o.date<today()?'bad':'warn'),h(o.technician||'Sin asignar'),`<div class="rowActions">${o.status==='realizado'?smallLink('Informe PDF','orderPdf',o.id):btn('Completar','completeOrder',o.id)}${smallLink('Eliminar','delOrder',o.id)}</div>`]})};
APP.list=function(){if(tab==='clientes')return table(['Cliente','Contacto','Equipos','Estado','Acciones'],APP.clientRows());if(tab==='ordenes')return table(['Equipo / Cliente','Fecha','Estado','Responsable','Acciones'],APP.orderRows());return __listOriginal()};
APP.render=function(tab){
 if(tab==='clientes')return `<div class="heading"><div><p class="eyebrow">Relaciones comerciales</p><h1>Clientes y establecimientos</h1><p class="sub">Encontrá a cada cliente y consultá sus equipos, vencimientos e intervenciones.</p></div>${btn('＋ Nuevo cliente','newClient','','primary')}</div>${panel('Directorio de clientes',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar nombre, dirección o contacto..." value="${h(search)}"></div></div><div id="dynamicList">${APP.list()}</div>`)}`;
 if(tab==='ordenes'){const pending=pendingOrders().length;return `<div class="heading"><div><p class="eyebrow">Ejecución de servicios</p><h1>Órdenes de trabajo</h1><p class="sub">Dejá constancia de visitas programadas y completalas cuando el técnico termine.</p></div>${btn('＋ Nueva orden','addOrder','','primary')}</div><div class="orderBlock"><div><span>Por realizar</span><b>${pending}</b></div><div><span>Completadas</span><b>${db.orders.filter(o=>o.status==='realizado').length}</b></div><div><span>Equipos controlados</span><b>${db.equipment.length}</b></div><div><span>Clientes</span><b>${db.clients.length}</b></div></div>${panel('Seguimiento de órdenes',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar equipo, técnico u observación..." value="${h(search)}"></div></div><div id="dynamicList">${APP.list()}</div>`)}`}
 const original=__renderOriginal(tab);
 if(tab==='inicio'){const box=document.createElement('div');box.innerHTML=original;box.querySelector('.banner')?.remove();box.querySelector('.stats')?.remove();return serviceStripe()+box.innerHTML;}
 if(tab==='agenda'){
 const orders=pendingOrders().map(o=>{const q=APP.eq(o.equipmentId);return [cellName(q?.name||'Equipo eliminado',APP.client(q?.clientId)?.name||''),dateText(o.date),pill(o.date<today()?'Atrasada':'Programada',o.date<today()?'bad':'warn'),btn('Completar','completeOrder',o.id)]});
 return original+panel('Visitas programadas',table(['Equipo / Cliente','Fecha','Estado','Acción'],orders),`${orders.length} órdenes abiertas`);
 }
 return original;
};
function assetLedger(q){return [...db.orders].filter(o=>o.equipmentId===q.id).sort((a,b)=>b.date.localeCompare(a.date))}
function detailDialog(kicker,name,sub,statHtml,body,buttons){
 const root=document.getElementById('modal-root');
 root.innerHTML=`<div class="detailOverlay" id="detailMask"><section class="detailSheet" role="dialog" aria-modal="true" aria-label="${h(name)}"><div class="detailHead"><div><small>${h(kicker)}</small><h2>${h(name)}</h2><p>${h(sub)}</p></div><button class="detailClose" id="detailClose" aria-label="Cerrar">×</button></div><div class="detailBody"><div class="detailStats">${statHtml}</div>${body}</div><div class="detailFooter"><button type="button" class="btn" id="detailCancel">Cerrar</button>${buttons}</div></section></div>`;
 const close=()=>root.innerHTML='';root.querySelector('#detailClose').onclick=close;root.querySelector('#detailCancel').onclick=close;root.querySelector('#detailMask').onclick=e=>{if(e.target.id==='detailMask')close()};root.querySelector('#detailClose').focus();
}
const infoBox=(label,value)=>`<div class="detailStat"><label>${h(label)}</label><strong>${h(value)}</strong></div>`;
function eqDetail(id){const q=APP.eq(id);if(!q)return;const c=APP.client(q.clientId);const records=assetLedger(q);const rows=records.map(o=>[dateText(o.date),pill(o.status==='realizado'?'Realizado':'Planificado',o.status==='realizado'?'good':'warn'),h(o.technician||'—'),h(o.notes||'—'),smallLink('Informe PDF','orderPdf',o.id)]);detailDialog('Ficha técnica',q.name,(c?.name||'Cliente eliminado')+' · '+(q.serial||'Sin número de serie'),infoBox('Estado',q.next<today()?'Vencido':'Vigente')+infoBox('Próxima revisión',dateText(q.next))+infoBox('Frecuencia',q.frequency+' días'),`<div class="detailTitle">Intervenciones del equipo</div>${table(['Fecha','Estado','Responsable','Notas',''],rows)}`,`${btn('Editar equipo','editEq',id)}${btn('Registrar visita','addOrder',id,'primary')}${btn('PDF técnico','assetPdf',id)}`)}
function clientDetail(id){const c=APP.client(id);if(!c)return;const assets=db.equipment.filter(q=>q.clientId===id);const past=db.orders.filter(o=>assets.some(q=>q.id===o.equipmentId));detailDialog('Ficha del cliente',c.name,c.address||'Dirección no registrada',infoBox('Equipos',assets.length)+infoBox('Vencidos',assets.filter(q=>q.next<today()).length)+infoBox('Intervenciones',past.length),`<div class="detailTitle">Equipos asociados</div>${table(['Equipo','Categoría','Próximo servicio','Acción'],assets.map(q=>[cellName(q.name,q.serial||'Sin serie'),h(q.category),workStatus(q),btn('Ver equipo','viewEq',q.id)]))}`,`${btn('Editar cliente','editClient',id)}${btn('Informe PDF','clientPdf',id)}${btn('WhatsApp','waClient',id,'primary')}`)}
function eqFields(){return [{name:'clientId',label:'Cliente',type:'select',wide:true,options:db.clients.map(c=>({value:c.id,label:c.name}))},{name:'name',label:'Nombre del equipo',wide:true},{name:'category',label:'Categoría',type:'select',options:['Climatización','Calefacción','Electricidad','Bombas','Portones','Seguridad','Otro']},{name:'serial',label:'Número de serie',required:false},{name:'frequency',label:'Revisión cada (días)',type:'number',min:1,default:90},{name:'last',label:'Último servicio',type:'date',default:today()},{name:'next',label:'Próxima revisión (opcional)',type:'date',required:false,default:''}]}
APP.actions.viewEq=eqDetail;APP.actions.viewClient=clientDetail;
APP.actions.waClient=function(id){const c=APP.client(id);if(!c)return;msgLink(c.phone,'Hola '+c.name+', te contactamos desde el servicio técnico para coordinar un mantenimiento. ¿Podemos confirmar una fecha?')};
APP.actions.editClient=function(id){const c=APP.client(id);if(!c)return;modal('Editar cliente',[{name:'name',label:'Nombre / razón social',wide:true},{name:'phone',label:'WhatsApp',type:'tel',required:false},{name:'address',label:'Dirección',wide:true,required:false}],v=>Object.assign(c,{name:v.name.trim(),phone:v.phone.trim(),address:v.address.trim()}),c)};
APP.actions.newEq=function(){if(!db.clients.length){APP.actions.newClient();notify('Primero registrá un cliente');return}modal('Registrar equipo',eqFields(),v=>{const f=num(v.frequency);if(f<1)throw Error('Ingresá una frecuencia mayor a cero.');const next=v.next||plusDays(v.last,f);if(next<v.last)throw Error('La fecha próxima no puede ser anterior al último servicio.');db.equipment.push({...v,id:uid(),name:v.name.trim(),frequency:f,next})},{},'Si dejás vacía la próxima revisión, se calcula según la frecuencia.')};
APP.actions.editEq=function(id){const q=APP.eq(id);if(!q)return;modal('Editar equipo',eqFields(),v=>{const f=num(v.frequency);if(f<1)throw Error('La frecuencia debe ser mayor a cero.');const next=v.next||plusDays(v.last,f);if(next<v.last)throw Error('La próxima fecha no puede ser anterior al último servicio.');Object.assign(q,v,{frequency:f,next})},q,'Podés ajustar la frecuencia y la fecha del próximo servicio.')};
APP.actions.addOrder=function(id){if(!db.equipment.length){APP.actions.newEq();notify('Primero agregá un equipo');return}modal('Nueva orden de servicio',[{name:'equipmentId',label:'Equipo',type:'select',wide:true,options:db.equipment.map(q=>({value:q.id,label:q.name+' · '+(APP.client(q.clientId)?.name||'')}))},{name:'date',label:'Fecha de la visita',type:'date',default:today()},{name:'status',label:'Estado',type:'select',options:[{value:'pendiente',label:'Visita programada'},{value:'realizado',label:'Trabajo realizado'}]},{name:'technician',label:'Técnico responsable',required:false},{name:'cost',label:'Importe del servicio ($)',type:'number',min:0,default:0},{name:'notes',label:'Detalle, repuestos y observaciones',type:'textarea',wide:true,required:false}],v=>{
 const q=APP.eq(v.equipmentId);if(!q)throw Error('Equipo inválido');if(v.status==='realizado'&&v.date>today())throw Error('No podés marcar como realizada una visita futura.');if(num(v.cost)<0)throw Error('El importe no puede ser negativo.');const oldLast=q.last,oldNext=q.next;
 if(v.status==='realizado'){q.last=v.date;q.next=plusDays(v.date,q.frequency)}
 db.orders.push({...v,id:uid(),cost:num(v.cost),completedDate:v.status==='realizado'?v.date:'',priorLast:oldLast,priorNext:oldNext});
 },{equipmentId:id||db.equipment[0].id},'Programar una visita no modifica el ciclo preventivo. Solo se actualiza al marcar el trabajo como realizado.')};
APP.actions.completeOrder=function(id){const o=db.orders.find(x=>x.id===id);if(!o||o.status==='realizado')return;modal('Completar orden',[{name:'date',label:'Fecha en que se realizó',type:'date',default:today()},{name:'technician',label:'Técnico responsable',required:false},{name:'cost',label:'Importe del servicio ($)',type:'number',min:0,default:o.cost},{name:'notes',label:'Trabajo realizado, repuestos y observaciones',type:'textarea',wide:true,required:false}],v=>{
 if(v.date>today())throw Error('La fecha realizada no puede ser futura.');const q=APP.eq(o.equipmentId);if(!q)throw Error('No se encontró el equipo.');
 o.priorLast=q.last;o.priorNext=q.next;o.status='realizado';o.date=v.date;o.completedDate=v.date;o.technician=v.technician;o.cost=num(v.cost);o.notes=v.notes;q.last=v.date;q.next=plusDays(v.date,q.frequency);
 },{technician:o.technician,cost:o.cost,notes:o.notes},'Al completar se calcula automáticamente el próximo mantenimiento.')};
APP.actions.delOrder=function(id){const o=db.orders.find(x=>x.id===id);if(!o)return;if(!confirm('¿Eliminar esta intervención? Esta acción no se puede deshacer.'))return;const q=APP.eq(o.equipmentId);db.orders=db.orders.filter(x=>x.id!==id);if(q&&o.status==='realizado'){
 const past=db.orders.filter(x=>x.equipmentId===q.id&&x.status==='realizado').sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(past){q.last=past.completedDate||past.date;q.next=plusDays(q.last,q.frequency)}
 else if(o.priorLast&&o.priorNext){q.last=o.priorLast;q.next=o.priorNext}
 else notify('Revisá las fechas del equipo: se eliminó su único servicio registrado.');
 }save();notify('Orden eliminada')};
APP.actions.clientPdf=function(id){const c=APP.client(id);if(!c)return;const assets=db.equipment.filter(q=>q.clientId===id);printReport('Ficha de cliente · '+c.name,['Equipo','Categoría','Serie','Último servicio','Próximo servicio'],assets.map(q=>[q.name,q.category,q.serial,dateText(q.last),dateText(q.next)]),c.address||'Cliente')};
APP.actions.assetPdf=function(id){const q=APP.eq(id);if(!q)return;const c=APP.client(q.clientId);const records=assetLedger(q);printReport('Historial del equipo · '+q.name,['Fecha','Tipo','Técnico','Detalle','Costo'],records.map(o=>[dateText(o.date),o.status==='realizado'?'Realizado':'Programado',o.technician||'—',o.notes||'—',money(o.cost)]),'Cliente: '+(c?.name||'—')+' · Serie: '+(q.serial||'—')+' · Próximo servicio: '+dateText(q.next))};
</script>
<script>'use strict';
const h = (x) => String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(x)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(x)||0);
const num=x=>Number(x)||0;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const plusDays=(date,n)=>{const [y,m,d]=date.split('-').map(Number);const day=new Date(y,m-1,d);day.setDate(day.getDate()+Number(n));return `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`};
const daysBetween=(a,b)=>{const d=x=>{const [y,m,dd]=x.split('-').map(Number);return Date.UTC(y,m-1,dd)};return Math.round((d(b)-d(a))/86400000)};
const dateText=v=>v?`${v.slice(8,10)}/${v.slice(5,7)}/${v.slice(0,4)}`:'—';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const initial=name=>String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const dateInput=(v)=>v||today();
const pill=(label,color='info')=>`<span class="pill ${color}"><span class="dot"></span>${h(label)}</span>`;
const cellName=(name,detail)=>`<div class="cellName"><span class="initial">${h(initial(name))}</span><div><div class="strong">${h(name)}</div>${detail?`<div class="meta">${h(detail)}</div>`:''}</div></div>`;
const escAttr=h;
const btn=(txt,act,id,cls='sm')=>`<button class="btn ${cls}" type="button" data-action="${h(act)}" data-id="${h(id??'')}">${txt}</button>`;
const smallLink=(txt,act,id)=>`<button class="link" type="button" data-action="${h(act)}" data-id="${h(id??'')}">${txt}</button>`;
const card=(label,value,icon,note='')=>`<div class="stat"><div class="statLabel"><span>${h(label)}</span><span class="statIcon">${icon}</span></div><div class="statValue">${value}</div><div class="statNote">${h(note)}</div></div>`;
const stats=(arr)=>`<section class="stats">${arr.join('')}</section>`;
const empty=(text='Todavía no hay registros',caption='Agregá el primer registro para comenzar.')=>`<div class="empty"><div class="emptyIcon">🗂️</div><b>${h(text)}</b><div>${h(caption)}</div></div>`;
const panel=(title,content,extra='')=>`<section class="panel"><div class="panelHead"><h2>${h(title)}</h2><span>${extra}</span></div>${content}</section>`;
const table=(head,rows)=>rows.length?`<div class="tableScroll"><table><thead><tr>${head.map(t=>`<th>${h(t)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty();
const printReport=(title,headers,rows,subtitle='')=>{const p=window.open('','_blank');if(!p){alert('Habilitá las ventanas emergentes para imprimir.');return}p.document.write(`<!doctype html><html lang="es"><meta charset="utf-8"><title>${h(title)}</title><style>body{font:13px Arial,sans-serif;padding:35px;color:#132238}h1{font-size:25px}p{color:#78849a}table{width:100%;border-collapse:collapse;margin-top:30px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e7ed}th{background:#edf1f6}footer{font-size:10px;color:#98a2af;margin-top:32px}@media print{@page{size:A4 landscape;margin:15mm}}</style><h1>${h(title)}</h1><p>${h(subtitle)} · Generado el ${dateText(today())}</p><table><tr>${headers.map(x=>`<th>${h(x)}</th>`).join('')}</tr>${rows.map(row=>`<tr>${row.map(x=>`<td>${h(x)}</td>`).join('')}</tr>`).join('')}</table><footer>Zenix AR · Exportación desde el navegador</footer></html>`);p.document.close();p.focus();p.print()};
const csvExport=(filename,headers,rows)=>{const cell=(x)=>{let v=String(x??'');if(/^[=+@]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`};const csv='\ufeff'+[headers,...rows].map(row=>row.map(cell).join(';')).join('\r\n');download(filename+'.csv',csv,'text/csv;charset=utf-8;')};
function download(filename,contents,type='application/json'){const b=new Blob([contents],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
const STORAGE_KEY='zenix-'+APP.key+'-v1';
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object'&&parsed.version===1)return parsed}}catch(e){console.warn('storage',e)}return structuredClone(APP.seed())}
let db=load();let tab='inicio';let search='';let filter='todos';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(err){alert('No se pudieron guardar los datos. Revisá si el navegador permite almacenamiento local.')}render()}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function modal(title,fields,onSave,defaults={},tip=''){const html=fields.map(f=>{const value=defaults[f.name]??f.default??'';const a=`name="${h(f.name)}" id="field-${h(f.name)}" ${f.required===false?'':'required'} ${f.min!==undefined?`min="${h(f.min)}"`:''} ${f.step!==undefined?`step="${h(f.step)}"`:''} ${f.placeholder?`placeholder="${h(f.placeholder)}"`:''}`;let inp;if(f.type==='select'){inp=`<select ${a}>${f.options.map(o=>{const obj=typeof o==='string'?{value:o,label:o}:o;return `<option value="${h(obj.value)}" ${String(value)===String(obj.value)?'selected':''}>${h(obj.label)}</option>`}).join('')}</select>`}else if(f.type==='textarea')inp=`<textarea ${a}>${h(value)}</textarea>`;else inp=`<input type="${h(f.type||'text')}" ${a} value="${h(value)}"/>`;return `<div class="field ${f.wide?'wide':''}"><label for="field-${h(f.name)}">${h(f.label)}</label>${inp}</div>`}).join('');document.getElementById('modal-root').innerHTML=`<div class="floatMask" id="mask"><section class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="modalTop"><h2>${h(title)}</h2><button type="button" class="close" id="modalClose" aria-label="Cerrar">×</button></div><form id="entryForm"><div class="formGrid">${html}</div>${tip?`<p class="helper">${h(tip)}</p>`:''}<div class="modalFoot"><button type="button" class="btn" id="formCancel">Cancelar</button><button type="submit" class="btn primary">Guardar cambios →</button></div></form></section></div>`;const root=document.getElementById('modal-root');const close=()=>root.innerHTML='';root.querySelector('#modalClose').onclick=close;root.querySelector('#formCancel').onclick=close;root.querySelector('#mask').onclick=e=>{if(e.target.id==='mask')close()};root.querySelector('#entryForm').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.currentTarget).entries());try{const result=onSave(vals);if(result===false)return;close();save();notify('Los cambios se guardaron correctamente')}catch(err){alert(err?.message||String(err))}};setTimeout(()=>root.querySelector('input,select,textarea')?.focus(),20)}
const msgLink=(phone,text)=>{let p=String(phone??'').replace(/\D/g,'');if(p.startsWith('0'))p=p.slice(1);if(p.length===10)p='54'+p;if(!p){notify('Este cliente no tiene teléfono cargado.');return}window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank','noopener,noreferrer')};
function reportPage(){const data=APP.report();return `<div class="heading"><div><p class="eyebrow">Datos y respaldo</p><h1>Informes y exportaciones</h1><p class="sub">Exportá tus registros. En PDF se utiliza la opción de imprimir del navegador.</p></div></div><div class="twoPanels">${panel('Generar informes',`<div class="panelBody"><p class="tips">Descargá una planilla CSV compatible con Excel, o generá un informe listo para guardar en PDF.</p><div class="reportActions">${btn('⬇ Exportar Excel (CSV)','csv','', 'primary')}${btn('▣ Guardar PDF','print')}</div><div class="note" style="margin-top:18px">El PDF se crea desde la opción <b>Guardar como PDF</b> de la ventana de impresión.</div></div>`)}${panel('Copias de seguridad',`<div class="panelBody"><p class="tips">Todos los datos se guardan en este navegador. Creá una copia JSON periódicamente. Para cambiar de dispositivo, importá ese archivo.</p><div class="reportActions">${btn('⬇ Descargar JSON','backup')}${btn('⬆ Importar JSON','import')}</div><p class="tips" style="margin-top:20px">También podés borrar los datos de ejemplo y comenzar desde cero.</p>${btn('Borrar todos los datos','clear','', 'danger')}</div>`)}</div>${panel('Resumen del informe',`<div class="panelBody">${data.summary.map(x=>`<div class="reportRow"><span class="muted">${h(x[0])}</span><strong>${h(x[1])}</strong></div>`).join('')}</div>`)}`}

let scOrderFilter='pendiente',scSelectedOrder='';
function scIcon(key){const d={"inicio":"<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>","clientes":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21v-2a8 8 0 0 1 16 0v2\"/>","equipos":"<rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"/><path d=\"M9 7h6M9 12h6M9 17h4\"/>","agenda":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v4m10-4v4M3 10h18\"/>","ordenes":"<path d=\"M8 4h11v16H5V7zM8 4v3H5m5 4h6m-6 4h6\"/>","historial":"<path d=\"M3 12a9 9 0 1 0 4-7.5M3 4v5h5M12 7v5l4 3\"/>","informes":"<path d=\"M5 20V9m5 11V4m5 16v-7m5 7V8\"/>"};return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(d[key]||d.inicio)+'</svg>'}

function scOrderStatus(o){return o.status==='realizado'?'Completada':o.date<today()?'Atrasada':'Programada'}
function scOrderClass(o){return o.status==='realizado'?'':o.date<today()?'late':'soon'}
function scTaskItem(q){
 const cl=APP.client(q.clientId),late=q.next<today();
 return '<button class="scTask" data-action="addOrder" data-id="'+h(q.id)+'"><span class="scTaskIcon '+(late?'late':'')+'">⚙</span><div><div class="scTaskName">'+h(q.name)+'</div><div class="scTaskSub">'+h(cl?.name||'Cliente no encontrado')+' · '+h(q.category)+'</div></div><div class="scTaskMeta"><span class="scTag '+(late?'late':'soon')+'">'+(late?'Vencido':'Próximo')+'</span><span class="scOrderRef">'+h(dateText(q.next))+'</span></div></button>';
}
function scOperations(){
 const m=serviceMetrics();
 const due=APP.schedule().slice(0,6),recent=pendingOrders().slice(0,4);
 const metrics=[['Equipos registrados',m.assets,'En seguimiento',''],['Mantenimientos vencidos',m.overdue,'Requieren prioridad','critical'],['Órdenes abiertas',m.pending,'Pendientes de finalizar',''],['Servicios completados',m.done,'Historial registrado','']];
 return '<section class="operationsHeader"><div><small>CENTRO DE OPERACIONES</small><h1>Tu jornada, bajo control.</h1><p>Priorizá órdenes, coordiná visitas y mantené cada equipo al día.</p></div><div class="operationsActions">'+btn('+ Nueva orden','addOrder','','primary')+btn('Registrar equipo','newEq')+'</div></section>'
 +'<section class="scSummary">'+metrics.map((x,i)=>'<div class="scMetric '+x[3]+'"><div class="scMetricTop">'+x[0]+'<span>'+['▦','!','↗','✓'][i]+'</span></div><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</section>'
 +'<section class="scWorkGrid"><div class="scCard"><div class="scCardHead"><h2>Mantenimientos que requieren atención</h2><button class="scLink" data-action="goAgenda">Ver agenda →</button></div><div class="scList">'+(due.length?due.map(scTaskItem).join(''):'<div class="scEmpty">Todos los equipos están al día. No hay vencimientos en los próximos 30 días.</div>')+'</div></div>'
 +'<div class="scCard"><div class="scCardHead"><h2>Órdenes programadas</h2><button class="scLink" data-action="scGoOrders">Ver todas →</button></div><div class="scTimeline">'+(recent.length?recent.map(o=>{const q=APP.eq(o.equipmentId);return '<div class="scTimelineRow"><div class="scDateBadge"><b>'+h(o.date.slice(8))+'</b><span>'+h(new Date(o.date+'T12:00:00').toLocaleDateString('es-AR',{month:'short'}))+'</span></div><div><strong>'+h(q?.name||'Equipo sin asignar')+'</strong><p>'+h(APP.client(q?.clientId)?.name||'Cliente')+' · '+h(scOrderStatus(o))+'</p></div></div>'}).join(''):'<div class="scEmpty">No hay órdenes abiertas por ahora.</div>')+'</div><div style="padding:3px 19px 18px">'+btn('+ Programar visita','addOrder')+'</div></div></section>'
 +'<section class="scSection scCard"><div class="scCardHead"><h2>Gestioná tu operación</h2><small>Accesos directos</small></div><div class="scTinyAction" style="padding:0 19px 19px">'+btn('Ver órdenes','scGoOrders')+btn('Inventario de equipos','scGoAssets')+btn('Clientes','scGoClients')+btn('Ver historial','goHistory')+'</div></section>';
}
function scOrders(){
 const all=[...db.orders].sort((a,b)=>a.status===b.status?b.date.localeCompare(a.date):a.status==='pendiente'?-1:1);
 const visible=all.filter(o=>scOrderFilter==='todos'||(scOrderFilter==='pendiente'?o.status!=='realizado':o.status==='realizado'));
 let sel=visible.find(o=>o.id===scSelectedOrder)||visible[0];
 const q=sel?APP.eq(sel.equipmentId):null,c=q?APP.client(q.clientId):null;
 const tabs=[['pendiente','Pendientes'],['realizado','Completadas'],['todos','Todas']];
 return '<section class="scOrderHeader"><div><div class="workspaceKicker">GESTIÓN DE CAMPO</div><h1>Órdenes de trabajo</h1><p>Seleccioná una orden para consultar sus datos y gestionarla.</p></div>'+btn('+ Nueva orden','addOrder','','primary')+'</section>'
 +'<div class="scWorkLayout"><section class="scOrdersPanel"><div class="scCardHead"><h2>Listado de órdenes</h2><small>'+visible.length+' resultados</small></div><div class="scTabs">'+tabs.map(x=>'<button data-action="scFilterOrders" data-id="'+x[0]+'" class="'+(scOrderFilter===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</div>'
 +(visible.length?visible.map(o=>{const eq=APP.eq(o.equipmentId);return '<button class="scOrderRow '+(sel&&o.id===sel.id?'selected':'')+'" data-action="scSelectOrder" data-id="'+h(o.id)+'"><div><div class="scOrderName">'+h(eq?.name||'Equipo sin datos')+'</div><div class="scOrderSub">'+h(APP.client(eq?.clientId)?.name||'Cliente')+' · '+h(dateText(o.date))+'</div></div><div style="display:grid;justify-items:end;gap:9px"><span class="scTag '+scOrderClass(o)+'">'+h(scOrderStatus(o))+'</span><span class="scOrderRef">#'+h(o.id.slice(-6).toUpperCase())+'</span></div></button>'}).join(''):'<div class="scEmpty">No hay órdenes en este estado. Podés crear una nueva orden con el botón superior.</div>')
 +'</section><section class="scDetailPanel"><div class="scDetailHead">'+(sel?'<small>DETALLE DE ORDEN · #'+h(sel.id.slice(-6).toUpperCase())+'</small><h2>'+h(q?.name||'Equipo sin datos')+'</h2><div class="scDetailSub">'+h(c?.name||'Cliente')+' · '+h(dateText(sel.date))+'</div>':'<small>DETALLE DE ORDEN</small><h2>Seleccioná una orden</h2><div class="scDetailSub">Acá verás su información y acciones.</div>')+'</div>'
 +(sel?'<div class="scDetailBody"><span class="scTag '+scOrderClass(sel)+'">'+h(scOrderStatus(sel))+'</span>'
 +[['Cliente',c?.name||'—'],['Equipo',q?.name||'—'],['Categoría',q?.category||'—'],['Fecha prevista',dateText(sel.date)],['Técnico',sel.technician||'Sin asignar'],['Importe del servicio',money(sel.cost||0)]].map(x=>'<div class="scFieldRow"><span>'+h(x[0])+'</span><strong>'+h(x[1])+'</strong></div>').join('')
 +'<div class="scDetailNotes"><b>Observaciones</b><div style="margin-top:7px">'+h(sel.notes||'Sin observaciones registradas.')+'</div></div></div>'
 +'<div class="scDetailActions">'+(sel.status==='realizado'?btn('Informe PDF','orderPdf',sel.id,'primary'):btn('Marcar como realizada','completeOrder',sel.id,'primary'))+(q?btn('Ver equipo','viewEq',q.id):'')+btn('Eliminar','delOrder',sel.id,'danger')+'</div>':'<div class="scEmpty">Creá una orden de trabajo y empezá a organizar las visitas.</div>')+'</section></div>';
}
APP.actions.scGoOrders=()=>{tab='ordenes';search='';render()};
APP.actions.scGoAssets=()=>{tab='equipos';search='';render()};
APP.actions.scGoClients=()=>{tab='clientes';search='';render()};
APP.actions.scFilterOrders=(id)=>{scOrderFilter=id;scSelectedOrder='';render()};
APP.actions.scSelectOrder=(id)=>{scSelectedOrder=id;render()};
const scPreviousRender=APP.render;
APP.render=(page)=>page==='inicio'?scOperations():page==='ordenes'?scOrders():scPreviousRender(page);

function render(){
 const current=APP.tabs.find(x=>x[0]===tab)||APP.tabs[0],m=serviceMetrics();
 document.documentElement.style.setProperty('--accent','#087b6d');document.title='ServiControl · Gestión técnica';
 const nav=APP.tabs.map(x=>'<button type="button" data-nav="'+x[0]+'" class="'+(tab===x[0]?'active':'')+'"><b>'+scIcon(x[0])+'</b><span>'+h(x[1])+'</span></button>').join('');
 const bottom=[['inicio','Inicio'],['ordenes','Órdenes'],['equipos','Equipos'],['agenda','Agenda']].map(x=>'<button type="button" data-nav="'+x[0]+'" class="'+(tab===x[0]?'active':'')+'">'+scIcon(x[0])+'<span>'+h(x[1])+'</span></button>').join('')+'<button type="button" data-action="scMore" class="'+(['clientes','historial','informes'].includes(tab)?'active':'')+'">'+scIcon('informes')+'<span>Más</span></button>';
 document.getElementById('root').innerHTML='<div class="shell"><aside class="sidebar"><div><div class="brand"><div class="brandIcon">✳</div><div><span>ServiControl</span><small>GESTIÓN TÉCNICA</small></div></div><p class="navLabel">ESPACIO DE TRABAJO</p><nav class="nav" aria-label="Navegación">'+nav+'</nav><div class="navSectionDivider"></div><div class="sideCard"><div class="sideCardLabel">ESTADO OPERATIVO</div><div class="sideCardValue">'+m.assets+' equipos</div><p class="sideCardSub">Inventario en seguimiento</p><div class="sideMiniGrid"><div class="sideMini"><strong>'+m.overdue+'</strong><span>Vencidos</span></div><div class="sideMini"><strong>'+m.pending+'</strong><span>Órdenes abiertas</span></div></div></div></div><div class="sideFoot"><strong>Entorno de demostración</strong><br>Los datos se guardan en este navegador.<br>No hay usuarios ni sincronización online.</div></aside><div class="main"><header class="topbar"><div class="topbarMain"><div class="crumb">ESPACIO DE TRABAJO / '+h(current[1].toUpperCase())+'</div><div class="topbarTitle">'+h(current[1])+'</div></div><div class="topRight"><span class="signal '+(m.overdue?'bad':'good')+'"><span class="sigDot"></span>'+(m.overdue?m.overdue+' vencidos':'Todo en orden')+'</span><span class="mark">DEMO LOCAL</span><div class="avatar">SC</div></div></header><main class="content">'+(tab==='informes'?reportPage():APP.render(tab))+'<div class="footer">ServiControl · Zenix AR · Datos guardados localmente</div></main></div><nav class="scMobileNav" aria-label="Navegación móvil">'+bottom+'</nav></div>';
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;search='';filter='todos';render();return}const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='backup')return download(APP.key+'-respaldo-'+today()+'.json',JSON.stringify(db,null,2));if(act==='import'){document.getElementById('importFile').click();return}if(act==='clear'){if(confirm('¿Borrar TODOS los registros guardados en este navegador? Esta acción no se puede deshacer. Hacé una copia JSON primero.')){db=APP.empty();save();notify('Se borraron todos los datos')}return}if(act==='csv'){const v=APP.report();csvExport(APP.key+'-'+today(),v.headers,v.rows);return}if(act==='print'){const v=APP.report();printReport(APP.title+' · Informe',v.headers,v.rows,v.subtitle);return}if(APP.actions[act])return APP.actions[act](id,b);});
document.addEventListener('input',e=>{if(e.target.dataset.search==='true'){search=e.target.value;const target=document.querySelector('#dynamicList');if(target&&APP.list)target.innerHTML=APP.list();}});
document.addEventListener('change',e=>{if(e.target.dataset.filter==='true'){filter=e.target.value;const target=document.querySelector('#dynamicList');if(target&&APP.list)target.innerHTML=APP.list();}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x?.version!==1||x?.app!==APP.key)throw new Error('El archivo no corresponde a esta aplicación.');const requiredArrays=Object.keys(APP.empty()).filter(k=>Array.isArray(APP.empty()[k]));if(requiredArrays.some(k=>!Array.isArray(x[k])))throw new Error('El respaldo tiene un formato incompleto.');if(!confirm('¿Reemplazar todos los datos actuales por este respaldo?'))return;db=x;save();notify('Copia restaurada')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}});
render();
</script>


<script id="sc-pro-desktop-script-3">
(function(){
 let deskTab='prioridad';
 const svg=(name)=>{
   const icons={
     equipment:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 7h6M9 12h6M9 17h6"/>',
     clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',
     clipboard:'<path d="M8 4H5v17h14V4h-3"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6"/>',
     check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
     people:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
     calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>'
   };
   return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[name]||icons.clipboard)+'</svg>';
 };
 function stat(title,val,caption,icon,klass){
   return '<div class="scProStat '+(klass||'')+'"><div><div class="scProStatLabel">'+h(title)+'</div><div class="scProStatVal">'+h(val)+'</div><div class="scProStatNote">'+h(caption)+'</div></div><span class="scProStatIcon">'+svg(icon)+'</span></div>';
 }
 function formatDate(v){return v?dateText(v):'Sin fecha'}
 function orderItem(o){
   const eq=APP.eq(o.equipmentId),c=eq?APP.client(eq.clientId):null;
   const complete=o.status==='realizado',late=!complete&&o.date<today();
   const chip=complete?'Finalizada':late?'Vencida':'Programada';
   return '<button class="scProTask" data-action="scDeskOpenOrder" data-id="'+h(o.id)+'"><span class="scProTaskVisual '+(late?'late':'')+'">'+svg('clipboard')+'</span><span class="scProTaskMain"><strong>'+h(eq?.name||'Equipo por definir')+'</strong><small>'+h(c?.name||'Cliente')+' · '+h(o.technician||'Sin técnico asignado')+'</small></span><span class="scProTaskEnd"><span class="scProChip '+(complete?'complete':late?'late':'')+'">'+chip+'</span><small>'+h(formatDate(o.date))+'</small></span></button>';
 }
 function equipmentItem(q){
   const c=APP.client(q.clientId),late=q.next<today();
   return '<button class="scProTask" data-action="scDeskOpenEquip" data-id="'+h(q.id)+'"><span class="scProTaskVisual '+(late?'late':'')+'">'+svg('equipment')+'</span><span class="scProTaskMain"><strong>'+h(q.name)+'</strong><small>'+h(c?.name||'Cliente')+' · '+h(q.category||'Equipo técnico')+'</small></span><span class="scProTaskEnd"><span class="scProChip '+(late?'late':'')+'">'+(late?'Vencido':'Próximo')+'</span><small>'+h(formatDate(q.next))+'</small></span></button>';
 }
 function panelRows(){
   const tasks=deskTab==='ordenes'?pendingOrders().slice(0,5):deskTab==='equipos'?[...APP.schedule()].sort((a,b)=>a.next.localeCompare(b.next)).slice(0,5):[...APP.schedule()].filter(q=>q.next<today()).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,5);
   if(deskTab==='ordenes')return tasks.length?tasks.map(orderItem).join(''):'<div class="scProEmpty">No hay órdenes abiertas. Podés crear una nueva desde arriba.</div>';
   if(deskTab==='equipos')return tasks.length?tasks.map(equipmentItem).join(''):'<div class="scProEmpty">No hay revisiones pendientes en el período.</div>';
   return tasks.length?tasks.map(equipmentItem).join(''):'<div class="scProEmpty">No hay mantenimientos vencidos. ¡Todo está al día!</div>';
 }
 function calendarRows(){
   const source=[...pendingOrders()].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
   return source.map(o=>{
      const eq=APP.eq(o.equipmentId),c=eq?APP.client(eq.clientId):null,date=new Date(o.date+'T12:00:00'),day=Number.isFinite(date.valueOf())?String(date.getDate()).padStart(2,'0'):'–',month=Number.isFinite(date.valueOf())?date.toLocaleDateString('es-AR',{month:'short'}):'';
      return '<div class="scProScheduleRow"><span class="scProDate"><strong>'+h(day)+'</strong><small>'+h(month)+'</small></span><div><div class="scProScheduleName">'+h(eq?.name||'Equipo')+'</div><div class="scProScheduleSub">'+h(c?.name||'Cliente')+' · '+h(o.technician||'Sin técnico')+'</div></div><span class="scProChip '+(o.date<today()?'late':'')+'">'+(o.date<today()?'Atrasada':'Visita')+'</span></div>';
   }).join('');
 }
 function home(){
   const m=serviceMetrics(),late=m.overdue,now=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
   const total=m.pending+m.done;
   const visits=calendarRows();
   return '<div class="scProHead"><div><p class="scProKicker">CENTRO DE OPERACIONES · '+h(now.toUpperCase())+'</p><h1 class="scProTitle">Un panorama claro de cada servicio.</h1><p class="scProIntro">Órdenes, equipos y vencimientos en un solo espacio de trabajo.</p></div><div class="scProHeadActions"><button class="scProBtn" data-action="scGoAssets">'+svg('equipment')+' Equipos</button><button class="scProBtn primary" data-action="addOrder"><i>+</i>Nueva orden de trabajo</button></div></div>'
     +'<section class="scProHero"><div class="scProHeroCopy"><div class="scProHeroEyebrow">SEGUIMIENTO OPERATIVO</div><h2>'+(late?'Tenés '+late+' '+(late===1?'equipo que requiere':'equipos que requieren')+' atención.':'Todos los mantenimientos están al día.')+'</h2><p>'+(late?'Revisá los servicios vencidos, asigná una visita y mantené actualizado el historial de cada equipo.':'Podés revisar las visitas programadas y continuar con las órdenes de trabajo.')+'</p></div><div class="scProHeroActions"><button class="scProHeroBtn" data-action="goAgenda">Revisar agenda →</button><button class="scProHeroOutline" data-action="scGoOrders">Ver órdenes</button></div></section>'
     +'<section class="scProStats">'+stat('Equipos en seguimiento',m.assets,'Inventario de activos','equipment','blue')+stat('Mantenimientos vencidos',m.overdue,'Requieren seguimiento','clock','warn')+stat('Órdenes pendientes',m.pending,'Trabajos abiertos','clipboard','purple')+stat('Servicios realizados',m.done,'Órdenes finalizadas','check','')+'</section>'
     +'<section class="scProBoard"><div class="scProPane"><div class="scProPaneHeader"><div><h2>Panel de tareas</h2><p>Priorizá el trabajo sin perder información.</p></div><button class="scProTextLink" data-action="scGoOrders">Todas las órdenes →</button></div><div class="scProFilter">'+[['prioridad','Prioridad'],['ordenes','Órdenes abiertas'],['equipos','Revisiones']].map(x=>'<button class="'+(deskTab===x[0]?'active':'')+'" data-action="scDeskFilter" data-id="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div>'+panelRows()+'</div></div>'
     +'<div class="scProPane"><div class="scProPaneHeader"><div><h2>Próximas visitas</h2><p>Agenda y trabajos programados.</p></div><button class="scProTextLink" data-action="goAgenda">Abrir agenda →</button></div><div class="scProSchedule">'+(visits||'<div class="scProEmpty">No hay visitas abiertas por el momento.</div>')+'</div><div class="scProScheduleFoot"><span>'+m.pending+' '+(m.pending===1?'orden abierta':'órdenes abiertas')+'</span><button class="scProTextLink" data-action="addOrder">+ Programar</button></div></div></section>'
     +'<section class="scProPane scProActivity"><div class="scProPaneHeader"><div><h2>Accesos de gestión</h2><p>Funciones principales del taller o servicio técnico.</p></div></div><div class="scProActivityGrid"><button class="scProAction" data-action="scGoClients"><span class="scProActionBadge">'+svg('people')+'</span><span><strong>Cartera de clientes</strong><small>Fichas, domicilios y contactos</small></span></button><button class="scProAction" data-action="scGoAssets"><span class="scProActionBadge">'+svg('equipment')+'</span><span><strong>Inventario técnico</strong><small>Equipos y próximas revisiones</small></span></button><button class="scProAction" data-action="goHistory"><span class="scProActionBadge">'+svg('calendar')+'</span><span><strong>Historial de trabajos</strong><small>Servicios e informes realizados</small></span></button></div></section>';
 }
 const original=APP.render;
 APP.render=function(t){return t==='inicio'&&window.innerWidth>950?home():original(t)};
 APP.actions.scDeskFilter=(id)=>{deskTab=id;render()};
 APP.actions.scDeskOpenOrder=(id)=>{tab='ordenes';scOrderFilter='todos';scSelectedOrder=id;render()};
 APP.actions.scDeskOpenEquip=(id)=>{tab='equipos';search='';render();if(APP.actions.viewEq)APP.actions.viewEq(id)};
})();
</script>
<script id="sc-mobile-controller-v2">
(function(){
 function mobile(){return window.matchMedia('(max-width:950px)').matches}
 function fmt(date){return dateText(date)}
 function labelFor(q){return APP.client(q.clientId)?.name||'Cliente sin especificar'}
 function dateLabel(){return new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})}
 function mobileBrand(){return '<div class="mobileBrandRow"><div class="mobileLogo"><span class="mobileLogoIcon">✳</span><div class="mobileLogoWords"><strong>ServiControl</strong><small>FIELD SERVICE</small></div></div><span class="mobileDemoPill">DEMO LOCAL</span></div>'}
 function home(){
  const m=serviceMetrics(),due=APP.schedule().slice(0,5),open=pendingOrders().slice(0,3);
  const msg=m.overdue?('Hay '+m.overdue+' mantenimientos vencidos que requieren atención.'):'Tus vencimientos están al día. Revisá las visitas programadas.';
  return '<div class="mobileHome">'+mobileBrand()+
   '<section class="mobileHero"><div class="mobileHeroKicker">MI OPERACIÓN · '+h(dateLabel())+'</div><h1>Tu trabajo, organizado.</h1><p>'+h(msg)+'</p><div class="mobileHeroMetrics"><div class="mobileHeroMetric"><strong>'+m.pending+'</strong><span>órdenes abiertas</span></div><div class="mobileHeroMetric"><strong>'+m.assets+'</strong><span>equipos registrados</span></div></div></section>'+
   '<div class="mobileActionPair"><button class="primary" data-action="addOrder"><b>＋</b>Nueva orden</button><button data-action="newEq"><b>⚙</b> Nuevo equipo</button></div>'+
   '<div class="mobileSectionTitle"><h2>Próximos mantenimientos</h2><button data-action="goAgenda">Ver agenda ›</button></div>'+
   '<div class="mobileWorkCard">'+(due.length?due.map(q=>{const late=q.next<today();return '<button class="mobileRow" data-action="goAgenda"><span class="mobileRowIcon '+(late?'late':'')+'">⚙</span><span class="mobileRowMain"><strong>'+h(q.name)+'</strong><small>'+h(labelFor(q))+'</small></span><span class="mobileRowSide"><b class="'+(late?'':'ok')+'">'+(late?'Vencido':'Programado')+'</b><small>'+h(fmt(q.next))+'</small></span></button>'}).join(''):'<div class="mobileEmpty"><span>✓</span>No hay mantenimientos pendientes por ahora.</div>')+'</div>'+
   '<div class="mobileSectionTitle"><h2>Órdenes abiertas</h2><button data-action="scGoOrders">Ver todas ›</button></div>'+
   '<div class="mobileWorkCard">'+(open.length?open.map(o=>{const q=APP.eq(o.equipmentId);return '<button class="mobileRow" data-action="scGoOrders"><span class="mobileRowIcon">▤</span><span class="mobileRowMain"><strong>'+h(q?.name||'Equipo')+'</strong><small>'+h(q?labelFor(q):'Cliente')+' · '+h(o.technician||'Sin asignar')+'</small></span><span class="mobileRowSide"><b class="ok">Abierta</b><small>'+h(fmt(o.date))+'</small></span></button>'}).join(''):'<div class="mobileEmpty"><span>✓</span>Sin órdenes abiertas.</div>')+'</div></div>';
 }
 function orderSheet(o){const q=APP.eq(o.equipmentId),c=q?APP.client(q.clientId):null;
 const data=[['Estado',o.status==='realizado'?'Completada':o.date<today()?'Atrasada':'Programada'],['Cliente',c?.name||'—'],['Equipo',q?.name||'—'],['Tipo de equipo',q?.category||'—'],['Fecha prevista',fmt(o.date)],['Técnico',o.technician||'Sin asignar'],['Importe',money(o.cost||0)]];
 return '<button class="mobileOrderSheetBackdrop" data-action="scMobileClose" aria-label="Cerrar detalle"></button><section class="mobileOrderSheet" role="dialog" aria-modal="true" aria-label="Detalle de orden"><div class="mobileSheetHandle"></div><div class="mobileSheetTop"><div><small>ORDEN DE TRABAJO #'+h(o.id.slice(-6).toUpperCase())+'</small><h2>'+h(q?.name||'Equipo sin datos')+'</h2></div><button class="mobileClose" data-action="scMobileClose">×</button></div><p class="mobileSheetSub">'+h(c?.name||'Cliente')+'</p><div class="mobileDetailGrid">'+data.map(x=>'<div class="mobileDetailItem"><span>'+h(x[0])+'</span><strong>'+h(x[1])+'</strong></div>').join('')+'</div><div class="mobileSheetNote">'+h(o.notes||'Sin observaciones registradas.')+'</div><div class="mobileSheetActions">'+(o.status==='realizado'?'<button data-action="orderPdf" data-id="'+h(o.id)+'">Descargar informe PDF</button>':'<button data-action="completeOrder" data-id="'+h(o.id)+'">Marcar como realizada</button>')+(q?'<button class="secondary" data-action="viewEq" data-id="'+h(q.id)+'">Ver ficha del equipo</button>':'')+'<button class="secondary" data-action="scMobileClose">Volver a las órdenes</button></div></section>';
 }
 function orders(){const all=[...db.orders].sort((a,b)=>b.date.localeCompare(a.date));const visible=all.filter(o=>scOrderFilter==='todos'||(scOrderFilter==='pendiente'?o.status!=='realizado':o.status==='realizado'));const selected=visible.find(x=>x.id===scSelectedOrder);
 return '<div class="mobileOrders">'+mobileBrand()+'<div class="mobileOrderHeader"><div><div class="workspaceKicker">TRABAJO DE CAMPO</div><h1>Órdenes</h1><p>'+visible.length+' resultados · Tocá una para ver el detalle</p></div><button class="mobileRoundPlus" aria-label="Nueva orden" data-action="addOrder">+</button></div><div class="mobileFilterChips">'+[['pendiente','Abiertas'],['realizado','Completadas'],['todos','Todas']].map(x=>'<button data-action="scFilterOrders" data-id="'+x[0]+'" class="'+(scOrderFilter===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</div><div class="mobileWorkCard mobileOrderList">'+(visible.length?visible.map(o=>{const q=APP.eq(o.equipmentId);const late=o.status!=='realizado'&&o.date<today();return '<button class="mobileRow" data-action="scSelectOrder" data-id="'+h(o.id)+'"><span class="mobileRowIcon '+(late?'late':'')+'">▤</span><span class="mobileRowMain"><strong>'+h(q?.name||'Equipo sin datos')+'</strong><small>'+h(q?labelFor(q):'Cliente')+' · '+h(fmt(o.date))+'</small></span><span class="mobileRowSide"><b class="'+(late?'':'ok')+'">'+(o.status==='realizado'?'Completada':late?'Atrasada':'Abierta')+'</b><small>Ver detalle ›</small></span></button>'}).join(''):'<div class="mobileEmpty"><span>▤</span>No hay órdenes en este estado.</div>')+'</div>'+(selected?orderSheet(selected):'')+'</div>';
 }
 const oldRender=APP.render;
 APP.render=(page)=>mobile()&&page==='inicio'?home():mobile()&&page==='ordenes'?orders():oldRender(page);
 APP.actions.scMobileClose=()=>{scSelectedOrder='';render()};
 APP.actions.scMore=()=>{const root=document.getElementById('modal-root');root.innerHTML='<button class="mobileOrderSheetBackdrop" data-action="scMoreClose" aria-label="Cerrar menú"></button><section class="mobileMoreSheet" role="dialog" aria-modal="true" aria-label="Más secciones"><h2>Más secciones</h2>'+[['clientes','Clientes'],['historial','Historial técnico'],['informes','Informes y respaldos']].map(x=>'<button data-action="scMoreNav" data-id="'+x[0]+'">'+scIcon(x[0])+'<span>'+x[1]+'</span> ›</button>').join('')+'<button data-action="scMoreClose">Cerrar</button></section>'};
 APP.actions.scMoreClose=()=>{document.getElementById('modal-root').innerHTML=''};
 APP.actions.scMoreNav=id=>{APP.actions.scMoreClose();tab=id;search='';filter='todos';render()};
 window.addEventListener('resize',()=>{if(!window.__scResize){window.__scResize=true;requestAnimationFrame(()=>{window.__scResize=false;render()})}});
 render();
})();
</script>
