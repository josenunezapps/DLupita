<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087b6d">
<meta name="description" content="ServiControl Empresarial, gestión de mantenimientos y servicios técnicos.">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ServiControl · Zenix AR</title>
<style>:root{
  --accent:#138c77;
  --accent-strong:#096a59;
  --accent-soft:#e6f7f1;
  --muted:#6b7890;
  --ink:#172d35;
  --ink-soft:#35535d;
  --bg:#f3f6fb;
  --bg-strong:#eaf0f8;
  --line:#dde5f0;
  --line-strong:#ccd7e7;
  --white:#ffffff;
  --aside:#0f232b;
  --aside-2:#142f37;
  --good:#128465;
  --good-soft:#e5f6ef;
  --danger:#c04a5e;
  --danger-soft:#ffedf1;
  --warn:#b57618;
  --warn-soft:#fff3db;
  --info:#2d8e89;
  --info-soft:#e6f7f1;
  --shadow-sm:0 2px 8px rgba(18,32,61,.06);
  --shadow-md:0 16px 38px rgba(16,28,56,.08);
  --shadow-lg:0 26px 60px rgba(13,28,58,.16);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  font-size:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at top left, rgba(79,107,255,.08), transparent 26%),
    linear-gradient(180deg, #f7f9fd 0%, var(--bg) 36%, #eef3f9 100%);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(79,107,255,.28);
  outline-offset:2px;
}
.shell{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{
  background:linear-gradient(180deg,var(--aside) 0%, var(--aside-2) 100%);
  color:#fff;
  min-height:100vh;
  padding:28px 18px 20px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid rgba(255,255,255,.06);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.02);
}
.brand{display:flex;align-items:center;gap:14px;padding:0 10px 24px}
.brandIcon{
  width:46px;height:46px;border-radius:15px;
  background:linear-gradient(135deg,#5a7bff 0%,#3750d6 100%);
  display:grid;place-items:center;font-size:23px;
  box-shadow:0 16px 26px rgba(61,97,255,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.brand span{font-size:20px;font-weight:800;letter-spacing:-.04em;font-family:Inter,system-ui,sans-serif}
.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#90a1be;margin-top:3px;font-weight:700}
.navLabel{padding:0 14px;margin:8px 0 12px;font-size:10px;text-transform:uppercase;color:#7e91b0;letter-spacing:.18em;font-weight:800}
.nav{display:grid;gap:6px}
.nav button{
  background:transparent;border:1px solid transparent;text-align:left;display:flex;gap:12px;align-items:center;width:100%;
  border-radius:14px;color:#a8b6cd;font-weight:650;padding:12px 14px;
  transition:.18s ease;
}
.nav button b{
  width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
  text-align:center;font-size:15px;font-weight:700;background:rgba(255,255,255,.04);color:#d4def0;flex-shrink:0
}
.nav button:hover{
  background:rgba(255,255,255,.05);color:#fff;border-color:rgba(255,255,255,.05);transform:translateX(1px)
}
.nav button.active{
  background:linear-gradient(180deg,rgba(74,101,255,.23),rgba(74,101,255,.16));
  color:#fff;border-color:rgba(130,151,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px rgba(10,19,39,.22)
}
.nav button.active b{background:rgba(255,255,255,.1);color:#fff}
.sideCard{
  margin:18px 8px 0;padding:16px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:var(--shadow-md);
}
.sideCardLabel{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#98a8c3;font-weight:800}
.sideCardValue{font-size:28px;font-weight:850;letter-spacing:-.05em;margin:10px 0 6px}
.sideCardSub{font-size:12px;color:#c2cee0;line-height:1.55;margin:0 0 14px}
.sideMiniGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sideMini{
  border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px;
  background:rgba(4,10,20,.15)
}
.sideMini strong{display:block;font-size:16px;letter-spacing:-.03em}
.sideMini span{display:block;margin-top:3px;font-size:11px;color:#8fa2c0;line-height:1.35}
.sideFoot{margin-top:auto;padding:18px 14px;border-top:1px solid rgba(255,255,255,.08);color:#8ea1bf;font-size:12px;line-height:1.7}
.sideFoot strong{color:#fff;font-weight:750}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:10;
  min-height:84px;background:rgba(248,250,253,.84);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(205,216,231,.72);padding:18px 34px;display:flex;align-items:center;justify-content:space-between;gap:18px
}
.topbarMain{min-width:0}
.crumb{font-size:11px;color:#7d8aa2;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.topbarTitle{font-size:20px;font-weight:800;letter-spacing:-.04em;margin:5px 0 0;color:var(--ink)}
.topbarSub{font-size:13px;color:var(--muted);margin-top:3px}
.topRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mark,.signal,.signal.bad,.signal.good,.signal.warn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;color:#617086;box-shadow:var(--shadow-sm)
}
.signal .sigDot,.mark .sigDot{height:8px;width:8px;border-radius:999px;background:currentColor;display:inline-block}
.signal.good{background:var(--good-soft);color:var(--good);border-color:#ccebdd}
.signal.bad{background:var(--danger-soft);color:var(--danger);border-color:#f2ccd4}
.signal.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0ddb9}
.avatar{height:40px;width:40px;background:linear-gradient(180deg,#fff,#eef3fd);display:grid;place-items:center;border-radius:14px;font-weight:850;color:var(--accent);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.content{max-width:1520px;margin:0 auto;padding:28px 34px 58px;width:100%}
.workspaceBar{display:grid;grid-template-columns:1.55fr repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.workspaceLead,.workspaceMetric{
  background:rgba(255,255,255,.82);border:1px solid rgba(214,224,238,.95);border-radius:20px;box-shadow:var(--shadow-sm)
}
.workspaceLead{padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,249,255,.92))}
.workspaceLead b{display:block;font-size:15px;letter-spacing:-.02em}
.workspaceLead p{margin:8px 0 0;color:var(--muted);line-height:1.55;font-size:13px}
.workspaceMetric{padding:16px 18px}
.workspaceMetricLabel{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8190a9;font-weight:800}
.workspaceMetricValue{margin-top:8px;font-size:24px;font-weight:850;letter-spacing:-.05em}
.workspaceMetricNote{margin-top:5px;color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:850;color:var(--accent);margin:0 0 8px}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 24px}
.heading h1{margin:0;font-size:32px;letter-spacing:-.06em;line-height:1.1;font-family:Inter,system-ui,sans-serif}
.sub{color:var(--muted);line-height:1.65;margin:10px 0 0;max-width:730px;font-size:14px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:#fff;border-radius:12px;
  padding:11px 16px;font-weight:780;white-space:nowrap;color:var(--ink);min-height:42px;box-shadow:var(--shadow-sm);transition:.18s ease
}
.btn:hover{border-color:#bcc8da;background:#fcfdff;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:white;border-color:transparent;box-shadow:0 14px 28px rgba(63,89,218,.24)}
.btn.primary:hover{filter:brightness(.98)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;border-radius:10px;min-height:34px;font-size:12px}
.btn.full{width:100%}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;margin:0 0 20px;
  background:linear-gradient(135deg,#16213a 0%,#203357 100%);color:#fff;border-radius:20px;box-shadow:var(--shadow-md)
}
.banner strong{font-size:18px;letter-spacing:-.03em}
.banner p{margin:7px 0 0;color:#d3dcf2;line-height:1.55;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0 24px}
.stat,.panel,.callout{background:rgba(255,255,255,.9);border:1px solid rgba(216,225,238,.95);border-radius:20px;box-shadow:var(--shadow-sm)}
.stat{padding:22px 22px 20px;min-width:0;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:auto -14px -18px auto;width:82px;height:82px;border-radius:20px;background:radial-gradient(circle,rgba(79,107,255,.15),transparent 66%)}
.statLabel{color:#617089;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:760;position:relative;z-index:1}
.statIcon{font-size:18px;width:40px;height:40px;background:var(--accent-soft);color:var(--accent);border-radius:13px;display:grid;place-items:center;border:1px solid #d8f0e7}
.statValue{font-size:29px;font-weight:860;letter-spacing:-.06em;margin:16px 0 4px;overflow-wrap:anywhere;position:relative;z-index:1}
.statNote{color:#8190a4;font-size:12px;margin-top:6px;position:relative;z-index:1}
.dashboardGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px}
.panel{overflow:hidden;margin-bottom:18px}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#fafcff)}
.panelHead h2{font-size:16px;margin:0;letter-spacing:-.03em}
.panelHead span{color:var(--muted);font-size:12px}
.panelBody{padding:20px 22px}
.toolbar{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(249,251,255,.8)}
.toolbar .left{display:flex;gap:10px;flex:1;min-width:230px;flex-wrap:wrap}
.search{
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#f8fbff;width:100%;min-width:130px;outline:0;
  color:var(--ink);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)
}
.search:focus{border-color:#c6d2ee;background:white;box-shadow:0 0 0 4px rgba(79,107,255,.08)}
.select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);min-width:130px;max-width:215px;box-shadow:var(--shadow-sm)}
.tableScroll{width:100%;overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;text-align:left}
th{
  color:#8190a8;text-transform:uppercase;font-size:10px;font-weight:850;letter-spacing:.14em;background:#f7fafe;padding:14px 18px;white-space:nowrap;border-bottom:1px solid var(--line)
}
td{padding:16px 18px;border-bottom:1px solid #ebf0f7;font-size:13px;vertical-align:middle;white-space:nowrap;background:transparent}
tr:last-child td{border-bottom:0}
tbody tr{transition:.14s ease}
tbody tr:hover{box-shadow:inset 0 0 0 999px rgba(79,107,255,.028)}
.muted{color:var(--muted)}.strong{font-weight:800;color:var(--ink)}
.meta{font-size:11px;color:#95a0ae;margin-top:4px}
.cellName{display:flex;align-items:center;gap:12px}
.initial{
  width:38px;height:38px;display:grid;place-items:center;background:linear-gradient(180deg,#f4f7ff,#e8eeff);color:#4f62c7;border-radius:12px;font-size:12px;font-weight:850;flex-shrink:0;border:1px solid #dbe3fb
}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 11px;background:#f2f5f9;color:#637185;font-size:11px;font-weight:850;border:1px solid transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:#ccebdd}.pill.bad{background:var(--danger-soft);color:var(--danger);border-color:#f2ccd4}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0ddb9}.pill.info{background:var(--info-soft);color:var(--info);border-color:#d9f1e9}
.dot{height:7px;width:7px;display:inline-block;border-radius:100%;background:currentColor}.link{border:0;background:transparent;padding:4px;color:var(--accent);font-weight:800;font-size:12px}.link:hover{text-decoration:underline}
.empty{padding:50px 25px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin:12px 0 6px}.emptyIcon{font-size:32px}
.stack{display:grid;gap:10px}
.mini{border:1px solid var(--line);padding:15px;border-radius:14px;display:flex;align-items:center;gap:10px;justify-content:space-between;background:linear-gradient(180deg,#fff,#fbfcff)}
.miniTitle{font-weight:800;font-size:13px}.miniSub{font-size:11px;margin-top:5px;color:var(--muted)}.miniRight{text-align:right;font-weight:850;font-size:13px}
.note{padding:13px 14px;background:#f7f9fc;border-radius:13px;border:1px dashed var(--line-strong);font-size:12px;color:#5d6b81;line-height:1.65}
.quick{
  display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcff);padding:16px;border-radius:16px;text-align:left;
  transition:.18s ease;box-shadow:var(--shadow-sm)
}
.quick:hover{border-color:#c6d0e0;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.quickIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:18px;flex-shrink:0;border:1px solid #dcefe8}
.quick strong{display:block;font-size:13px;letter-spacing:-.01em}.quick small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}
.listCards{display:grid;gap:12px;padding:16px 20px 20px}
.clientCard,.movementCard{
  border:1px solid var(--line);border-radius:18px;padding:17px 18px;background:linear-gradient(180deg,#ffffff,#fbfcff);display:grid;gap:14px;box-shadow:var(--shadow-sm)
}
.cardTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.cardTop .left{min-width:0}.cardTitle{font-size:15px;font-weight:850;letter-spacing:-.03em}.cardSub{font-size:12px;color:var(--muted);margin-top:5px}.cardActions{display:flex;gap:8px;flex-wrap:wrap}.moneyStrong{font-size:20px;font-weight:850;letter-spacing:-.04em}.dataGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.dataBox{border:1px solid #e6ecf5;background:#f8fbff;border-radius:14px;padding:12px}.dataBox span{display:block;color:#7f8da4;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.dataBox b{display:block;margin-top:8px;font-size:15px;letter-spacing:-.03em}
.twoPanels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.reportActions{display:flex;gap:10px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(11,20,35,.56);display:grid;place-items:center;padding:18px;z-index:30;backdrop-filter:blur(6px)}
.modal{width:100%;max-width:620px;max-height:calc(100vh - 36px);overflow:auto;border-radius:22px;background:white;box-shadow:var(--shadow-lg);border:1px solid rgba(219,228,240,.95)}
.modalTop{padding:22px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,#fff,#fafcff)}
.modalTop h2{font-size:21px;margin:0;letter-spacing:-.04em}.close{border:0;background:#f2f5fb;height:36px;width:36px;border-radius:12px;font-size:20px;color:#637086}
.formGrid{padding:22px 25px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:grid;gap:8px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-weight:760;font-size:12px;color:#46536a;letter-spacing:.01em}.field input,.field textarea,.field select{width:100%;background:#f8fbff;padding:12px 12px;border:1px solid #dce4ef;border-radius:12px;color:var(--ink);outline:0}.field input:focus,.field textarea:focus,.field select:focus{border-color:#c8d3ea;background:white;box-shadow:0 0 0 4px rgba(79,107,255,.08)}.field textarea{resize:vertical;min-height:94px}
.modalFoot{padding:18px 25px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:linear-gradient(180deg,#fff,#fafcff)}.helper{margin:0;padding:0 25px 20px;color:#78859a;font-size:12px;line-height:1.6}
.toast{position:fixed;z-index:40;bottom:23px;right:26px;background:#14243c;color:white;border-radius:14px;padding:13px 18px;box-shadow:0 18px 40px rgba(21,34,56,.26);display:none;font-weight:700;font-size:12px;max-width:calc(100vw - 40px)}.toast.show{display:block}
.tips{font-size:12px;color:var(--muted);line-height:1.8}.tipItem{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.tipItem:last-child{border:0}.tipCheck{color:var(--good);font-weight:900}.footer{text-align:center;font-size:11px;color:#97a2b2;margin-top:18px}.kpiIcon{font-size:19px}.reportRow{display:flex;padding:12px 0;border-bottom:1px solid var(--line);justify-content:space-between;gap:12px}.reportRow:last-child{border-bottom:0}
@media (max-width:1150px){
  .workspaceBar{grid-template-columns:1fr 1fr}
  .workspaceLead{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboardGrid,.twoPanels{grid-template-columns:1fr}
}
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;min-height:auto}
  .topbar{position:relative;padding:18px 18px}
  .content{padding:20px 18px 50px}
}
@media (max-width:720px){
  .heading{flex-direction:column}
  .stats,.workspaceBar,.sideMiniGrid,.dataGrid,.twoPanels,.formGrid{grid-template-columns:1fr}
  .workspaceLead{grid-column:auto}
  .topRight{justify-content:flex-start}
  .banner{flex-direction:column;align-items:flex-start}
  .panelHead,.panelBody,.toolbar{padding-left:16px;padding-right:16px}
  th,td{padding:13px 14px}
}

/* Refinamiento móvil y accesibilidad empresarial */
@media(max-width:920px){
  .shell{display:block}
  .sidebar{position:relative;top:auto;height:auto;min-height:0;padding:16px 16px 13px;box-shadow:none}
  .sidebar>.sideFoot,.sideCard,.sideFoot{display:none}
  .brand{padding:0 2px 12px}
  .brandIcon{height:39px;width:39px;border-radius:12px;font-size:19px}
  .brand span{font-size:19px}
  .navLabel{display:none}
  .nav{display:flex;overflow-x:auto;padding:1px 0 4px;gap:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;min-width:max-content;padding:8px 12px;border-radius:11px;white-space:nowrap;font-size:12px;gap:8px}
  .nav button b{width:24px;height:24px;font-size:13px;border-radius:7px}
  .topbar{padding:16px;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
  .topbarTitle{font-size:21px}
  .topbarSub{font-size:12px;line-height:1.45}
  .topRight{width:100%;justify-content:flex-start}
  .avatar{display:none}
  .content{padding:20px 14px 48px}
}
@media(max-width:650px){
  .heading h1{font-size:27px}
  .statValue{font-size:24px}
  .workspaceMetricValue{font-size:23px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:16px 14px}
  .statLabel{font-size:11px}
  .statIcon{width:32px;height:32px;font-size:15px}
  .statNote{font-size:10px}
  .workspaceBar{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .workspaceLead{grid-column:1/-1}
  .workspaceMetric{padding:14px 12px}
  .workspaceMetricLabel{font-size:10px}
  .workspaceMetric:nth-child(4){grid-column:1/-1}
  .toolbar .left{min-width:0;width:100%;flex-wrap:wrap}
  .search{min-width:0}
  .select{max-width:none}
  .btn{min-height:43px;padding:10px 12px}
  .banner{padding:20px}
  .banner strong{font-size:17px}

 equipmentRows(){return db.equipment.filter(x=>[x.name,x.category,x.serial,APP.client(x.clientId)?.name].join(' ').toLowerCase().includes(search.toLowerCase())).filter(x=>filter==='todos'||(filter==='atrasados'&&x.next<today())||(filter==='proximos'&&x.next>=today()&&x.next<=plusDays(today(),30))).sort((a,b)=>a.next.localeCompare(b.next)).map(q=>{const c=APP.client(q.clientId);const d=daysBetween(today(),q.next);return [cellName(q.name,q.serial||q.category),h(c?.name||'Cliente'),h(q.category),`${dateText(q.next)}<div class="meta">Cada ${h(q.frequency)} días</div>`,d<0?pill('Atrasado '+Math.abs(d)+' d','bad'):d<=30?pill('Próximo · '+d+' d','warn'):pill('Al día','good'),`<div class="rowActions">${btn('Ver ficha','viewEq',q.id)}${smallLink('Visita','addOrder',q.id)}${smallLink('Editar','editEq',q.id)}</div>`]})},
 agendaRows(){return APP.schedule().filter(q=>[q.name,APP.client(q.clientId)?.name].join(' ').toLowerCase().includes(search.toLowerCase())).map(q=>{const c=APP.client(q.clientId);return [cellName(q.name,c?.name||''),dateText(q.next),q.next<today()?pill('Vencido','bad'):pill('Próximo','warn'),`<div class="rowActions">${btn('Realizar servicio','addOrder',q.id)}${smallLink('Avisar','wa',q.id)}</div>`]})},
 historyRows(){return [...db.orders].sort((a,b)=>b.date.localeCompare(a.date)).filter(o=>{const q=APP.eq(o.equipmentId);return [o.notes,o.technician,q?.name].join(' ').toLowerCase().includes(search.toLowerCase())}).map(o=>{const q=APP.eq(o.equipmentId);return [dateText(o.completedDate||o.date),cellName(q?.name||'Equipo eliminado',APP.client(q?.clientId)?.name||''),pill(o.status==='realizado'?'Realizado':'Planificado',o.status==='realizado'?'good':'warn'),h(o.technician||'—'),money(o.cost),`<div class="rowActions">${smallLink('Informe PDF','orderPdf',o.id)}${smallLink('Eliminar','delOrder',o.id)}</div>`]})},
 list(){if(tab==='equipos')return table(['Equipo','Cliente','Categoría','Próximo','Estado','Acciones'],APP.equipmentRows());if(tab==='agenda')return table(['Equipo / Cliente','Vencimiento','Estado','Acción'],APP.agendaRows());return table(['Fecha','Equipo','Estado','Técnico','Costo','Acciones'],APP.historyRows())},
 render(tab){const late=APP.urgent().length,soon=APP.schedule().length,done=db.orders.filter(x=>x.status==='realizado').length;
 if(tab==='inicio')return `<div class="heading"><div><p class="eyebrow">Mantenimiento preventivo</p><h1>Que ningún servicio se te pase.</h1><p class="sub">Equipos, intervenciones y fechas de mantenimiento, organizados para trabajar mejor.</p></div><div class="actions">${btn('＋ Nuevo equipo','newEq','','primary')}${btn('＋ Cliente','newClient')}</div></div><div class="banner"><div><strong>La próxima visita, siempre a la vista.</strong><p>Controlá equipos con servicio vencido o que vence en los próximos 30 días.</p></div>${btn('Abrir agenda →','goAgenda','','primary')}</div>${stats([card('Equipos registrados',db.equipment.length,'⚙','En seguimiento'),card('Servicios vencidos',late,'⚠','Necesitan atención'),card('Próximos 30 días',soon,'📅','Incluye los vencidos'),card('Trabajos realizados',done,'✔','Historial registrado')])}<div class="dashboardGrid">${panel('Próximos mantenimientos',table(['Equipo / Cliente','Fecha','Estado',''],APP.schedule().slice(0,7).map(q=>[cellName(q.name,APP.client(q.clientId)?.name||''),dateText(q.next),q.next<today()?pill('Vencido','bad'):pill('Próximo','warn'),smallLink('Registrar','addOrder',q.id)])))}${panel('Accesos rápidos',`<div class="panelBody stack"><button class="quick" data-action="newClient"><span class="quickIcon">👤</span><span><strong>Nuevo cliente</strong><small>Empresa, teléfono y dirección</small></span></button><button class="quick" data-action="newEq"><span class="quickIcon">⚙️</span><span><strong>Registrar equipo</strong><small>Frecuencia y próxima visita</small></span></button><button class="quick" data-action="goHistory"><span class="quickIcon">📄</span><span><strong>Ver historial</strong><small>Informes de tareas realizadas</small></span></button></div>`)}</div>`;
 if(tab==='equipos')return `<div class="heading"><div><p class="eyebrow">Inventario técnico</p><h1>Equipos bajo mantenimiento</h1><p class="sub">Asociá cada equipo a un cliente y configurá cuándo necesita volver a revisarse.</p></div><div class="actions">${btn('＋ Nuevo cliente','newClient')}${btn('＋ Nuevo equipo','newEq','','primary')}</div></div>${panel('Listado de equipos',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar equipo, cliente o número de serie..." value="${h(search)}"><select class="select" data-filter="true"><option value="todos">Todos</option><option value="atrasados" ${filter==='atrasados'?'selected':''}>Vencidos</option><option value="proximos" ${filter==='proximos'?'selected':''}>Próximos</option></select></div></div><div id="dynamicList">${APP.list()}</div>`)}`;
 if(tab==='agenda')return `<div class="heading"><div><p class="eyebrow">Agenda preventiva</p><h1>Servicios por realizar</h1><p class="sub">Equipos con mantenimiento vencido o programado dentro de 30 días.</p></div>${btn('＋ Cargar servicio','addOrder','','primary')}</div>${stats([card('Vencidos',late,'⚠','Revisar con prioridad'),card('En próximos 30 días',soon-late,'🗓','Planificar visita')])}${panel('Agenda de vencimientos',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar equipo o cliente..." value="${h(search)}"></div></div><div id="dynamicList">${APP.list()}</div>`)}`;
 return `<div class="heading"><div><p class="eyebrow">Registro técnico</p><h1>Historial de servicios</h1><p class="sub">Intervenciones documentadas con fecha, técnico y observaciones.</p></div>${btn('＋ Nueva intervención','addOrder','','primary')}</div>${panel('Trabajos registrados',`<div class="toolbar"><div class="left"><input class="search" data-search="true" placeholder="Buscar intervención..." value="${h(search)}"></div></div><div id="dynamicList">${APP.list()}</div>`)}`},
 report(){return {subtitle:'Equipos y próximos servicios',headers:['Equipo','Cliente','Categoría','Serie','Frecuencia (días)','Último servicio','Próximo servicio'],rows:db.equipment.map(q=>[q.name,APP.client(q.clientId)?.name||'',q.category,q.serial,q.frequency,dateText(q.last),dateText(q.next)]),summary:[['Clientes',db.clients.length],['Equipos',db.equipment.length],['Servicios vencidos',APP.urgent().length],['Intervenciones registradas',db.orders.length]]}},
 actions:{
 goAgenda(){tab='agenda';render()},goHistory(){tab='historial';render()},
 newClient(){modal('Nuevo cliente',[{name:'name',label:'Nombre / razón social',wide:true},{name:'phone',label:'WhatsApp',type:'tel',required:false},{name:'address',label:'Dirección',required:false,wide:true}],v=>db.clients.push({id:uid(),...v}))},
 newEq(){if(!db.clients.length){APP.actions.newClient();notify('Primero registrá un cliente');return}modal('Registrar equipo',[{name:'clientId',label:'Cliente',type:'select',wide:true,options:db.clients.map(c=>({value:c.id,label:c.name}))},{name:'name',label:'Nombre del equipo',wide:true},{name:'category',label:'Tipo de equipo',type:'select',options:['Climatización','Calefacción','Electricidad','Bombas','Portones','Seguridad','Otro']},{name:'serial',label:'Número de serie',required:false},{name:'frequency',label:'Frecuencia de revisión (días)',type:'number',min:1,default:90},{name:'last',label:'Último servicio realizado',type:'date',default:today()},{name:'next',label:'Próximo vencimiento',type:'date',default:plusDays(today(),90)}],v=>db.equipment.push({...v,id:uid(),frequency:num(v.frequency)}))},
 editEq(id){const q=APP.eq(id);if(!q)return;modal('Editar equipo',[{name:'clientId',label:'Cliente',type:'select',wide:true,options:db.clients.map(c=>({value:c.id,label:c.name}))},{name:'name',label:'Nombre del equipo',wide:true},{name:'category',label:'Tipo de equipo',type:'select',options:['Climatización','Calefacción','Electricidad','Bombas','Portones','Seguridad','Otro']},{name:'serial',label:'Número de serie',required:false},{name:'frequency',label:'Frecuencia de revisión (días)',type:'number',min:1},{name:'last',label:'Último servicio',type:'date'},{name:'next',label:'Próximo vencimiento',type:'date'}],v=>Object.assign(q,v,{frequency:num(v.frequency)}),q)},
 addOrder(id){if(!db.equipment.length){notify('Primero registrá un equipo');APP.actions.newEq();return}modal('Registrar intervención',[{name:'equipmentId',label:'Equipo',type:'select',wide:true,options:db.equipment.map(q=>({value:q.id,label:q.name+' — '+(APP.client(q.clientId)?.name||'')}))},{name:'date',label:'Fecha de la intervención',type:'date',default:today()},{name:'status',label:'Resultado',type:'select',options:[{value:'realizado',label:'Servicio realizado'},{value:'pendiente',label:'Visita programada'}]},{name:'technician',label:'Técnico responsable',required:false},{name:'cost',label:'Importe del servicio ($)',type:'number',min:0,default:0},{name:'notes',label:'Trabajos, observaciones y repuestos',type:'textarea',wide:true,required:false}],v=>{const q=APP.eq(v.equipmentId);if(v.status==='realizado'){q.last=v.date;q.next=plusDays(v.date,q.frequency)}db.orders.push({...v,id:uid(),cost:num(v.cost),completedDate:v.status==='realizado'?v.date:''})},{equipmentId:id||db.equipment[0].id},'Marcar como realizado actualizará automáticamente la próxima fecha del equipo.')},
 wa(id){const q=APP.eq(id),c=APP.client(q?.clientId);if(!q||!c)return;msgLink(c.phone,`Hola ${c.name}, les recordamos que el equipo ${q.name} tiene su próximo mantenimiento previsto para el ${dateText(q.next)}. ¿Podemos coordinar una visita? Muchas gracias.`)},
 orderPdf(id){const o=db.orders.find(x=>x.id===id);if(!o)return;const q=APP.eq(o.equipmentId),c=APP.client(q?.clientId);printReport('Informe de mantenimiento — '+(q?.name||''),['Campo','Detalle'],[['Cliente',c?.name||''],['Dirección',c?.address||''],['Equipo',q?.name||''],['Número de serie',q?.serial||''],['Fecha',dateText(o.date)],['Estado',o.status==='realizado'?'Realizado':'Programado'],['Técnico',o.technician],['Descripción',o.notes],['Costo',money(o.cost)]],'Comprobante de intervención')},
 delOrder(id){if(confirm('¿Eliminar esta intervención? Si era un servicio realizado, revisá la próxima fecha del equipo manualmente.')){db.orders=db.orders.filter(o=>o.id!==id);save()}}
 }
};
