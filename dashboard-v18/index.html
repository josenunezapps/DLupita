<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard V18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ececf0; --panel:#f4f4f7; --card:#fff; --ink:#15151a; --mute:#8a8a96; --line:#e6e6ec;
  --lav:#c9c3f5; --lav2:#e7e3fd; --pink:#f6cde6; --mint:#d5efdc; --sky:#d8e4fb; --accent:#4b3fd6;
  --r:22px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:#e9e7f2;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vw;height:46vw;background:#b9adf7;left:8%;top:-12%}
.orbs i:nth-child(2){width:38vw;height:38vw;background:#f6b9dc;right:-6%;top:22%;animation-duration:26s}
.orbs i:nth-child(3){width:34vw;height:34vw;background:#b6e8d2;left:28%;bottom:-18%;animation-duration:30s}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.12)}}
.app{display:flex;gap:18px;height:100vh;height:100dvh;padding:18px;position:relative;z-index:1}
/* ---------- Sidebar ---------- */
.side{width:64px;flex:none;background:rgba(13,13,16,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:40px;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;position:relative;z-index:5}
.logo{color:#fff;font-weight:800;font-style:italic;font-size:20px;letter-spacing:-2px;margin-bottom:22px}
.nav{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#9a9aa6;position:relative;transition:color .25s}
.nav svg{width:19px;height:19px;position:relative;z-index:1}
@media (hover:hover){.nav:hover{color:#fff}}
.nav.on{color:#2b2290}
.pill{position:absolute;left:11px;width:42px;height:42px;border-radius:50%;background:var(--lav2);transition:transform .55s var(--ease);top:0}
.nav .tip{position:absolute;left:58px;background:#0d0d10;color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateX(-6px);pointer-events:none;transition:.25s var(--ease)}
.nav .tip::before{content:"";position:absolute;left:-12px;top:50%;width:8px;height:16px;margin-top:-8px;background:#0d0d10;border-radius:0 8px 8px 0}
@media (hover:hover){.nav:hover .tip{opacity:1;transform:none}}
.spacer{flex:1}

/* ---------- Main ---------- */
.main{flex:1;background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);border:1px solid rgba(255,255,255,.6);border-radius:30px;overflow:auto;position:relative;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.view{padding:28px 30px 40px;min-height:100%}
.view.enter{animation:viewIn .8s var(--ease) both}
@keyframes viewIn{from{opacity:.25;filter:blur(18px) saturate(.4) brightness(1.15);transform:scale(.985)}to{opacity:1;filter:none;transform:none}}
.view.leave{animation:viewOut .28s ease-in forwards;pointer-events:none}
@keyframes viewOut{to{opacity:.3;filter:blur(14px) saturate(.3) brightness(1.2);transform:scale(.99)}}
.veil{position:absolute;inset:0;background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none;opacity:0;z-index:3;border-radius:inherit}
.veil.on{animation:veil .9s var(--ease)}
@keyframes veil{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.view.enter .rv{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

h1{font-size:30px;font-weight:600;letter-spacing:-.8px}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.card{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 30px -14px rgba(60,40,140,.18);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card.hv:hover{transform:translateY(-5px);box-shadow:0 18px 40px -18px rgba(40,30,120,.25)}
.ct{font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.chip{font-size:11px;font-weight:600;background:#0d0d10;color:#fff;border-radius:20px;padding:3px 9px}
.btn{background:#0d0d10;color:#fff;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:14px;height:14px}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
.ico svg{width:14px;height:14px}

/* ---------- Dashboard grid ---------- */
.dash{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.left{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-content:start}
.hero{grid-column:1/-1;background:linear-gradient(110deg,#d4cdfa 0%,#e6dffc 55%,#f8d6ee 100%);position:relative;overflow:hidden;min-height:150px}
.hero h2{font-size:22px;font-weight:600;letter-spacing:-.5px;max-width:330px}
.hero p{font-size:12px;color:#55516e;max-width:300px;margin:8px 0 14px}
.hero .blob{position:absolute;right:20px;top:-20px;width:200px;animation:float 6s ease-in-out infinite}
.hero>*:not(.blob){position:relative;z-index:1}
@keyframes float{50%{transform:translateY(12px) rotate(6deg)}}
.members{grid-column:span 1}
.av{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.av div{text-align:center;font-size:10px;color:var(--mute)}
.av i{display:block;width:40px;height:40px;border-radius:50%;margin:0 auto 4px;font-style:normal;color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.big{font-size:30px;font-weight:600;letter-spacing:-1px}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:12px}
.bar b{display:block;height:100%;background:#0d0d10;border-radius:6px;width:0;transition:width 1.2s var(--ease) .3s}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}
.bars span{flex:1;border-radius:10px;background:linear-gradient(#c9c3f5,#e8e4fd);height:0;transition:height 1s var(--ease)}
.bars span.hi{background:linear-gradient(#7f72ee,#c9c3f5)}
.stats{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:20px;padding:3px}
.tabs button{font-size:11px;padding:4px 10px;border-radius:16px;font-weight:600;color:var(--mute);transition:.25s}
.tabs button.on{background:#0d0d10;color:#fff}
.mini{background:rgba(255,255,255,.5);border-radius:16px;padding:14px;text-align:center;font-size:11px;color:var(--mute)}
.ring{display:block;width:56px;height:56px;margin:0 auto 6px}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.promo{background:#0d0d10;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:180px}
.promo h3{font-size:17px;font-weight:600;line-height:1.2}
.promo p{font-size:11px;color:#a5a5b4;margin:6px 0 12px}
.promo .blob{position:absolute;right:-20px;top:-34px;width:130px;animation:float 7s ease-in-out infinite}
.promo>*:not(.blob){position:relative;z-index:1}
.promo h3{max-width:70%}
.promo .btn{background:var(--lav);color:#16123d;align-self:flex-start}
.right{display:flex;flex-direction:column;gap:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center;font-size:11px}
.cal .d{color:var(--mute);font-size:10px}
.cal button{height:34px;border-radius:12px;font-weight:600;font-size:12px;transition:.25s}
.cal button:hover{background:var(--bg)}
.cal button.on{background:#0d0d10;color:#fff}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vid{border-radius:14px;background:rgba(255,255,255,.5);padding:8px;font-size:11px;font-weight:500}
.vid .th{height:74px;border-radius:10px;background:#f0eef8;display:grid;place-items:center;margin-bottom:6px;position:relative}
.vid .th svg{width:62px}
.vid .th .chip{position:absolute;top:6px;left:6px;font-size:9px}
.notif{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.notif:last-child{border:0}
.notif i{width:30px;height:30px;border-radius:50%;flex:none}
.notif small{display:block;color:var(--mute);font-size:10px;margin-top:2px}
.notif .chip{margin-left:auto;background:var(--bg);color:var(--ink)}

/* ---------- Saved ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.filters{display:flex;gap:6px;align-items:center}
.filters button{font-size:12px;font-weight:500;padding:6px 12px;border-radius:20px;transition:.25s}
.filters button.on{background:#0d0d10;color:#fff}
.saved{display:grid;grid-template-columns:1fr 280px;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.item{padding:8px}
.item .th{height:120px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden}
.item .th .chip{position:absolute;top:10px;left:10px}
.item .th .gl{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.75);display:grid;place-items:center}
.item .th .gl svg{width:22px}
.item .th>svg.b{width:110px;transition:transform .6s var(--ease)}
.item:hover .th>svg.b{transform:scale(1.1) rotate(8deg)}
.item h4{font-size:13px;font-weight:600;margin:12px 6px 10px;line-height:1.3;min-height:34px}
.meta{display:flex;align-items:center;gap:6px;padding:0 6px 4px;font-size:11px}
.meta small{display:block;color:var(--mute);font-size:10px}
.meta .ico{margin-left:auto;width:28px;height:28px}
.meta .ico+.ico{margin-left:0}
.meta .ico.bm{background:var(--lav2);color:var(--accent)}
.item.gone{animation:out .45s var(--ease) forwards}
@keyframes out{to{opacity:0;transform:scale(.9);filter:blur(6px)}}
.col{display:flex;gap:12px;align-items:center;padding:10px 0}
.col .ico{border-radius:12px;width:36px;height:36px;flex:none}
.col div{flex:1;font-size:13px;font-weight:500}
.col small{color:var(--mute);font-size:11px;float:right}

/* ---------- Cloud ---------- */
.cloud{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
.donut{display:flex;gap:20px;align-items:center;margin-top:14px}
.donut svg{width:140px;height:140px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16}
.leg div{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
.leg i{width:10px;height:10px;border-radius:4px}
.files{grid-column:1/-1}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 80px;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:13px}
.row.h{color:var(--mute);font-size:11px;font-weight:600}
.row span:first-child{display:flex;gap:10px;align-items:center;font-weight:500}

/* ---------- Generic / Profile ---------- */
.prof{display:grid;grid-template-columns:1fr 2fr;gap:16px}
.cover{height:110px;border-radius:16px;background:linear-gradient(110deg,#d4cdfa,#f8d6ee);margin:-6px -6px 0}
.pav{width:84px;height:84px;border-radius:50%;border:5px solid #fff;margin:-42px auto 8px;background:linear-gradient(135deg,#7f72ee,#f29ac9);display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px}
.center{text-align:center}
.kv{display:flex;justify-content:space-around;margin-top:14px;text-align:center}
.kv b{display:block;font-size:20px}
.kv small{color:var(--mute);font-size:11px}
.empty{display:grid;place-items:center;height:60vh;text-align:center;color:var(--mute)}
.empty svg{width:120px;margin-bottom:10px}
.msg{display:flex;gap:10px;margin:12px 0}
.msg p{background:var(--panel);padding:10px 14px;border-radius:16px;font-size:13px;max-width:70%}
.msg.me{justify-content:flex-end}.msg.me p{background:#0d0d10;color:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}
.sw{width:42px;height:24px;border-radius:20px;background:#d6d6de;position:relative;transition:.3s}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.35s var(--ease)}
.sw.on{background:#0d0d10}.sw.on::after{left:21px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .dash{grid-template-columns:1fr}
  .saved{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  body{overflow:auto}
  .app{flex-direction:column-reverse;padding:10px;gap:10px;height:100dvh}
  .side{flex-direction:row;width:100%;height:60px;border-radius:30px;padding:0 10px;justify-content:space-between;gap:0}
  .logo,.spacer,.nav[data-v=logout]{display:none}
  .pill{top:9px !important;left:0}
  .nav .tip{display:none}
  .main{border-radius:24px}
  .view{padding:20px 16px 30px}
  h1{font-size:24px}
  .left{grid-template-columns:1fr 1fr}
  .stats,.hero{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr}
  .stats .ct{grid-column:1/-1}
  .grid3,.cloud,.prof{grid-template-columns:1fr}
  .row{grid-template-columns:1.6fr 1fr 60px}.row>:nth-child(3){display:none}
  .hero .blob{width:130px;right:-30px;top:-40px;opacity:.85}
  .hero h2{max-width:75%}
  .left>.card:nth-child(4){grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side" id="side">
    <div class="logo">//'</div>
    <div class="pill" id="pill"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
// ---------- Iconos (trazo estilo lucide) ----------
const P = {
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  grid:'<circle cx="7" cy="7" r="1.6"/><circle cx="17" cy="7" r="1.6"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 13 3 3 0 0 0 6 19z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  arrow:'<path d="M7 17 17 7M8 7h9v9"/>',
  play:'<path d="m7 4 13 8-13 8z"/>',
  restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>'
};
const ic = (n,f) => `<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

// ---------- Blob 3D orgánico (SVG con turbulencia) ----------
let bid=0;
function blob(c1,c2,c3,seed=3){
  const id='b'+(bid++);
  return `<svg class="b" viewBox="0 0 200 200"><defs>
   <radialGradient id="${id}g" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></radialGradient>
   <filter id="${id}f" x="-20%" y="-20%" width="140%" height="140%">
     <feTurbulence type="fractalNoise" baseFrequency=".028" numOctaves="2" seed="${seed}" result="n"/>
     <feDisplacementMap in="SourceGraphic" in2="n" scale="46"/>
     <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${seed}" result="g"/>
     <feColorMatrix in="g" type="saturate" values="0" result="g2"/>
     <feComposite in="g2" in2="SourceGraphic" operator="in" result="gr"/>
     <feBlend in="SourceGraphic" in2="gr" mode="soft-light"/>
   </filter>
   <radialGradient id="${id}s"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
   <ellipse cx="100" cy="172" rx="62" ry="10" fill="url(#${id}s)"/>
   <circle cx="100" cy="96" r="62" fill="url(#${id}g)" filter="url(#${id}f)"/></svg>`;
}
const B = {
  purple:()=>blob('#d9a8ff','#8a3fe0','#3c1580',3),
  magenta:()=>blob('#ffb3cf','#c42d6b','#5e0f32',7),
  teal:()=>blob('#a6f0d8','#1f9a7a','#0b4a3b',11),
  lav:()=>blob('#ffffff','#c7b8ff','#7a63e6',5)
};

// ---------- Navegación ----------
const NAV=[['video','Videos'],['user','Perfil'],['grid','Dashboard'],['bookmark','Guardados'],['cloud','Nube'],['chat','Mensajes'],['gear','Ajustes'],['phone','Llamadas']];
const side=document.getElementById('side'), pill=document.getElementById('pill'), main=document.getElementById('main');
NAV.forEach(([k,t])=>side.insertAdjacentHTML('beforeend',`<button class="nav" data-v="${k}" aria-label="${t}">${ic(k)}<span class="tip">${t}</span></button>`));
side.insertAdjacentHTML('beforeend',`<div class="spacer"></div><button class="nav" data-v="logout" aria-label="Salir">${ic('logout')}<span class="tip">Salir</span></button>`);

function movePill(btn){
  const mobile = innerWidth<=760;
  if(mobile){pill.style.transform=`translateX(${btn.offsetLeft}px)`}
  else{pill.style.transform=`translateY(${btn.offsetTop}px)`}
}
let navId=0;
function go(v){
  if(v==='logout'){v='grid'}
  const btn=side.querySelector(`[data-v="${v}"]`);
  side.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b===btn));
  movePill(btn);
  try{history.replaceState(null,'','#'+v)}catch(e){}
  const cur=main.querySelector('.view'), myTurn=++navId;
  const render=()=>{
    if(myTurn!==navId)return;
    main.innerHTML=`<div class="veil"></div><div class="view enter">${(VIEWS[v]||VIEWS.grid)()}</div>`;
    main.scrollTop=0;
    main.querySelectorAll('.rv').forEach((e,i)=>e.style.setProperty('--i',i));
    main.querySelector('.veil').classList.add('on');
    requestAnimationFrame(()=>requestAnimationFrame(()=>afterRender(v)));
  };
  if(cur&&!matchMedia('(prefers-reduced-motion:reduce)').matches){cur.classList.remove('enter');cur.classList.add('leave');setTimeout(render,260)}
  else render();
}
side.addEventListener('click',e=>{const b=e.target.closest('.nav');if(b)go(b.dataset.v)});

function ring(p,c){const L=2*Math.PI*22;return `<svg class="ring" viewBox="0 0 56 56" style="transform:rotate(-90deg)"><circle cx="28" cy="28" r="22" stroke="#e4e4ea"/><circle class="rg" cx="28" cy="28" r="22" stroke="${c}" stroke-dasharray="0 ${L}" data-len="${p*L}" data-tot="${L}" style="transition:stroke-dasharray 1.2s var(--ease) .3s"/></svg>`}

// ---------- Animaciones post-render ----------
function count(el,to){
  const suf=el.dataset.suf||'', dec=String(to).includes('.')?1:0, t0=performance.now(), D=1100;
  (function f(t){const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3);
    el.textContent=(to*e).toFixed(dec).replace('.',',')+suf; if(k<1)requestAnimationFrame(f)})(t0);
}
function afterRender(){
  main.querySelectorAll('[data-count]').forEach(e=>count(e,parseFloat(e.dataset.count)));
  main.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w);
  main.querySelectorAll('[data-h]').forEach((e,i)=>{e.style.transitionDelay=(i*70+200)+'ms';e.style.height=e.dataset.h});
  main.querySelectorAll('.rg').forEach(e=>e.setAttribute('stroke-dasharray',`${e.dataset.len} ${e.dataset.tot}`));
  main.querySelectorAll('.arc').forEach((e,i)=>{e.style.transition=`stroke-dasharray 1.1s var(--ease) ${300+i*150}ms`;e.setAttribute('stroke-dasharray',`${e.dataset.len} 377`)});
}

// ---------- Interacciones ----------
function tab(b,[a,c]){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');count(s1,a);count(s2,c)}
function filt(b){
  b.parentNode.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));
  const f=b.dataset.f, map={Videos:'Video',Docs:'Doc',Links:'Link'};
  document.querySelectorAll('#items .item').forEach((it,i)=>{
    const show=f=='Todo'||it.dataset.t==map[f];
    it.style.display=show?'':'none';
    if(show){it.classList.remove('rv');void it.offsetWidth;it.style.animation=`rise .5s var(--ease) ${i*40}ms both`}
  });
}
function unsave(b){
  const it=b.closest('.item');it.classList.add('gone');
  setTimeout(()=>{it.remove();cnt.textContent=document.querySelectorAll('#items .item').length;toast('Quitado de guardados')},430);
}
let tt;function toast(m){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#0d0d10;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.4s var(--ease);z-index:20';document.body.appendChild(t)}
  t.textContent=m;t.style.opacity=1;t.style.transform='translateX(-50%)';
  clearTimeout(tt);tt=setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(-50%) translateY(20px)'},1800);
}
