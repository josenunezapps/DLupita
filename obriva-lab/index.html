<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101922">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>OBRIVA — Control operativo</title>
<meta name="description" content="OBRIVA, espacio operativo para empresas de servicios. Versión laboratorio con datos locales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17232b;--muted:#7b878d;--nav:#111c23;--paper:#f5f7f4;--card:#fff;--line:#e7eae5;--lime:#c5fb75;--green:#276b47;--shadow:0 12px 40px rgba(23,39,34,.045)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:"DM Sans",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b5ed74;outline-offset:2px}
.app{min-height:100vh;display:flex}
aside{width:242px;flex-shrink:0;background:var(--nav);color:#e9f1ed;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:15}
.brand{display:flex;align-items:center;gap:11px;padding:32px 26px 35px}
.brand-mark{width:39px;height:39px;background:var(--lime);border-radius:13px;display:grid;place-items:center;color:#14231b;font-family:Manrope;font-size:25px;font-weight:800;transform:rotate(-7deg)}
.brand-mark span{transform:rotate(7deg)}
.brand b{font-family:Manrope;letter-spacing:-.06em;font-size:23px;font-weight:800}
.brand small{display:block;font-size:9px;letter-spacing:2.2px;color:#7e918d;margin-top:0}
.nav-caption{font-size:10px;letter-spacing:2px;font-weight:700;color:#71847e;padding:0 30px 12px}
nav{padding:0 13px;display:grid;gap:5px}
.nav-btn{display:flex;align-items:center;gap:12px;color:#9eaea8;text-align:left;width:100%;border:0;background:transparent;padding:13px 14px;border-radius:11px;font-weight:600;font-size:13px;transition:.15s}
.nav-btn:hover{background:#20302f;color:white}
.nav-btn.active{background:#26382f;color:var(--lime)}
.nav-btn svg{width:18px;height:18px;stroke-width:1.7}
.nav-btn .nav-count{margin-left:auto;font-size:10px;color:#bed7bf;background:#354c40;border-radius:6px;padding:2px 6px}
.nav-bottom{margin-top:auto;padding:15px 17px 25px}
.plan-card{background:linear-gradient(145deg,#273c35,#1b302b);border:1px solid #3b5743;border-radius:17px;padding:18px}
.plan-dot{width:8px;height:8px;background:var(--lime);border-radius:50%;display:inline-block;margin-right:5px}
.plan-card b{display:block;font-size:13px;margin:14px 0 6px}
.plan-card p{font-size:11px;color:#a3b8ac;line-height:1.6;margin:0}
.plan-card .cap{color:var(--lime);font-size:10px;font-weight:700;letter-spacing:1px}
.nav-user{display:flex;align-items:center;gap:11px;padding:22px 5px 0;font-size:12px}
.avatar{width:36px;height:36px;border-radius:12px;background:#d5e9c4;color:#34583e;display:grid;place-items:center;font-size:12px;font-weight:800}
.nav-user small{color:#879a90;display:block;margin-top:3px}
.workspace{min-width:0;flex:1}
.topbar{height:83px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,4.1vw,64px)}
.breadcrumb{color:#a0aaa6;font-size:12px;font-weight:700;display:flex;align-items:center;gap:13px}
.breadcrumb strong{color:#23322c;font-size:13px}
.top-actions{display:flex;align-items:center;gap:12px}
.today-pill{font-size:12px;color:#829189;border-right:1px solid var(--line);padding-right:20px}
.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 16px;color:var(--ink);font-weight:700;font-size:12px;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px #17232b13}
.btn-primary{background:#172720;border-color:#172720;color:#fff}
.btn-accent{background:var(--lime);border-color:var(--lime);color:#14291b}
.btn-ghost{background:transparent}
.btn-danger{background:#fff3f0;color:#a34535;border-color:#fae1d8}
.btn-sm{padding:8px 11px;font-size:11px;border-radius:8px}
.btn svg{height:15px;width:15px}
.mobile-toggle{display:none}
main{max-width:1570px;padding:43px clamp(24px,4.1vw,64px) 90px;margin:0 auto}
.eyebrow{font-size:10px;letter-spacing:2.3px;font-weight:800;color:var(--green);text-transform:uppercase;margin:0 0 10px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:25px;flex-wrap:wrap}
h1,h2,h3,h4,p{margin-top:0}h1,h2,h3,h4{font-family:Manrope,sans-serif;letter-spacing:-.055em}
h1{font-size:clamp(30px,3.2vw,43px);margin-bottom:5px;font-weight:800}
h2{font-size:20px;margin:0;font-weight:800}
h3{font-size:16px;margin-bottom:6px}
.sub{color:#85928b;font-size:13px;line-height:1.7;margin:0}
.grid{display:grid;gap:18px}.grid.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-height:149px;box-shadow:var(--shadow)}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-label{color:#84928c;font-size:12px;font-weight:600}
.stat-icon{width:34px;height:34px;border-radius:11px;background:#f1f5ef;display:grid;place-items:center;color:#3f6b50}
.stat-icon svg{width:17px;height:17px}
.stat strong{display:block;font:800 clamp(21px,2.2vw,30px) Manrope;letter-spacing:-.06em;margin:20px 0 7px}
.stat-foot{font-size:11px;color:#9aaa9c}
.stat-foot i{font-style:normal;color:#227649;font-weight:800}
.main-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:18px;margin-top:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px}
.link{border:0;background:transparent;color:#387c50;font-size:12px;font-weight:800}
.hero{background:#182b24;min-height:234px;border-radius:19px;color:#fff;display:grid;grid-template-columns:1.25fr .9fr;overflow:hidden;position:relative;margin-bottom:20px}
.hero-copy{padding:30px 32px;z-index:1}
.hero .eyebrow{color:var(--lime)}
.hero h2{font-size:clamp(23px,2.7vw,34px);line-height:1.22;max-width:520px;margin:10px 0 15px}
.hero p{color:#a5b9ae;font-size:12px;line-height:1.7;max-width:390px}
.hero-art{position:relative;isolation:isolate;overflow:hidden}
.orbit{width:270px;height:270px;border-radius:50%;border:1px solid #6f94735e;position:absolute;top:-48px;left:23px}
.orbit:before{content:"";position:absolute;inset:30px;border:1px solid #719a7a7b;border-radius:50%}
.orbit:after{content:"";position:absolute;inset:70px;border:1px solid #8cbf88a1;border-radius:50%}
.orbit-card{position:absolute;background:#e0ffc1;color:#233b2b;border-radius:14px;box-shadow:0 18px 55px #071e1666;padding:16px 19px;transform:rotate(-8deg);left:44px;top:43px;min-width:185px}
.orbit-card span{font-size:10px;color:#547158;display:block}
.orbit-card b{font:800 28px Manrope;letter-spacing:-.06em;display:block;margin-top:6px}
.orbit-card small{font-size:10px;color:#3f7146}
.orbit-chip{position:absolute;top:147px;left:120px;border:1px solid #607868;color:#e6f4e3;background:#344d3d;padding:10px 15px;border-radius:12px;transform:rotate(5deg);font-size:11px}
.kanban-list{display:grid;gap:11px}
.job-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid #f0f2ef}
.job-row:last-child{border:0}
.job-icon{width:41px;height:41px;background:#f1f6e9;border-radius:12px;display:grid;place-items:center;color:#3f6945;flex-shrink:0}
.job-row-body{min-width:0;flex:1}.job-row-body b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-row-body span{color:#9aa69e;font-size:11px;display:block;margin-top:5px}
.job-row time{font-size:11px;font-weight:700;color:#859489}
.tag{font-size:10px;font-weight:800;padding:6px 9px;border-radius:7px;white-space:nowrap;display:inline-flex;gap:5px}
.tag.scheduled{background:#e9f1fd;color:#3b68a0}.tag.working{background:#e8f3e1;color:#397549}
.tag.completed{background:#e7f3ed;color:#24845a}.tag.pending{background:#fdf0df;color:#9c702b}
.tag.cancelled{background:#f5e8e8;color:#b15a5a}.tag.accepted{background:#e5f3e7;color:#34774b}
.tag.rejected{background:#f5e9e8;color:#b55c57}.tag.converted{background:#eef0f3;color:#55606b}
.btn-wa{background:#e9f8ee;border-color:#c9ecd5;color:#1d7a45;text-decoration:none}
.wa-link{color:#1d7a45;font-weight:800;text-decoration:none}.wa-link:hover{text-decoration:underline}
.client-detail svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.form-actions .btn-danger{margin-right:auto}
.detail-block{margin-bottom:24px}.detail-block h3{font-size:14px;margin-bottom:12px}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.detail-stats div{border:1px solid var(--line);border-radius:12px;padding:12px}
.detail-stats span{font-size:11px;color:#7b878d;display:block}.detail-stats b{font:800 16px Manrope;letter-spacing:-.04em;display:block;margin-top:6px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.cash-figure{font:800 37px Manrope;letter-spacing:-.075em;margin:8px 0}
.cash-figure small{font-size:13px;letter-spacing:0;color:#84938a}
.progress-track{height:9px;background:#edf0e8;border-radius:100px;overflow:hidden;margin:16px 0 11px}
.progress-track i{height:100%;background:#94d278;border-radius:100px;display:block}
.legend{display:flex;justify-content:space-between;color:#8e9e93;font-size:11px;margin-bottom:20px}
.legend strong{color:#24382c}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{border:1px solid #e5ebe3;border-radius:11px;background:#fafcf8;padding:15px;text-align:left;font-size:11px;font-weight:800;color:#405949;display:flex;gap:8px;align-items:center}
.quick svg{width:16px;height:16px}
.panel-note{font-size:10px;color:#98a79c;margin-top:17px;line-height:1.6}
.toolbar{display:flex;justify-content:space-between;gap:13px;margin:22px 0 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:9px;padding:0 14px;border:1px solid #e2e7e0;border-radius:11px;background:white;min-width:240px;flex:1;max-width:420px}
.search svg{width:16px;height:16px;color:#97a49b}
.search input{width:100%;border:0;outline:0;background:transparent;height:43px;font-size:12px;color:#28372f}
.select{height:43px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;font-size:12px;color:#475a4d;min-width:140px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:780px;text-align:left}
th{font-size:10px;text-transform:uppercase;color:#93a198;letter-spacing:1.1px;font-weight:800;background:#fafbf9;padding:16px}
td{border-top:1px solid #f0f2ef;padding:17px 16px;font-size:12px;color:#58685d;vertical-align:middle}
td strong{color:#26362c;font-size:12px}td small{display:block;color:#a2ada5;margin-top:4px;font-size:10px}
.table-actions{display:flex;gap:5px}
.empty{padding:55px 20px;text-align:center;color:#819187;font-size:12px}
.empty strong{font:800 18px Manrope;color:#405346;display:block;margin-bottom:7px}
.avatar-sm{width:30px;height:30px;border-radius:10px;background:#e1ecd9;display:inline-grid;place-items:center;color:#4b7458;font-weight:800;font-size:10px;margin-right:8px;vertical-align:middle}
.client-grid,.staff-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.client-card,.staff-card{border:1px solid var(--line);background:#fff;padding:23px;border-radius:16px;min-width:0}
.client-top{display:flex;align-items:center;gap:12px;margin-bottom:17px}
.client-top .avatar{background:#e7efe2}
.client-top strong{display:block;font-size:13px}
.client-top small{display:block;font-size:10px;color:#9aaa9f;margin-top:4px}
.client-detail{font-size:11px;color:#839288;line-height:2.1;overflow-wrap:anywhere}
.client-divider{border-top:1px solid var(--line);margin:16px 0}
.client-footer{display:flex;align-items:center;justify-content:space-between}
.client-footer b{font:800 17px Manrope}
.client-footer small{font-size:10px;color:#9cab9f}
.agenda-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agenda-date{font:800 16px Manrope;margin:0 8px}
.day-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.day-col{min-height:310px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}
.staff-head{display:flex;align-items:center;gap:11px;padding-bottom:17px;border-bottom:1px solid var(--line);margin-bottom:15px}
.staff-head strong{font-size:12px;display:block}.staff-head span{font-size:10px;color:#98a89c}
.agenda-job{background:#f2f7eb;border-left:3px solid #8fc766;border-radius:10px;padding:15px;margin-bottom:10px}
.agenda-job b{font-size:12px;display:block;margin:7px 0}
.agenda-job span{font-size:11px;color:#799078}
.agenda-job .tag{margin-top:10px}
.agenda-job.muted{background:#f2f5fb;border-color:#94b7dd}
.agenda-job.done{background:#f0f4f1;border-color:#9ac5ac}
.quote-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.quote-card-info{flex:1;min-width:175px}.quote-card-info b{font-size:13px;display:block;margin-bottom:6px}
.quote-card-info small{font-size:11px;color:#91a098}.quote-price{font:800 21px Manrope;letter-spacing:-.05em}
.quote-actions{display:flex;gap:6px;flex-wrap:wrap}
.quote-list{display:grid;gap:11px}
.fin-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.fin-tile{border-radius:16px;background:#fff;border:1px solid var(--line);padding:23px}
.fin-tile b{font:800 clamp(20px,2.3vw,30px) Manrope;display:block;letter-spacing:-.06em;margin-top:16px}
.fin-tile span{font-size:12px;color:#8e9b90}
.fin-tile.dark{background:#192c23;color:#dcf4d0}.fin-tile.dark span{color:#a1bfa5}
.settings-box{max-width:680px}
.field{display:grid;gap:7px;font-size:11px;color:#6e8072;font-weight:800}
.field input,.field textarea,.field select{width:100%;border:1px solid #e2e7df;border-radius:10px;padding:12px;background:#fff;color:#22352b;font-size:13px;font-weight:500}
.field textarea{min-height:91px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.wide{grid-column:1/-1}.form-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.setting-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.callout{border:1px solid #e0e9d8;border-radius:14px;padding:17px;background:#f6faef;margin-top:20px;color:#657d66;font-size:12px;line-height:1.7}
.overlay{position:fixed;inset:0;background:#0f211bb0;z-index:55;display:flex;justify-content:flex-end;animation:fade .17s}
.drawer{background:#fff;width:min(100%,540px);height:100%;overflow:auto;padding:31px clamp(20px,3vw,39px);box-shadow:-20px 0 70px #17251f30;animation:slide .2s}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.drawer-head h2{font-size:24px}
.drawer .close{border:1px solid var(--line);width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:white;font-size:21px}
.drawer .eyebrow{margin-bottom:7px}
.toast{position:fixed;right:22px;bottom:22px;background:#1b3024;color:#fff;border-radius:12px;padding:14px 19px;font-size:12px;box-shadow:0 12px 36px #182b2552;z-index:100;max-width:350px}
.footer-note{margin-top:26px;font-size:11px;color:#a0ada3}
#mobile-backdrop{display:none}
#print-sheet{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateX(15px)}to{transform:translateX(0)}}
@media(max-width:1100px){.grid.stats{grid-template-columns:repeat(2,1fr)}.client-grid,.staff-grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1.2fr .7fr}.orbit-card{left:0}.orbit-chip{left:60px}}
@media(max-width:820px){aside{position:fixed;left:-260px;transition:left .2s}aside.open{left:0}#mobile-backdrop.show{display:block;position:fixed;inset:0;background:#13251a7b;z-index:14}.mobile-toggle{display:inline-flex}.today-pill{display:none}.main-grid{grid-template-columns:1fr}.day-board{grid-template-columns:1fr 1fr}.hero-art{display:none}.hero{display:block;min-height:0}.hero-copy{padding:27px}.topbar{padding:0 20px;height:74px}main{padding:28px 19px 80px}}
@media(max-width:560px){.grid.stats,.fin-tiles,.client-grid,.staff-grid,.day-board{grid-template-columns:1fr}.stat{min-height:0}.stat strong{margin-top:12px}.panel{padding:19px}.form-grid{grid-template-columns:1fr}.heading{align-items:start}.toolbar .search{max-width:none}.quote-price{width:100%}.topbar .btn-primary{padding:11px;font-size:0}.topbar .btn-primary svg{width:18px;height:18px}.hero h2{font-size:26px}.quick-actions{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}#app,#modal,#toast,#mobile-backdrop{display:none!important}#print-sheet{display:block!important;padding:32px;color:#111;font:14px Arial}#print-sheet h1{font:800 35px Arial}#print-sheet .print-line{border-top:1px solid #ddd;margin:28px 0}#print-sheet .print-row{display:flex;justify-content:space-between;margin:15px 0}}
</style>
</head>
<body>
<div id="mobile-backdrop"></div>
<div class="app" id="app">
<aside id="sidebar">
<div class="brand"><div class="brand-mark"><span>o</span></div><div><b>obriva<span style="color:var(--lime)">.</span></b><small>CONTROL OPERATIVO</small></div></div>
<div class="nav-caption">ESPACIO DE TRABAJO</div>
<nav id="navigation"></nav>
<div class="nav-bottom"><div class="plan-card"><span class="cap"><i class="plan-dot"></i> LABORATORIO V1</span><b>Todo bajo control.</b><p>De la primera consulta al último cobro. Un lugar para operar mejor.</p></div><div class="nav-user"><div class="avatar">OB</div><div><b>Espacio de prueba</b><small>Datos guardados en este dispositivo</small></div></div></div>
</aside>
<div class="workspace">
<header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="btn mobile-toggle" data-action="toggle-nav" aria-label="Abrir menú">☰</button><div class="breadcrumb"><span>Espacio de trabajo</span><span style="color:#c4cdc5">/</span><strong id="breadcrumb">Resumen</strong></div></div><div class="top-actions"><span class="today-pill" id="top-date"></span><button class="btn btn-primary" data-action="new-job"><span id="plus-icon"></span> Nueva orden</button></div></header>
<main id="view" aria-live="polite"></main>
</div>
</div>
<div id="modal"></div><div id="toast" role="status"></div><div id="print-sheet"></div>
<script>
(function(){
"use strict";
var KEY="obriva-lab-v1";
var paths={
home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
jobs:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
clients:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/>',
quotes:'<path d="M8 3h8l5 5v13H3V3z"/><path d="M16 3v6h5M7 13h10M7 17h7"/>',

if(a==="accept-quote"){var q=db.quotes.find(function(x){return x.id===id});if(q){q.status="accepted";save();render();notify("Presupuesto aceptado.")}}
if(a==="convert-quote")convertQuote(id);
if(a==="print-quote")printQuote(id);
if(a==="export"){download("obriva-respaldo-"+day(0)+".json",JSON.stringify({format:"obriva-v1",data:db,exportedAt:new Date().toISOString()},null,2));notify("Respaldo descargado.")}
if(a==="reset"){if(confirm("¿Restablecer los datos de ejemplo? Se perderán los cambios de este navegador.")){db=seed();filter="";statusFilter="all";save();render();notify("Datos de ejemplo restaurados.")}}});
document.getElementById("mobile-backdrop").addEventListener("click",closeNav);
document.addEventListener("submit",function(e){var form=e.target.closest("form[data-form]");if(!form)return;e.preventDefault();doSubmit(form)});
document.addEventListener("input",function(e){if(e.target.id!=="search-box")return;var inp=e.target,pos=inp.selectionStart;filter=inp.value;render();var next=document.getElementById("search-box");if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener("change",function(e){if(e.target.id==="status-filter"){statusFilter=e.target.value;render()}
if(e.target.id==="agenda-pick"&&e.target.value){agendaDate=e.target.value;render()}
if(e.target.id==="import-file"&&e.target.files[0]){var file=e.target.files[0];if(file.size>5000000){notify("El archivo supera los 5 MB.");return}var reader=new FileReader();reader.onload=function(){try{var source=JSON.parse(reader.result),data=source.data||source;if(!data||!Array.isArray(data.clients)||!Array.isArray(data.jobs)||!Array.isArray(data.quotes)||!Array.isArray(data.staff)||typeof data.business!=="string"){throw Error("Formato incorrecto")}if(!confirm("¿Importar el respaldo? Reemplazará los datos del navegador."))return;db=data;save();render();notify("Respaldo importado.")}catch(err){notify("No se pudo importar. Archivo JSON inválido.")}};reader.readAsText(file)}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();closeNav()}});
render();
})();
</script>
</body>
</html>
