<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carta Lo de Tito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Work+Sans:wght@400;600&display=swap">
<style>
/* Layout: carta de bodegón con pestañas sticky por categoría y barra de pedido fija abajo */
:root{
  --bg:#faf6f4;--surface:#ffffff;--fg:#2b1a1c;--muted:#7a6466;--line:#ead9d6;
  --accent:#7d1f2a;--accent-fg:#ffffff;--chip:#f1e4e1;
  --display:"Yeseva One",Georgia,serif;--body:"Work Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171012;--surface:#21181a;--fg:#f3e9e7;--muted:#b39c9e;--line:#3a2b2e;
  --accent:#e0707c;--accent-fg:#1a0d10;--chip:#2e2124;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171012;--surface:#21181a;--fg:#f3e9e7;--muted:#b39c9e;--line:#3a2b2e;
  --accent:#e0707c;--accent-fg:#1a0d10;--chip:#2e2124;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:24px 8px;text-align:center}
.demo{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(38px,10vw,56px)/1 var(--display);margin:8px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0}
.mode{display:flex;justify-content:center;gap:8px;margin:16px 0 4px}
.mode button,.tabs button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"],.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs-bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs button{white-space:nowrap}
section{padding-top:18px}
h2{font:400 26px var(--display);margin:0 0 6px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 0;border-bottom:1px dashed var(--line);align-items:center}
.item h3{margin:0;font-size:16px;font-weight:600}
.item p{margin:0;color:var(--muted);font-size:14px;grid-column:1}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.qty{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:8px;justify-self:end}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:600 18px var(--body);cursor:pointer}
.qty button.add{background:var(--accent);color:var(--accent-fg)}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .gut{display:flex;gap:12px;align-items:center}
.bar input{flex:0 0 92px;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:16px var(--body)}
.send{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none}
.send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
/* Compu: carta en dos columnas y barra de pedido centrada */
@media (min-width:900px){
  .gut{max-width:1100px}
  header{padding-block:48px 16px}
  h1{font-size:72px}
  main.gut{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;align-items:start}
  .tabs{justify-content:center}
  .bar .gut{max-width:720px}
  .qty button:hover,.mode button:hover,.tabs button:hover{filter:brightness(1.1)}
}
</style>
</head>
<body>

<header class="gut">
  <div class="demo">Ejemplo · Carta digital con QR</div>
  <h1>Lo de Tito</h1>
  <p class="sub">Bodegón desde 1987 · Pedí desde la mesa o para llevar</p>
  <div class="mode" role="group" aria-label="Tipo de pedido">
    <button id="mMesa" aria-pressed="true">En la mesa</button>
    <button id="mLlevar" aria-pressed="false">Para llevar</button>
  </div>
</header>

<div class="tabs-bar"><div class="gut tabs" id="tabs"></div></div>
<main class="gut" id="menu"></main>
<p class="foot gut">Carta y precios de ejemplo. El dueño edita platos y precios desde su celular.</p>

<div class="bar"><div class="gut">
  <input id="ref" placeholder="Mesa" inputmode="numeric" aria-label="Número de mesa">
  <a class="send" id="send" aria-disabled="true" target="_blank" rel="noopener"><span id="count">Elegí tus platos</span><span id="total" class="price"></span></a>
</div></div>

<script>
const WHATSAPP = "5491100000000";
const MENU = {
  "Entradas":[["Provoleta a la parrilla","Con orégano y aceite de oliva",9800],["Empanada de carne cortada a cuchillo","Unidad, al horno",2600],["Rabas","Con limón y alioli",14500]],
  "Principales":[["Milanesa napolitana","Con papas fritas, para compartir",21500],["Vacío a la parrilla","400 g con ensalada mixta",24800],["Sorrentinos de jamón y queso","Con salsa fileto",16900]],
  "Postres":[["Flan casero","Con dulce de leche y crema",6500],["Panqueque con dulce de leche","Quemado al azúcar",7200]],
  "Bebidas":[["Agua sin gas 500 ml","",2800],["Gaseosa línea Coca-Cola 1,5 L","",5600],["Vino de la casa (jarra)","Malbec mendocino",9500]]
};
const qty = {}; let mode = "mesa";
const fmt = n => "$" + n.toLocaleString("es-AR");
const tabs = document.getElementById("tabs"), menu = document.getElementById("menu");

Object.entries(MENU).forEach(([cat,items],ci)=>{
  const id="c"+ci;
  const t=document.createElement("button"); t.textContent=cat; if(ci===0) t.className="on";
  t.onclick=()=>{document.getElementById(id).scrollIntoView({behavior:"smooth"});[...tabs.children].forEach(b=>b.classList.toggle("on",b===t));};
  tabs.appendChild(t);
  const s=document.createElement("section"); s.id=id; s.innerHTML=`<h2>${cat}</h2>`;
  items.forEach(([name,desc,price])=>{
    const key=name; qty[key]=0;
    const el=document.createElement("div"); el.className="item";
    el.innerHTML=`<h3>${name}</h3><div class="qty"><button aria-label="Quitar ${name}" hidden>−</button><span hidden>0</span><button class="add" aria-label="Agregar ${name}">+</button></div><p>${desc?desc+" · ":""}<span class="price">${fmt(price)}</span></p>`;
    const [minus,num,plus]=el.querySelectorAll(".qty > *");
    const upd=()=>{num.textContent=qty[key];minus.hidden=num.hidden=qty[key]===0;refresh();};
    plus.onclick=()=>{qty[key]++;upd();}; minus.onclick=()=>{qty[key]--;upd();};
    s.appendChild(el);
  });
  menu.appendChild(s);
});

function lines(){const out=[];Object.values(MENU).flat().forEach(([n,,p])=>{if(qty[n])out.push([n,qty[n],p]);});return out;}
function refresh(){
  const L=lines(), units=L.reduce((a,l)=>a+l[1],0), total=L.reduce((a,l)=>a+l[1]*l[2],0);
  const send=document.getElementById("send"), ref=document.getElementById("ref").value.trim();
  document.getElementById("count").textContent = units ? `Enviar pedido (${units})` : "Elegí tus platos";
  document.getElementById("total").textContent = units ? fmt(total) : "";
  send.setAttribute("aria-disabled", units ? "false" : "true");
  const head = mode==="mesa" ? `Pedido mesa ${ref||"?"}` : `Pedido para llevar a nombre de ${ref||"?"}`;
  const body = L.map(([n,q,p])=>`• ${q} x ${n} — ${fmt(q*p)}`).join("\n");
  send.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`${head}\n${body}\nTotal: ${fmt(total)}`)}`;
}
document.getElementById("ref").oninput=refresh;
function setMode(m){mode=m;const r=document.getElementById("ref");
  document.getElementById("mMesa").setAttribute("aria-pressed",m==="mesa");
  document.getElementById("mLlevar").setAttribute("aria-pressed",m!=="mesa");
  r.placeholder=m==="mesa"?"Mesa":"Tu nombre"; r.inputMode=m==="mesa"?"numeric":"text";
  r.setAttribute("aria-label",m==="mesa"?"Número de mesa":"Tu nombre"); refresh();}
document.getElementById("mMesa").onclick=()=>setMode("mesa");
document.getElementById("mLlevar").onclick=()=>setMode("llevar");
// arranca con un pedido de muestra
qty["Milanesa napolitana"]=1; qty["Vino de la casa (jarra)"]=1;
document.querySelectorAll(".item").forEach(el=>{const n=el.querySelector("h3").textContent;if(qty[n]){const [m,s]=el.querySelectorAll(".qty > *");s.textContent=qty[n];m.hidden=s.hidden=false;}});
document.getElementById("ref").value="7"; refresh();
</script>

</body>
</html>
